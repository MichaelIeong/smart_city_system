apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-city-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-city-backend
  template:
    metadata:
      labels:
        app: smart-city-backend
    spec:
      containers:
        - name: backend
          image: your-registry/smart-city-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"