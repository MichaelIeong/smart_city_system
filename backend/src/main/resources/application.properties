# Server port
server.port=8080
# Context path
server.servlet.context-path=/
# Datasource settings
spring.datasource.url=jdbc:mysql://localhost:3306/smart_city?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Macao
spring.datasource.username=root
spring.datasource.password=123456a
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Logging settings
logging.level.org.springframework=INFO
logging.level.com.yourpackage=DEBUG
# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# spring mvc
spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.html
# spring servlet
spring.servlet.multipart.max-file-size=10MB
# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic=sensor_value
kafka.topic.producer=env_update
