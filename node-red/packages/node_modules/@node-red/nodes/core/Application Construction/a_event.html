<script type="text/html" data-template-name="Event">
    <div class="form-row">
        <label for="node-input-event_type"><i class="fa fa-bell"></i> 事件类型</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>加载中...</option>
        </select>
    </div>

    <div class="form-row" id="event-params-container" style="margin-top: 20px;">
        <label><i class="fa fa-list"></i> 事件参数</label>
        <div style="border: 1px solid #ccc; border-radius: 5px; padding: 10px; background: #f9f9f9; min-height: 50px;">
            <table id="params-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
                <thead>
                    <tr style="border-bottom: 1px solid #ddd; text-align: left;">
                        <th style="padding: 5px;">参数名</th>
                        <th style="padding: 5px;">类型</th>
                        <th style="padding: 5px;">描述</th>
                    </tr>
                </thead>
                <tbody id="params-body">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #999; padding: 10px;">请选择事件以查看参数</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</script>

<script type="text/javascript">
  (function () {
    // 缓存获取到的事件原始数据
    var cachedEvents = [];

    function getEnvironmentIp() {
        var hostname = window.location.hostname;
        return (hostname === "localhost" || hostname === "127.0.0.1") 
              ? "127.0.0.1" 
              : "10.176.65.202";
    }

    // 新增：根据选择的 eventType 渲染参数表格
    function updateParamsTable(selectedType) {
        var $body = $("#params-body");
        $body.empty();

        var eventData = cachedEvents.find(function(e) { return e.eventType === selectedType; });
        
        if (eventData && eventData.eventJson) {
            try {
                var json = JSON.parse(eventData.eventJson);
                var params = json.event_params;
                
                if (params && Object.keys(params).length > 0) {
                    Object.keys(params).forEach(function(key) {
                        var param = params[key];
                        var row = `<tr>
                            <td style="padding: 5px; border-bottom: 1px solid #eee;"><b>${key}</b></td>
                            <td style="padding: 5px; border-bottom: 1px solid #eee;"><span class="node-units">${param.type || 'string'}</span></td>
                            <td style="padding: 5px; border-bottom: 1px solid #eee; color: #666;">${param.description || '-'}</td>
                        </tr>`;
                        $body.append(row);
                    });
                } else {
                    $body.append('<tr><td colspan="3" style="text-align: center; padding: 10px;">无参数要求</td></tr>');
                }
            } catch (e) {
                console.error("解析 eventJson 失败", e);
                $body.append('<tr><td colspan="3" style="text-align: center; color: red;">数据格式错误</td></tr>');
            }
        } else {
            $body.append('<tr><td colspan="3" style="text-align: center; padding: 10px; color: #999;">请选择有效事件</td></tr>');
        }
    }

    RED.nodes.registerType("Event", {
        category: "应用构造",
        color: "#f89f9f",
        defaults: {
            event_type: { value: "" }
        },
        inputs: 0,
        outputs: 1,
        icon: "status.svg",
        label: function () {
            return this.event_type ? "触发事件：" + this.event_type : "触发事件：未选择";
        },
        paletteLabel: "事件触发",
        oneditprepare: function () {
            var node = this;
            var $event_type = $("#node-input-event_type");

            var urlParams = new URLSearchParams(window.location.search);
            var gId = urlParams.get("gridId");
            var determinedIp = getEnvironmentIp();

            var baseUrl = (determinedIp === "127.0.0.1") ? "http://127.0.0.1:8080" : "http://10.176.65.202:8080";
            
            // 动态加载数据
            $.getJSON(baseUrl + "/api/envEvent/list/" + gId)
                .done(function (data) {
                    if (Array.isArray(data)) {
                        cachedEvents = data; // 缓存数据供后续使用
                        $event_type.empty().append('<option value="" disabled selected>请选择触发事件</option>');
                        
                        data.forEach(function (item) {
                            var selected = (item.eventType === node.event_type) ? "selected" : "";
                            $event_type.append('<option value="' + item.eventType + '" ' + selected + '>' + item.eventType + " : " + item.description + '</option>');
                        });
                    }
                });
        },
        oneditsave: function () {
            this.event_type = $("#node-input-event_type").val();
        }
    });
    // 部署时实时提取 URL 参数并同步
    RED.events.on("deploy", function() {
        var urlParams = new URLSearchParams(window.location.search);
        var gId = urlParams.get("gridId");
        var pId = urlParams.get("projectId");
        var type = urlParams.get("type");
        var detIp = getEnvironmentIp();
        if (type !== "1") {
            return; 
        }
        if (!gId) {
            return;
        }
        $.ajax({
            url: "env-event/sync",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ gridId: gId, projectId: pId, ip: detIp }),
            success: function() { RED.notify("应用创建成功", "success"); },
            error: function(xhr) { 
                var errorMsg = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : "应用创建失败";
                RED.notify(errorMsg, "error"); 
            }
        });
    });
})();
</script>
