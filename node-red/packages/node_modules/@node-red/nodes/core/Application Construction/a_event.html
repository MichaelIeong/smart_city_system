<script type="text/html" data-template-name="Event">
    <div class="form-row">
        <label for="node-input-event_type"><i class="fa fa-bell"></i> 事件类型</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>加载中...</option>
        </select>
    </div>
    <input type="hidden" id="node-input-gridId">
    <input type="hidden" id="node-input-projectId">
    <input type="hidden" id="node-input-ip">
</script>

<script type="text/javascript">
  (function () {
    // 辅助函数：获取环境 IP
    function getEnvironmentIp() {
        var hostname = window.location.hostname;
        return (hostname === "localhost" || hostname === "127.0.0.1") 
              ? "127.0.0.1" 
              : "10.176.65.202";
    }

    // 辅助函数：从 URL 抓取并同步所有 Event 节点
    function syncUrlParamsToNodes() {
        var urlParams = new URLSearchParams(window.location.search);
        var gId = urlParams.get("gridId");
        var pId = urlParams.get("projectId");
        var determinedIp = getEnvironmentIp();

        if (!gId && !pId) return; // 如果 URL 没参数，不执行覆盖

        RED.nodes.eachNode(function(n) {
            if (n.type === "Event") {
                // 直接修改节点属性
                if (gId) n.gridId = gId;
                if (pId) n.projectId = pId;
                n.ip = determinedIp;
                // 标记为已改变，确保点击部署时会被包含在 payload 中
                n.changed = true; 
            }
        });
    }

    RED.nodes.registerType("Event", {
        category: "应用构造",
        color: "#f89f9f",
        defaults: {
            event_type: { value: "" },
            gridId: { value: "" },
            ip: { value: "" },
            projectId: { value: "" }
        },
        inputs: 0,
        outputs: 1,
        icon: "status.svg",
        label: function () {
            return this.event_type ? "触发事件：" + this.event_type : "触发事件：未选择";
        },
        paletteLabel: "事件触发",
        oneditprepare: function () {
            var node = this;
            var $event_type = $("#node-input-event_type");

            var urlParams = new URLSearchParams(window.location.search);
            var gId = urlParams.get("gridId");
            var pId = urlParams.get("projectId");
            var determinedIp = getEnvironmentIp();

            // 同步到隐藏域
            if (gId) $("#node-input-gridId").val(gId);
            if (pId) $("#node-input-projectId").val(pId);
            $("#node-input-ip").val(determinedIp);

            // 动态加载数据
            var baseUrl = (determinedIp === "127.0.0.1") ? "http://127.0.0.1:8080" : "http://10.176.65.202:8080";
            $.getJSON(baseUrl + "/api/envEvent/list/" + gId)
                .done(function (data) {
                    if (Array.isArray(data)) {
                        $event_type.empty().append('<option value="" disabled selected>请选择触发事件</option>');
                        data.forEach(function (item) {
                            var selected = (item.eventType === node.event_type) ? "selected" : "";
                            $event_type.append('<option value="' + item.eventType + '" ' + selected + '>' + item.eventType + " : " + item.description + '</option>');
                        });
                    }
                });
        },
        oneditsave: function () {
            this.event_type = $("#node-input-event_type").val();
        }
    });

    // === 关键修改 1：页面加载完成后立即同步一次 ===
    RED.events.on("runtime-state", function(state) {
        syncUrlParamsToNodes();
    });

    // === 关键修改 2：监听工作区切换或节点添加，确保参数实时注入 ===
    RED.events.on("nodes:add", function(n) {
        if (n.type === "Event") {
            syncUrlParamsToNodes();
        }
    });

    // === 关键修改 3：在部署前的一瞬间再次强制同步（兜底） ===
    // 既然 RED.events.on("deploy") 触发太晚，我们监听按钮点击
    $("#red-ui-header-button-deploy").on("mousedown", function() {
        syncUrlParamsToNodes();
    });
})();
</script>
