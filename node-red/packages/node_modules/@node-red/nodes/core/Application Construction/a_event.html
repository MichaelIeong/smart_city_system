<script type="text/html" data-template-name="Event">
    <div class="form-row">
        <label for="node-input-event_type"><i class="fa fa-bell"></i>事件类型</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>请选择触发事件</option>
            <option value="manhole-flooding">井盖水浸</option>
            <option value="manhole-tilte">井盖倾斜</option>
            <option value="truck_dect">渣土车识别</option>
            <option value="ill_parking">机动车违章停车</option>
            <option value="ill_parking2">非机动车违章停车</option>
            <option value="waste_accumulate">垃圾堆积</option>
            <option value="greenbelt_stack">绿化带乱堆乱放</option>
            <option value="road-operate">占道经营</option>
            <option value="out-store">店外经营</option>
            <option value="road-feeding">占道饲养家禽</option>
            <option value="trash_full">垃圾桶满溢</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Event', {
        category: 'Application Construction',
        color: "#f89f9f",
        defaults: {
            event_type: {value: ""}
        },
        inputs: 0,
        outputs: 1,
        icon: "status.svg",
        label: function () {
            var eventType = this.event_type;
            const eventMap = {
                "manhole-flooding": "井盖水浸",
                "manhole-tilte": "井盖倾斜",
                "truck_dect": "渣土车识别",
                "ill_parking": "机动车违章停车",
                "ill_parking2": "非机动车违章停车",
                "waste_accumulate": "垃圾堆积",
                "greenbelt_stack": "绿化带乱堆乱放",
                "road-operate": "占道经营",
                "out-store": "店外经营",
                "road-feeding": "占道饲养家禽",
                "trash_full": "垃圾桶满溢"
            };
            var eventName = eventMap[eventType] || "请选择";
            
            return "触发事件：" + eventName;
        },
        oneditprepare: function () {
            var node = this;
            var eventTypeSelect = $("#node-input-event_type");

            eventTypeSelect.off('change').on('change', function () {
                // 可以扩展自动操作，但当前不需要设置参数
            });

            eventTypeSelect.val(node.event_type);
        },
        oneditsave: function () {
            this.event_type = $("#node-input-event_type").val();
        }
    });
</script>

<style>
    .form-row input[type="text"],
    .form-row select {
        width: calc(100% - 180px);
        box-sizing: border-box;
    }

    .form-row button {
        margin-left: 150px;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.71);
        border: 1px solid #b8b8b8;
        border-radius: 5px;
        color: #000000;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
</style>
