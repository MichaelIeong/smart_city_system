<script type="text/html" data-template-name="Event">
  <div class="form-row">
    <label for="node-input-event_type"><i class="fa fa-bell"></i>事件类型</label>
    <select id="node-input-event_type">
      <option value="" disabled selected>加载中...</option>
    </select>
  </div>
</script>

<script type="text/javascript">
  (function () {
    // 全局保存事件数据
    var EVENT_DATA = [];

    // 渲染下拉选项
    function buildOptions($select, list, currentVal) {
      EVENT_DATA = list; // 保存数据源
      $select.empty();
      $select.append(
        '<option value="" disabled ' +
          (!currentVal ? "selected" : "") +
          ">请选择触发事件</option>"
      );
      list.forEach(function (item) {
        var value = item.value;
        var label = item.label;
        if (!value) return;
        var selected = value === currentVal ? "selected" : "";
        $select.append(
          '<option value="' +
            RED.utils.sanitize(value) +
            '" ' +
            selected +
            ">" +
            RED.utils.sanitize(label) +
            "</option>"
        );
      });
    }

    RED.nodes.registerType("Event", {
      category: "Application Construction",
      color: "#f89f9f",
      defaults: {
        event_type: { value: "" }
      },
      inputs: 0,
      outputs: 1,
      icon: "status.svg",
      label: function () {
        // 根据 event_type 动态查找 label
        if (this.event_type) {
            return "触发事件：" + this.event_type;
        } else {
            return "触发事件：未选择";
        }
      },
      oneditprepare: function () {
        var node = this;
        var $event_type = $("#node-input-event_type");
        // 初始提示
        $event_type.html('<option value="" disabled selected>加载中...</option>');
        // === 调用后端接口 ===
        // 根据环境判断 API 地址
        var baseUrl;
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
          // 如果是本地开发，使用 127.0.0.1
          baseUrl = "http://127.0.0.1:8080";
        } else {
          // 如果是部署在服务器上，使用服务器的 IP 或域名
          baseUrl = "http://10.176.65.202:8080"; // 替换成实际的服务器地址
        }
        // 获取浏览器的查询参数
        var gridId = new URLSearchParams(window.location.search).get("gridId");
        $.getJSON(baseUrl + "/api/envEvent/list/" + gridId)
          .done(function (data) {
            if (Array.isArray(data)) {
              // 转换成符合下拉框需要的格式
              var formattedData = data.map(function (event) {
                return {
                  value: event.eventType,  // 使用 eventType 作为值
                  label: event.eventType + " : " + event.description  // 使用 description 作为标签
                };
              });
              buildOptions($event_type, formattedData, node.event_type || "");
            }
            else {
              $event_type.html('<option value="" disabled selected>无有效数据</option>');
            }
          })
          .fail(function (xhr) {
            $event_type.html(
              '<option value="" disabled selected>加载失败，请检查接口</option>'
            );
            console.error("加载事件类型失败：", xhr);
          });
      },
      oneditsave: function () {
        this.event_type = $("#node-input-event_type").val();
      }
    });
  })();
</script>

<style>
  .form-row input[type="text"],
  .form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
  }
</style>
