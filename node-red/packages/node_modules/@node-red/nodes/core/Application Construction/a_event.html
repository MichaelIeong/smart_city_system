<script type="text/html" data-template-name="Event">
  <div class="form-row">
    <label for="node-input-event_type"><i class="fa fa-bell"></i>事件类型</label>
    <select id="node-input-event_type">
      <option value="" disabled selected>加载中...</option>
    </select>
  </div>
</script>

<script type="text/javascript">
  (function () {
    // === 模拟开关：开发时 true 使用本地数据；上线 false 调用后端 ===
    var USE_MOCK = true;

    // === 全局保存事件数据（MOCK 或接口返回）===
    var EVENT_DATA = [];

    // === 渲染下拉选项 ===
    function buildOptions($select, list, currentVal) {
      EVENT_DATA = list; // 保存数据源
      $select.empty();
      $select.append(
        '<option value="" disabled ' +
          (!currentVal ? "selected" : "") +
          ">请选择触发事件</option>"
      );
      list.forEach(function (item) {
        var value = item.value;
        var label = item.label;
        if (!value) return;
        var selected = value === currentVal ? "selected" : "";
        $select.append(
          '<option value="' +
            RED.utils.sanitize(value) +
            '" ' +
            selected +
            ">" +
            RED.utils.sanitize(label) +
            "</option>"
        );
      });
    }

    // === 模拟数据（开发期） ===
    var MOCK_DATA = [
      { value: "manhole-flooding", label: "井盖水浸" },
      { value: "manhole-tilt", label: "井盖倾斜" },
      { value: "truck_dect", label: "渣土车识别" },
      { value: "ill_parking", label: "机动车违章停车" },
      { value: "ill_parking2", label: "非机动车违章停车" },
      { value: "waste_accumulate", label: "垃圾堆积" },
      { value: "greenbelt_stack", label: "绿化带乱堆乱放" },
      { value: "road-operate", label: "占道经营" },
      { value: "out-store", label: "店外经营" },
      { value: "road-feeding", label: "占道饲养家禽" },
      { value: "trash_full", label: "垃圾桶满溢" }
    ];

    RED.nodes.registerType("Event", {
      category: "Application Construction",
      color: "#f89f9f",
      defaults: {
        event_type: { value: "" }
      },
      inputs: 0,
      outputs: 1,
      icon: "status.svg",
      label: function () {
        // 根据 event_type 动态查找 label
        const item = (EVENT_DATA || []).find(e => e.value === this.event_type);
        if(item) {
            return "触发事件：" + item.label;
        } else {
            if (this.event_type) {
                return "触发事件：" + this.event_type;
            } else {
                return "触发事件：未选择";
            }
        }
      },
      oneditprepare: function () {
        var node = this;
        var $event_type = $("#node-input-event_type");

        // 初始提示
        $event_type.html('<option value="" disabled selected>加载中...</option>');

        if (USE_MOCK) {
          // 模拟：延迟加载
          setTimeout(function () {
            buildOptions($event_type, MOCK_DATA, node.event_type || "");
          }, 300);
        } else {
          // === 调用后端接口 ===
          $.getJSON("http://127.0.0.1:8080/api/node-red/event/" + projectId)
            .done(function (data) {
              if (!Array.isArray(data)) {
                if (data && Array.isArray(data.data)) {
                  data = data.data;
                } else {
                  data = [];
                }
              }
              buildOptions($event_type, data, node.event_type || "");
            })
            .fail(function (xhr) {
              $event_type.html(
                '<option value="" disabled selected>加载失败，请检查接口</option>'
              );
              console.error("加载事件类型失败：", xhr);
            });
        }
      },
      oneditsave: function () {
        this.event_type = $("#node-input-event_type").val();
      }
    });
  })();
</script>

<style>
  .form-row input[type="text"],
  .form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
  }
</style>
