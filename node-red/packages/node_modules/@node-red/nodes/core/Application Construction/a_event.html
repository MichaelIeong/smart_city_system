<script type="text/html" data-template-name="Event">
    <div class="form-row">
        <label for="node-input-event-type"><i class="fa fa-bell"></i>事件类型</label>
        <select id="node-input-event-type">
            <option value="" disabled selected>请选择触发事件</option>
            <option value="IllegalParking">违停占道</option>
            <option value="RoadsideBusiness">占道经营</option>
            <option value="TrashOverflow">垃圾桶满溢</option>
            <option value="RoadTrashAccumulation">道路垃圾堆积</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Event', {
        category: 'Application Construction',
        color: "#f89f9f",
        defaults: {
            eventType: {value: ""} // 移除 eventParams
        },
        inputs: 0,
        outputs: 1,
        icon: "status.svg",
        label: function () {
            var eventType = this.eventType;
            var eventName = "请选择";
            switch (eventType) {
                case "IllegalParking":
                    eventName = "违停占道";
                    break;
                case "RoadsideBusiness":
                    eventName = "占道经营";
                    break;
                case "TrashOverflow":
                    eventName = "垃圾桶满溢";
                    break;
                case "RoadTrashAccumulation":
                    eventName = "道路垃圾堆积";
                    break;
                default:
                    eventName = "请选择";
            }
            return "触发事件：" + eventName;
        },
        oneditprepare: function () {
            var node = this;
            var eventTypeSelect = $("#node-input-event-type");

            eventTypeSelect.off('change').on('change', function () {
                // 可以扩展自动操作，但当前不需要设置参数
            });

            eventTypeSelect.val(node.eventType);
        },
        oneditsave: function () {
            this.eventType = $("#node-input-event-type").val();
        }
    });
</script>

<style>
    .form-row input[type="text"],
    .form-row select {
        width: calc(100% - 180px);
        box-sizing: border-box;
    }

    .form-row button {
        margin-left: 150px;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.71);
        border: 1px solid #b8b8b8;
        border-radius: 5px;
        color: #000000;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
</style>
