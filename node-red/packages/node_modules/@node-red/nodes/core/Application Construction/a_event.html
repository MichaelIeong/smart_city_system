<script type="text/html" data-template-name="Event">
    <div class="form-row">
        <label for="node-input-event-type"><i class="fa fa-bell"></i> Event Type</label>
        <select id="node-input-event-type">
            <option value="" disabled selected>Select Event Type</option>
            <option value="IllegalParking">IllegalParking</option>
            <option value="RoadsideBusiness">RoadsideBusiness</option>
            <option value="TrashOverflow">TrashOverflow</option>
            <option value="RoadTrashAccumulation">RoadTrashAccumulation</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-event-params"><i class="fa fa-cogs"></i> Event Parameters</label>
        <textarea id="node-input-event-params" placeholder="Enter Event Parameters (JSON format)"></textarea>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Event', {
        category: 'Application Construction',
        color: "#f89f9f",
        defaults: {
            eventType: {value: ""}, 
            eventParams: {value: ""}, 
        },
        inputs: 0,
        outputs: 1,
        icon: "status.svg",
        label: function () {
            if (this.eventType) {
                return "Event : " + this.eventType;
            } else {
                return "Event : EventType";
            }
        },
        oneditprepare: function () {
            var node = this;

            var eventTypeSelect = $("#node-input-event-type");
            var eventParamsInput = $("#node-input-event-params");

            // 绑定事件类型变化
            eventTypeSelect.off('change').on('change', function () {
                var selectedEventType = eventTypeSelect.val();
                // 根据事件类型选择设置相应的参数
                var selectedEvent = eventsData.find(function (event) {
                    return event.eventType === selectedEventType;
                });
                if (selectedEvent) {
                    // 显示事件参数
                    eventParamsInput.val(selectedEvent.params || "");
                }
            });

            // 加载当前节点的配置值到编辑界面
            eventTypeSelect.val(node.eventType);  // 设置当前事件类型
            eventParamsInput.val(node.eventParams);  // 设置当前事件参数
        },
        
        oneditsave: function () {
            this.eventType = $("#node-input-event-type").val();
            this.eventParams = $("#node-input-event-params").val();

            console.log("Saved node state:", {
                eventType: this.eventType,
                eventParams: this.eventParams,
            });
        }
    });
</script>

<style>
    .form-row input[type="text"],
    .form-row select,
    .form-row textarea {
        width: calc(100% - 180px);
        box-sizing: border-box;
    }

    .form-row textarea {
        height: 120px;  /* 增加了高度 */
        resize: vertical;  /* 允许垂直调整大小 */
    }

    .form-row button {
        margin-left: 150px;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.71);
        border: 1px solid #b8b8b8;
        border-radius: 5px;
        color: #000000;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
</style>
