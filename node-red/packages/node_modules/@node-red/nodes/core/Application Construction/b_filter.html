<script type="text/html" data-template-name="Filter">
    <div class="form-row">
        <label for="node-input-filter-type"><i class="fa fa-filter"></i> Filter Type</label>
        <select id="node-input-filter-type">
            <option value="" disabled selected>Select Filter Type</option>
            <option value="location">Location</option>
            <option value="time">Time</option>
        </select>
    </div>

    <!-- Location Filter Section -->
    <div class="form-row" id="location-filter-section" style="display: none;">
        <label for="node-input-location-operator"><i class="fa fa-map-marker"></i> Location Operator</label>
        <select id="node-input-location-operator">
            <option value="not in" selected>Not In</option>
            <option value="in">In</option>
        </select>

        <label for="node-input-target-location"><i class="fa fa-location-arrow"></i> Target Location</label>
        <input type="text" id="node-input-target-location" placeholder="Enter target location (e.g., 'IllegalParking.ignoreLocations')">
    </div>

    <!-- Time Filter Section -->
    <div class="form-row" id="time-filter-section" style="display: none;">
        <label for="node-input-time-operator"><i class="fa fa-clock"></i> Time Operator</label>
        <select id="node-input-time-operator">
            <option value="before" selected>Before</option>
            <option value="after">After</option>
        </select>

        <label for="node-input-target-time"><i class="fa fa-calendar"></i> Target Time</label>
        <input type="time" id="node-input-target-time" step="1">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Filter', {
        category: 'Application Construction',
        color: "#fff082",
        defaults: {
            filterType: { value: "" },
            locationOperator: { value: "not in" },
            targetLocation: { value: "" },
            timeOperator: { value: "before" },
            targetTime: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "filter.svg",
        label: function () {
            return "Filter : " + (this.filterType || "FilterType");
        },
        oneditprepare: function () {
            var node = this;
            var filterTypeSelect = $("#node-input-filter-type");
            var locationFilterSection = $("#location-filter-section");
            var timeFilterSection = $("#time-filter-section");

            // Bind filter type selection
            filterTypeSelect.off('change').on('change', function () {
                var selectedFilterType = filterTypeSelect.val();
                if (selectedFilterType === "location") {
                    locationFilterSection.show();
                    timeFilterSection.hide();
                } else if (selectedFilterType === "time") {
                    timeFilterSection.show();
                    locationFilterSection.hide();
                }
            });

            // Load the current filter settings into the UI
            filterTypeSelect.val(node.filterType);
            if (node.filterType === "location") {
                locationFilterSection.show();
                timeFilterSection.hide();
            } else if (node.filterType === "time") {
                locationFilterSection.hide();
                timeFilterSection.show();
            }

            $("#node-input-location-operator").val(node.locationOperator);
            $("#node-input-target-location").val(node.targetLocation);
            $("#node-input-time-operator").val(node.timeOperator);
            $("#node-input-target-time").val(node.targetTime);
        },

        oneditsave: function () {
            this.filterType = $("#node-input-filter-type").val();
            this.locationOperator = $("#node-input-location-operator").val();
            this.targetLocation = $("#node-input-target-location").val();
            this.timeOperator = $("#node-input-time-operator").val();
            this.targetTime = $("#node-input-target-time").val();

            console.log("Saved node state:", {
                filterType: this.filterType,
                locationOperator: this.locationOperator,
                targetLocation: this.targetLocation,
                timeOperator: this.timeOperator,
                targetTime: this.targetTime
            });
        }
    });
</script>

<style>
    .form-row input[type="text"],
    .form-row select,
    .form-row input[type="datetime-local"] {
        width: calc(100% - 180px);
        box-sizing: border-box;
    }

    .form-row button {
        margin-left: 150px;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.71);
        border: 1px solid #b8b8b8;
        border-radius: 5px;
        color: #000000;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
</style>
