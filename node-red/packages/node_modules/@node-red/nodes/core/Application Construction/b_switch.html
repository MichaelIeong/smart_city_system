<script type="text/html" data-template-name="Switch">
  <!-- 条件描述 -->
  <div class="form-row">
    <label for="node-input-description"><i class="fa fa-tag"></i>条件描述</label>
    <input type="text" id="node-input-description" placeholder="请输入条件描述">
  </div>

  <!-- 条件类型 -->
  <div class="form-row">
    <label for="node-input-conditionType"><i class="fa fa-clock-o"></i>条件类型</label>
    <select id="node-input-conditionType" style="width:100%;">
      <option value="" selected disabled>请选择条件类型</option>
      <option value="current_condition">当前条件</option>
      <option value="history_condition">历史条件</option>
    </select>
  </div>

  <!-- 当前条件 -->
  <div class="current-condition" style="display:none;">
    <div class="form-row">
      <label for="node-input-currentType"><i class="fa fa-list-ul"></i>当前条件类型</label>
      <select id="node-input-currentType" style="width:100%;">
        <option value="" disabled selected>请选择当前条件类型</option>
        <option value="time">时间</option>
        <option value="location">位置</option>
        <option value="property">属性</option>
      </select>
    </div>

    <div class="form-row current-type-property" style="display:none;">
      <label for="node-input-currentProperty"><i class="fa fa-sliders"></i>属性</label>
      <select id="node-input-currentProperty" style="width:100%;">
        <option value="" disabled selected>请选择属性</option>
      </select>
    </div>
  </div>

  <!-- 历史条件 -->
  <div class="history-condition" style="display:none;">
    <div class="form-row">
      <label><i class="fa fa-clock-o"></i>事件类型</label>
      <select id="node-input-historyEventType" style="width:100%;">
        <option value="" disabled selected>请选择事件类型</option>
      </select>
    </div>

    <div class="form-row">
      <label><i class="fa fa-calendar"></i>时间范围</label>
      <div style="display:flex;">
        <input type="number" id="node-input-historyTimeDuration" placeholder="请输入数字" style="width: 80px; margin-right: 5px;">
        <select id="node-input-historyTimeUnit" style="width: 100px;">
            <option value="hour">时</option>
            <option value="minute">分</option>
            <option value="second">秒</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label><i class="fa fa-map-marker"></i>参数选择</label>
      <select id="node-input-historyParams" style="width:100%;">
        <option value="">（不选择参数）</option>
      </select>
    </div>
  </div>

  <!-- 分支规则编辑器 -->
  <div class="form-row node-input-rule-container-row">
    <ol id="node-input-rule-container"></ol>
  </div>

  <input type="hidden" id="node-input-outputs"/>
</script>

<script type="text/javascript">
  RED.nodes.registerType('Switch', {
    category: 'Application Construction',
    color: "#E2D96E",
    defaults: {
      description: {value:""},
      conditionType: {value:""},
      currentType: {value:""},
      currentProperty: {value:""},
      historyEventType: {value:""},
      historyTimeDuration: {value:""},
      historyTimeUnit: {value:""},
      historyParams: {value:""},
      rules: {value:[{t:">=", v:"", vt:"str"}]},
      outputs: {value:1, required: true}
    },
    inputs: 1,
    outputs: 1,
    icon: "switch.svg",
    label: function () {
      return "分支条件：" + (this.description || "未选择");
    },
    outputLabels: function(index) {
        const rule = (this.rules && this.rules[index]) || {};  // 直接访问，避免undefined
        return `${rule.t || ""} ${rule.v ?? ""}`.trim();
    },
    oneditprepare: function () {
      let node = this;
      const eventData = [];  // 用于存储后端返回的事件数据
      const propertyData = [];  // 用于存储从后端获取的属性数据
      // 根据环境判断 API 地址
      var baseUrl;
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      // 如果是本地开发，使用 127.0.0.1
      baseUrl = "http://127.0.0.1:8080";
      } else {
      // 如果是部署在服务器上，使用服务器的 IP 或域名
      baseUrl = "http://10.176.65.202:8080"; // 替换成实际的服务器地址
      }
      // 获取浏览器的查询参数
      var gridId = new URLSearchParams(window.location.search).get("gridId");
      // 动态加载事件类型
      $.getJSON(baseUrl + "/api/envEvent/list/" + gridId)
        .done(function (data) {
          if (Array.isArray(data)) {
            data.forEach(function (event) {
              eventData.push(event);  // 保存后端返回的事件数据
              $("#node-input-historyEventType").append('<option value="' + event.eventType + '">' + event.eventType + ' : ' + event.description + '</option>');
            });
          }
        })
        .fail(function (xhr) {
          console.error("加载事件类型失败：", xhr);
        });
      // 动态加载属性选择（从后端获取）
      $.getJSON(baseUrl + "/api/envProperty/list/" + gridId)  // 假设你有这样一个接口获取属性数据
        .done(function (data) {
          if (Array.isArray(data)) {
            data.forEach(function (property) {
              propertyData.push(property);  // 保存属性数据
              $("#node-input-currentProperty").append('<option value="' + property.propertyName + '">' + property.propertyName + ' : ' + property.description + '</option>');
            });
          }
        })
        .fail(function (xhr) {
          console.error("加载属性数据失败：", xhr);
        });

      function toggleConditionFields(type) {
        if (type === "current_condition") {
            $(".current-condition").show();
            $(".history-condition").hide();
            // 清空历史条件字段
            $("#node-input-historyEventType").val("");
            $("#node-input-historyTimeDuration").val("");
            $("#node-input-historyTimeUnit").val("");
            $("#node-input-historyParams").val("");
        } else if (type === "history_condition") {
            $(".current-condition").hide();
            $(".history-condition").show();
            // 清空当前条件字段
            $("#node-input-currentType").val("");
            $("#node-input-currentProperty").val("");
        } else {
            $(".current-condition").hide();
            $(".history-condition").hide();
            // 清空全部
            $("#node-input-currentType").val("");
            $("#node-input-currentProperty").val("");
            $("#node-input-historyEventType").val("");
            $("#node-input-historyTimeDuration").val("");
            $("#node-input-historyTimeUnit").val("");
            $("#node-input-historyParams").val("");
        }
      }

      function toggleCurrentType(type) {
        if (type === "property") {
            $(".current-type-property").show();
        } else {
            $(".current-type-property").hide();
            // 如果切走了属性类型，清空属性选择
            $("#node-input-currentProperty").val("");
        }
      }

      $("#node-input-conditionType").on("change", function () {
        toggleConditionFields($(this).val());
      });

      $("#node-input-currentType").on("change", function () {
        toggleCurrentType($(this).val());
      });

      // 初始化 UI
      toggleConditionFields($("#node-input-conditionType").val());
      toggleCurrentType($("#node-input-currentType").val());

      // 监听事件类型变化，更新参数选择
      $("#node-input-historyEventType").on("change", function () {
        var selectedEventType = $(this).val();
        var event = eventData.find(e => e.eventType === selectedEventType);
        var historyParamsSelect = $("#node-input-historyParams");
        historyParamsSelect.empty();
        historyParamsSelect.append('<option value="">（不选择参数）</option>');

        if (event && event.eventJson) {
          try {
            var eventJson = JSON.parse(event.eventJson);
            var params = eventJson.event_params;
            if (params) {
              Object.keys(params).forEach(function (key) {
                historyParamsSelect.append('<option value="' + key + '">' + key + ' : ' + params[key].description + '</option>');
              });
            }
          } catch (error) {
            console.error("解析 eventJson 失败：", error);
          }
        }
      });

      // === 初始化规则编辑器 ===
      const operators = [
        {v:"==", t:"=="},
        {v:"!=", t:"!="},
        {v:"<", t:"<"},
        {v:"<=", t:"<="},
        {v:">", t:">"},
        {v:">=", t:">="}
      ];

      $("#node-input-rule-container").editableList({
        addItem: function(container, i, opt) {
          const rule = opt || {t:"==", v:"", vt:"str"};
          container.css({ display: "flex", alignItems: "center" });

          const selectOp = $('<select/>', { style: "width:60px;" }).appendTo(container);
          operators.forEach(op => {
            selectOp.append($("<option></option>").val(op.v).text(op.t));
          });
          selectOp.val(rule.t);

          $('<input/>', {
            type: "text",
            style: "width:100px; margin-left:5px;",
            value: rule.v || ""
          }).appendTo(container);

          $('<span/>', {
            html: ` &nbsp;→ <span class="node-input-rule-index">${i + 1}</span>`,
            style: "margin-left:5px;"
          }).appendTo(container);
        },
        removable: true,
        sortable: true
      });

      (this.rules || []).forEach(rule => {
        $("#node-input-rule-container").editableList('addItem', rule);
      });
    },
    oneditsave: function () {
      // 收集规则
      const rules = [];
      $("#node-input-rule-container").editableList('items').each(function () {
        const select = $(this).find("select");
        const input = $(this).find("input[type='text']");
        rules.push({ t: select.val(), v: input.val(), vt: "str" });
      });
      this.rules = rules;

      // 保存表单字段
      this.description = $("#node-input-description").val();
      this.conditionType = $("#node-input-conditionType").val();
      this.currentType = $("#node-input-currentType").val();
      this.currentProperty = $("#node-input-currentProperty").val();
      this.historyEventType = $("#node-input-historyEventType").val();
      this.historyTimeDuration = $("#node-input-historyTimeDuration").val();
      this.historyTimeUnit = $("#node-input-historyTimeUnit").val();
      this.historyParams = $("#node-input-historyParams").val();

      // 输出口数量 = 规则数量
      $("#node-input-outputs").val(rules.length);
    },
    oneditresize: function(size) {
      const rows = $("#dialog-form>div:not(.node-input-rule-container-row)");
      let height = size.height;
      for (let i = 0; i < rows.length; i++) {
        height -= $(rows[i]).outerHeight(true);
      }
      const editorRow = $("#dialog-form>div.node-input-rule-container-row");
      height -= (parseInt(editorRow.css("marginTop")) + parseInt(editorRow.css("marginBottom")));
      height += 16;
      $("#node-input-rule-container").editableList('height', height);
    }
  });
</script>

<style>
  .form-row input[type="text"],
  .form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
  }
</style>
