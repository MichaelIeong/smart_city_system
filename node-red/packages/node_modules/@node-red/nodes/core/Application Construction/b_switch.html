<script type="text/html" data-template-name="Switch">
  <!-- 条件描述 -->
  <div class="form-row">
    <label for="node-input-description"><i class="fa fa-tag"></i>条件描述</label>
    <input type="text" id="node-input-description" placeholder="请输入条件描述">
  </div>

  <!-- 条件类型 -->
  <div class="form-row">
    <label for="node-input-condition_type"><i class="fa fa-clock-o"></i>条件类型</label>
    <select id="node-input-condition_type" style="width:100%;">
      <option value="" selected disabled>请选择条件类型</option>
      <option value="current_condition">当前条件</option>
      <option value="history_condition">历史条件</option>
    </select>
  </div>

  <!-- 当前条件 -->
  <div class="current-condition" style="display:none;">
    <div class="form-row">
      <label for="node-input-current_type"><i class="fa fa-list-ul"></i>当前条件类型</label>
      <select id="node-input-current_type" style="width:100%;">
        <option value="" disabled selected>请选择当前条件类型</option>
        <option value="time">时间</option>
        <option value="location">位置</option>
        <option value="property">属性</option>
      </select>
    </div>

    <div class="form-row current-type-property" style="display:none;">
      <label for="node-input-current_property"><i class="fa fa-sliders"></i>属性</label>
      <select id="node-input-current_property" style="width:100%;">
      </select>
    </div>
  </div>

  <!-- 历史条件 -->
  <div class="history-condition" style="display:none;">
    <div class="form-row">
      <label><i class="fa fa-clock-o"></i>事件类型</label>
      <select id="node-input-history_event_type" style="width:100%;">
      </select>
    </div>

    <div class="form-row">
      <label><i class="fa fa-calendar"></i>时间范围</label>
      <div style="display:flex;">
        <input type="number" id="node-input-history_time_duration" placeholder="请输入数字" style="width: 80px; margin-right: 5px;">
        <select id="node-input-history_time_unit" style="width: 100px;">
            <option value="hour">时</option>
            <option value="minute">分</option>
            <option value="second">秒</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label><i class="fa fa-map-marker"></i>参数选择</label>
      <select id="node-input-history_params" style="width:100%;">
      </select>
    </div>
  </div>

  <!-- 分支规则编辑器 -->
  <div class="form-row node-input-rule-container-row">
    <ol id="node-input-rule-container"></ol>
  </div>

  <input type="hidden" id="node-input-outputs"/>
</script>

<script type="text/javascript">
  RED.nodes.registerType('Switch', {
    category: '应用构造',
    color: "#E2D96E",
    defaults: {
      description: {value:""},
      condition_type: {value:""},
      current_type: {value:""},
      current_property: {value:""},
      history_event_type: {value:""},
      history_time_duration: {value:""},
      history_time_unit: {value:""},
      history_params: {value:""},
      rules: {value:[{t:">=", v:"", vt:"str"}]},
      outputs: {value:1, required: true}
    },
    inputs: 1,
    outputs: 1,
    icon: "switch.svg",
    label: function () {
      return "分支条件：" + (this.description || "请输入描述");
    },
    paletteLabel: "条件分支",
    outputLabels: function(index) {
      const rule = (this.rules && this.rules[index]) || {};
      return `${rule.t || ""} ${rule.v ?? ""}`.trim();
    },
    oneditprepare: function () {
      const node = this;

      // ==== 1. 先把已有值灌回表单（导入/编辑时都要还原） ====
      $("#node-input-description").val(node.description);
      $("#node-input-condition_type").val(node.condition_type);
      $("#node-input-current_type").val(node.current_type);
      $("#node-input-current_property").val(node.current_property);
      $("#node-input-history_time_duration").val(node.history_time_duration);
      $("#node-input-history_time_unit").val(node.history_time_unit);
      // history_event_type / history_params 后面在下拉数据加载后再设置

      // ==== 2. 后端数据缓存 ====
      let eventData = [];     // 环境事件
      let propertyData = [];  // 环境属性

      // ==== 3. API 地址 ====
      let baseUrl;
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        baseUrl = "http://127.0.0.1:8080";
      } else {
        baseUrl = "http://10.192.48.41:8080"; // 你的服务器地址
      }

      // ==== 4. 取 gridId ====
      const gridId = new URLSearchParams(window.location.search).get("gridId");

      // ==== 5. 加载历史事件类型 ====
      $.getJSON(baseUrl + "/api/envEvent/list/" + gridId)
        .done(function (data) {
          if (Array.isArray(data)) {
            eventData = data;

            const $eventType = $("#node-input-history_event_type");
            $eventType.empty();
            $eventType.append(
              '<option value="" disabled ' +
                (!node.history_event_type ? "selected" : "") +
                ">请选择事件类型</option>"
            );
            data.forEach(function (event) {
              $eventType.append(
                '<option value="' + event.eventType + '">' +
                  event.eventType + ' : ' + event.description +
                '</option>'
              );
            });

            // 如果节点里已经有历史事件类型，恢复选中并触发 change，去更新参数列表
            if (node.history_event_type) {
              $eventType.val(node.history_event_type);
              $eventType.trigger("change");
            }
          }
        })
        .fail(function (xhr) {
          console.error("加载事件类型失败：", xhr);
        });

      // ==== 6. 加载当前条件可用属性 ====
      $.getJSON(baseUrl + "/api/envProperty/list/" + gridId)
        .done(function (data) {
          if (Array.isArray(data)) {
            propertyData = data;
            const $prop = $("#node-input-current_property");
            $prop.empty();
            $prop.append(
              '<option value="" disabled ' +
                (!node.current_property ? "selected" : "") +
                ">请选择环境属性</option>"
            );
            data.forEach(function (property) {
              $prop.append(
                '<option value="' + property.propertyName + '">' +
                  property.propertyName + ' : ' + property.description +
                '</option>'
              );
            });

            // 恢复当前属性选中
            if (node.current_property) {
              $prop.val(node.current_property);
            }
          }
        })
        .fail(function (xhr) {
          console.error("加载属性数据失败：", xhr);
        });

      // ==== 7. 条件类型切换显示 ====
      function toggleConditionFields(type) {
        if (type === "current_condition") {
          $(".current-condition").show();
          $(".history-condition").hide();
        } else if (type === "history_condition") {
          $(".current-condition").hide();
          $(".history-condition").show();
        } else {
          $(".current-condition").hide();
          $(".history-condition").hide();
        }
      }

      function toggleCurrentType(type) {
        if (type === "property") {
          $(".current-type-property").show();
        } else {
          $(".current-type-property").hide();
        }
      }

      $("#node-input-condition_type").on("change", function () {
        toggleConditionFields($(this).val());
      });
      $("#node-input-current_type").on("change", function () {
        toggleCurrentType($(this).val());
      });

      // 初始化显示状态（用节点里已有的值）
      toggleConditionFields(node.condition_type);
      toggleCurrentType(node.current_type);

      // ==== 8. 事件类型变化时，刷新 历史参数 下拉 ====
      $("#node-input-history_event_type").on("change", function () {
        const selectedEventType = $(this).val();
        const event = eventData.find(e => e.eventType === selectedEventType);
        const $history_params = $("#node-input-history_params");

        $history_params.empty();
        $history_params.append(
          '<option value="" disabled ' +
            (!node.history_params ? "selected" : "") +
            ">请选择事件参数</option>"
        );
        $history_params.append('<option value="">（不选择参数）</option>');

        if (event && event.eventJson) {
          try {
            const eventJson = JSON.parse(event.eventJson);
            const params = eventJson.event_params;
            if (params) {
              Object.keys(params).forEach(function (key) {
                $history_params.append(
                  '<option value="' + key + '">' +
                    key + ' : ' + (params[key].description || "") +
                  '</option>'
                );
              });
            }
          } catch (e) {
            console.error("解析 eventJson 失败：", e);
          }
        }

        // 如果节点本身有 history_params，切换事件后尝试恢复选中
        if (node.history_params) {
          $history_params.val(node.history_params);
        }
      });

      // 如果一开始就有 history_event_type，但事件数据是异步来的：
      // 事件数据加载完成时上面会触发一次 change，这里不再额外触发

      // ==== 9. 初始化规则编辑器 ====
      const operators = [
        {v:"==", t:"=="},
        {v:"!=", t:"!="},
        {v:"<", t:"<"},
        {v:"<=", t:"<="},
        {v:">", t:">"},
        {v:">=", t:">="}
      ];

      $("#node-input-rule-container").editableList({
        addItem: function(container, i, opt) {
          const rule = opt || {t:"==", v:"", vt:"str"};
          container.css({ display: "flex", alignItems: "center" });

          const $opSelect = $('<select/>', { style: "width:60px;" }).appendTo(container);
          operators.forEach(op => {
            $opSelect.append($("<option></option>").val(op.v).text(op.t));
          });
          $opSelect.val(rule.t);

          $('<input/>', {
            type: "text",
            style: "width:100px; margin-left:5px;",
            value: rule.v || ""
          }).appendTo(container);

          $('<span/>', {
            html: ` &nbsp;→ <span class="node-input-rule-index">${i + 1}</span>`,
            style: "margin-left:5px;"
          }).appendTo(container);
        },
        removable: true,
        sortable: true
      });

      (node.rules || []).forEach(rule => {
        $("#node-input-rule-container").editableList('addItem', rule);
      });
    },
    oneditsave: function () {
      const rules = [];
      $("#node-input-rule-container").editableList('items').each(function () {
        const $select = $(this).find("select");
        const $input = $(this).find("input[type='text']");
        rules.push({ t: $select.val(), v: $input.val(), vt: "str" });
      });
      this.rules = rules;

      this.description       = $("#node-input-description").val();
      this.condition_type     = $("#node-input-condition_type").val();
      this.current_type       = $("#node-input-current_type").val();
      this.current_property   = $("#node-input-current_property").val();
      this.history_event_type  = $("#node-input-history_event_type").val();
      this.history_time_duration = $("#node-input-history_time_duration").val();
      this.history_time_unit   = $("#node-input-history_time_unit").val();
      this.history_params     = $("#node-input-history_params").val();

      $("#node-input-outputs").val(rules.length);
    },
    oneditresize: function(size) {
      const rows = $("#dialog-form>div:not(.node-input-rule-container-row)");
      let height = size.height;
      for (let i = 0; i < rows.length; i++) {
        height -= $(rows[i]).outerHeight(true);
      }
      const editorRow = $("#dialog-form>div.node-input-rule-container-row");
      height -= (parseInt(editorRow.css("marginTop")) + parseInt(editorRow.css("marginBottom")));
      height += 16;
      $("#node-input-rule-container").editableList('height', height);
    }
  });
</script>

<style>
  .form-row input[type="text"],
  .form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
  }
</style>
