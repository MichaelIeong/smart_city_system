<script type="text/html" data-template-name="Condition">
    <div class="form-row">
        <label for="node-input-condition-type"><i class="fa fa-check"></i> Condition Type</label>
        <select id="node-input-condition-type">
            <option value="" disabled selected>Select Condition Type</option>
            <option value="current_condition">Current Condition</option>
            <option value="history_condition">History Condition</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-left"><i class="fa fa-arrow-left"></i> Left Operand</label>
        <input type="text" id="node-input-left" placeholder="Enter left operand (e.g., location.NetworkAudioNum)">
    </div>

    <div class="form-row">
        <label for="node-input-operator"><i class="fa fa-cogs"></i> Operator</label>
        <select id="node-input-operator">
            <option value=">" selected>Greater Than</option>
            <option value="<">Less Than</option>
            <option value="==">Equal</option>
            <option value="!=">Not Equal</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-right"><i class="fa fa-arrow-right"></i> Right Operand</label>
        <input type="text" id="node-input-right" placeholder="Enter right operand (e.g., 0)">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Condition', {
        category: 'Application Construction',
        color: "#d4a5a5",
        defaults: {
            conditionType: {value: ""}, 
            left: {value: ""},        // 左操作数
            operator: {value: ">"},   // 比较操作符
            right: {value: ""}       // 右操作数
        },
        inputs: 1,
        outputs: 1,
        icon: "switch.svg",
        label: function () {
            return "Condition: " + (this.conditionType || "ConditionType");
        },
        oneditprepare: function () {
            var node = this;
            // Ensure the jQuery selectors match the actual node inputs
            $("#node-input-condition-type").val(node.conditionType || "");  
            $("#node-input-left").val(node.left || "");
            $("#node-input-operator").val(node.operator || ">");
            $("#node-input-right").val(node.right || "");
        },
        oneditsave: function () {
            this.conditionType = $("#node-input-condition-type").val();
            this.left = $("#node-input-left").val();
            this.operator = $("#node-input-operator").val();
            this.right = $("#node-input-right").val();
        }
    });
</script>
