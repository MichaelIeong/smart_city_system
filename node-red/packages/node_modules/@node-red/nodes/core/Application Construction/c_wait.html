<script type="text/html" data-template-name="Wait">
    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-info-circle"></i>等待描述</label>
        <input type="text" id="node-input-description" placeholder="请输入等待描述">
    </div>

    <div class="form-row">
        <label for="node-input-wait_type"><i class="fa fa-clock"></i>等待类型</label>
        <select id="node-input-wait_type">
            <option value="" disabled selected>请选择等待类型</option>
            <option value="time_wait">时间等待</option>
            <option value="action_wait">动作等待</option>
        </select>
    </div>

    <!-- 公共条件字段（根据 wait_type 控制显示内容） -->
    <div class="form-row condition-fields" style="display: none;">
        <label for="node-input-event_type"><i class="fa fa-bell"></i>事件类型</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>请选择事件类型</option>
        </select>

        <div class="time-fields" style="display: none;">
            <label for="node-input-duration"><i class="fa fa-hourglass-half"></i>持续时间</label>
            <input type="number" id="node-input-duration" placeholder="例如：3" />

            <label for="node-input-unit"><i class="fa fa-clock-o"></i>单位</label>
            <select id="node-input-unit">
                <option value="" disabled selected>请选择时间单位</option>
                <option value="hour">时</option>
                <option value="minute">分</option>
                <option value="second">秒</option>
            </select>
        </div>

        <label for="node-input-wait_params"><i class="fa fa-map-marker"></i>参数选择</label>
        <select id="node-input-wait_params">
            <option value="">（不选择参数）</option>
        </select>
    </div>

    <input type="hidden" id="node-input-outputs"/>
</script>
<script type="text/javascript">
    RED.nodes.registerType("Wait", {
        category: "应用构造",
        color: "#efa1f8",
        defaults: {
            description: { value: "" },
            wait_type: { value: "" },
            event_type: { value: "" },
            wait_params: { value: "" },
            duration: { value: "" },
            unit: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "timer.svg",
        label: function () {
            return "延时等待：" + (this.description || "请输入描述");
        },
        paletteLabel: "延时等待",
        oneditprepare: function () {
            let node = this;
            $("#node-input-description").val(node.description);
            $("#node-input-wait_type").val(node.wait_type);
            $("#node-input-event_type").val(node.event_type);
            $("#node-input-wait_params").val(node.wait_params);
            $("#node-input-duration").val(node.duration);
            $("#node-input-unit").val(node.unit);

            // var allNodes = RED.nodes.filterNodes({}); 
            // console.log("当前共有 " + allNodes.length + " 个节点");
            // console.log(allNodes);
            // var eventNodes = RED.nodes.filterNodes({type: "Event"});
            // eventNodes.forEach(n => {
            //     console.log("节点ID:", n.id);
            //     // 直接访问你在 defaults 中定义的字段名
            //     console.log("事件类型:", n.event_type); 
            //     console.log("事件参数:", n.event_params);
            // });

            // 存储后端返回的事件数据
            var eventData = [];
            // 根据环境判断 API 地址
            var baseUrl;
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                // 如果是本地开发，使用 127.0.0.1
                baseUrl = "http://127.0.0.1:8080";
            } else {
                // 如果是部署在服务器上，使用服务器的 IP 或域名
                baseUrl = "http://10.192.48.41:8080"; // 替换成实际的服务器地址
            }
            // 获取浏览器的查询参数
            var gridId = new URLSearchParams(window.location.search).get("gridId");
            // 从后端获取数据
            $.getJSON(baseUrl + "/api/envEvent/list/" + gridId)
                .done(function (data) {
                    if (Array.isArray(data)) {
                        eventData = data;  // 将后端返回的事件数据保存
                        // 动态填充事件类型下拉框
                        var eventTypeSelect = $("#node-input-event_type");
                        eventTypeSelect.empty();
                        eventTypeSelect.append(
                            '<option value="" disabled ' +
                            (!node.event_type ? "selected" : "") +
                            ">请选择事件类型</option>"
                        );
                        data.forEach(function (event) {
                            eventTypeSelect.append('<option value="' + event.eventType + '">' + event.eventType + ' : ' + event.description + '</option>');
                        });
                        if (node.event_type) {
                            eventTypeSelect.val(node.event_type);
                            // 手动触发 change 事件来更新 wait_params
                            eventTypeSelect.trigger('change');
                        }
                    }
                })
                .fail(function (xhr) {
                    console.error("加载事件类型失败：", xhr);
                    $("#node-input-event_type").html('<option value="" disabled selected>加载失败，请检查接口</option>');
                });

            function updateView() {
                const type = $("#node-input-wait_type").val();
                if (type === "time_wait" || type === "action_wait") {
                    $(".condition-fields").show();
                    $(".time-fields").toggle(type === "time_wait");
                    if(type === "action_wait") {
                        $("#node-input-duration").val("");
                        $("#node-input-unit").val("");
                    }
                } else {
                    $(".condition-fields").hide();
                    $(".time-fields").hide();
                }
            }

            $("#node-input-wait_type").on("change", updateView);
            updateView();

            // 监听事件类型的选择，更新事件参数
            $("#node-input-event_type").on("change", function () {
                var selectedEventType = $(this).val();
                var event = eventData.find(e => e.eventType === selectedEventType);
                var eventParamsSelect = $("#node-input-wait_params");
                eventParamsSelect.empty();
                eventParamsSelect.append('<option value="">（不选择参数）</option>');

                if (event && event.eventJson) {
                    try {
                        var eventJson = JSON.parse(event.eventJson);
                        var params = eventJson.event_params;
                        if (params) {
                            Object.keys(params).forEach(function (key) {
                                eventParamsSelect.append('<option value="' + key + '">' + key + ' : ' + params[key].description + '</option>');
                            });
                        }
                        if(node.wait_params) {
                            eventParamsSelect.val(node.wait_params);
                        }
                    } catch (error) {
                        console.error("解析 eventJson 失败：", error);
                    }
                }
            });

            // 触发一次事件类型的变化（确保 `wait_params` 被正确更新）
            if (node.event_type) {
                $("#node-input-event_type").trigger("change");
            }
        },
        oneditsave: function () {
            this.description = $("#node-input-description").val();
            this.wait_type = $("#node-input-wait_type").val();
            this.event_type = $("#node-input-event_type").val();
            this.wait_params = $("#node-input-wait_params").val();
            this.duration = $("#node-input-duration").val();
            this.unit = $("#node-input-unit").val();
        }
    });
</script>
