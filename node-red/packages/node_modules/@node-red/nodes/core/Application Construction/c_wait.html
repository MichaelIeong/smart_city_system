<script type="text/html" data-template-name="Wait">
    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-info-circle"></i>等待描述</label>
        <input type="text" id="node-input-description" placeholder="请输入等待描述">
    </div>

    <div class="form-row">
        <label for="node-input-waitType"><i class="fa fa-clock"></i>等待类型</label>
        <select id="node-input-waitType">
            <option value="" disabled selected>请选择等待类型</option>
            <option value="time_wait">时间等待</option>
            <option value="action_wait">动作等待</option>
        </select>
    </div>

    <!-- 公共条件字段（根据 waitType 控制显示内容） -->
    <div class="form-row condition-fields" style="display: none;">
        <label for="node-input-event_type"><i class="fa fa-bell"></i>事件类型</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>请选择事件类型</option>
            <option value="manhole-flooding">井盖水浸</option>
            <option value="manhole-tilte">井盖倾斜</option>
            <option value="truck_dect">渣土车识别</option>
            <option value="ill_parking">机动车违章停车</option>
            <option value="ill_parking2">非机动车违章停车</option>
            <option value="waste_accumulate">垃圾堆积</option>
            <option value="greenbelt_stack">绿化带乱堆乱放</option>
            <option value="road-operate">占道经营</option>
            <option value="out-store">店外经营</option>
            <option value="road-feeding">占道饲养家禽</option>
            <option value="trash_full">垃圾桶满溢</option>
        </select>

        <div class="time-fields" style="display: none;">
            <label for="node-input-duration"><i class="fa fa-hourglass-half"></i>持续时间</label>
            <input type="number" id="node-input-duration" placeholder="例如：3" />

            <label for="node-input-unit"><i class="fa fa-clock-o"></i>单位</label>
            <select id="node-input-unit">
                <option value="" disabled selected>请选择时间单位</option>
                <option value="hour">时</option>
                <option value="minute">分</option>
                <option value="second">秒</option>
            </select>
        </div>

        <label for="node-input-waitParams"><i class="fa fa-map-marker"></i>参数选择</label>
        <select id="node-input-waitParams">
            <option value="">（不选择参数）</option>
            <option value="location">位置</option>
            <option value="plate_number">车牌号</option>
            <option value="deviceId">井盖编号</option>
        </select>
    </div>

    <input type="hidden" id="node-input-outputs"/>
</script>
<script type="text/javascript">
    RED.nodes.registerType("Wait", {
        category: "Application Construction",
        color: "#efa1f8",
        defaults: {
            description: { value: "" },
            waitType: { value: "" },
            event_type: { value: "" },
            waitParams: { value: "" },
            duration: { value: "" },
            unit: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "timer.svg",
        label: function () {
            return "执行等待：" + (this.description || "请输入描述");
        },
        oneditprepare: function () {
            let node = this;
            $("#node-input-description").val(node.description);
            $("#node-input-waitType").val(node.waitType);
            $("#node-input-event_type").val(node.event_type);
            $("#node-input-waitParams").val(node.waitParams);
            $("#node-input-duration").val(node.duration);
            $("#node-input-unit").val(node.unit);

            function updateView() {
                const type = $("#node-input-waitType").val();
                if (type === "time_wait" || type === "action_wait") {
                    $(".condition-fields").show();
                    $(".time-fields").toggle(type === "time_wait");
                    if(type === "action_wait") {
                        $("#node-input-duration").val("");
                        $("#node-input-unit").val("");
                    }
                } else {
                    $(".condition-fields").hide();
                    $(".time-fields").hide();
                }
            }

            $("#node-input-waitType").on("change", updateView);
            updateView();
        },
        oneditsave: function () {
            this.description = $("#node-input-description").val();
            this.waitType = $("#node-input-waitType").val();
            this.event_type = $("#node-input-event_type").val();
            this.waitParams = $("#node-input-waitParams").val();
            this.duration = $("#node-input-duration").val();
            this.unit = $("#node-input-unit").val();
        }
    });
</script>
