<script type="text/html" data-template-name="Wait">
    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-info-circle"></i>等待描述</label>
        <input type="text" id="node-input-description" placeholder="请输入等待描述">
    </div>

    <div class="form-row">
        <label for="node-input-waitType"><i class="fa fa-clock"></i>等待类型</label>
        <select id="node-input-waitType">
            <option value="" disabled selected>请选择等待类型</option>
            <option value="time_condition">时间等待</option>
            <option value="action_condition">动作等待</option>
        </select>
    </div>

    <!-- 动作等待条件 -->
    <div class="form-row" id="action-condition-fields" style="display: none;">
        <label for="node-input-event_type"><i class="fa fa-bell"></i> 事件类型</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>请选择事件类型</option>
            <option value="IllegalParking">违停占道</option>
            <option value="RoadsideBusiness">占道经营</option>
            <option value="TrashOverflow">垃圾桶满溢</option>
            <option value="RoadTrashAccumulation">道路垃圾堆积</option>
        </select>

        <label for="node-input-location"><i class="fa fa-map-marker"></i>参数选择</label>
        <select id="node-input-location">
            <option value="" disabled selected>请判断是否选择参数</option>
            <option value="location">位置</option>
            <option value="plate">车牌号</option>
        </select>
    </div>

    <!-- 时间等待条件 -->
    <div class="form-row" id="time-condition-fields" style="display: none;">
        <label for="node-input-time-event_type"><i class="fa fa-bell"></i>事件类型</label>
        <select id="node-input-time-event_type">
            <option value="" disabled selected>请选择事件类型</option>
            <option value="IllegalParking">违停占道</option>
            <option value="RoadsideBusiness">占道经营</option>
            <option value="TrashOverflow">垃圾桶满溢</option>
            <option value="RoadTrashAccumulation">道路垃圾堆积</option>
        </select>

        <label for="node-input-duration"><i class="fa fa-hourglass-half"></i>持续时间</label>
        <input type="number" id="node-input-duration" placeholder="例如：3" />

        <label for="node-input-unit"><i class="fa fa-clock-o"></i>单位</label>
        <select id="node-input-unit">
            <option value="" disabled selected>请选择时间单位</option>
            <option value="second">秒</option>
            <option value="minute">分钟</option>
            <option value="hour">小时</option>
        </select>

        <label for="node-input-location"><i class="fa fa-map-marker"></i>参数选择</label>
        <select id="node-input-time-location">
            <option value="" disabled selected>请判断是否选择参数</option>
            <option value="location">位置</option>
            <option value="plate">车牌号</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("Wait", {
        category: "Application Construction",
        color: "#efa1f8",
        defaults: {
            description: { value: "" },
            waitType: { value: "" },
            event_type: { value: "" },
            location: { value: "" },
            duration: { value: "" },
            unit: { value: "" },
            time_event_type: { value: "" },
            time_location: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "timer.svg",
        label: function () {
            return "执行等待： " + (this.description || "请输入描述");
        },
        oneditprepare: function () {
            let node = this;
            $("#node-input-description").val(node.description);
            $("#node-input-waitType").val(node.waitType);
            $("#node-input-event_type").val(node.event_type);
            $("#node-input-location").val(node.location);
            $("#node-input-duration").val(node.duration);
            $("#node-input-unit").val(node.unit);
            $("#node-input-time-event_type").val(node.time_event_type);
            $("#node-input-time-location").val(node.time_location);

            // Function to toggle the visibility of the fields based on waitType
            function updateView() {
                const type = $("#node-input-waitType").val();
                if (type === "action_condition") {
                    $("#action-condition-fields").show();
                    $("#time-condition-fields").hide();
                } else if (type === "time_condition") {
                    $("#action-condition-fields").hide();
                    $("#time-condition-fields").show();
                } else {
                    $("#action-condition-fields").hide();
                    $("#time-condition-fields").hide();
                }
            }

            // Listen for changes in waitType and update view
            $("#node-input-waitType").on("change", updateView);
            updateView(); // Initial view setup

        },
        oneditsave: function () {
            this.description = $("#node-input-description").val();
            this.waitType = $("#node-input-waitType").val();
            this.event_type = $("#node-input-event_type").val();
            this.location = $("#node-input-location").val();
            this.duration = $("#node-input-duration").val();
            this.unit = $("#node-input-unit").val();
            this.time_event_type = $("#node-input-time-event_type").val();
            this.time_location = $("#node-input-time-location").val();
        }
    });
</script>
