<script type="text/html" data-template-name="Action">
    <div class="form-row">
        <label for="node-input-action_name"><i class="fa fa-bolt"></i> 服务类型</label>
        <select id="node-input-action_name" style="width: 70%;">
            <option value="" disabled selected>加载中...</option>
        </select>
    </div>

    <div class="form-row" style="margin-top: 20px; margin-bottom: 10px;">
        <label><i class="fa fa-list"></i> 服务参数</label>
        <span style="font-size: 12px; color: #999; margin-left: 10px;">(event_type和location参数已自动预填)</span>
        <hr style="border: 0; border-top: 1px solid #eee; margin-top: 5px;">
    </div>

    <div id="params-container">
        <div style="text-align: center; color: #999; padding: 20px;">
            请先选择一个服务类型以配置参数
        </div>
    </div>
</script>

<script type="text/javascript">
    (function () {
        var RAW_SERVICES_DATA = [];

        function renderDynamicParams(node, serviceName) {
            var $container = $("#params-container");
            $container.empty();

            var service = RAW_SERVICES_DATA.find(s => s.serviceName === serviceName);
            if (!service || !service.serviceJson) {
                $container.append('<div style="text-align: center; color: #999; padding: 20px;">该服务无需配置参数</div>');
                return;
            }

            try {
                var config = JSON.parse(service.serviceJson);
                var params = config.action_params;

                if (!params || Object.keys(params).length === 0) {
                    $container.append('<div style="text-align: center; color: #999; padding: 20px;">该服务无需配置参数</div>');
                    return;
                }

                Object.keys(params).forEach(function (key) {
                    var info = params[key];
                    
                    // 获取已保存的值
                    var savedValue = (node.action_params && node.action_params[key]);
                    
                    // 【逻辑更新】：如果值为空，且键名是 location 或 event_type，则自动预填
                    var finalValue = savedValue;
                    var isAutoFilled = false;
                    
                    if (savedValue === undefined || savedValue === "") {
                        if (key === "location" || key === "event_type") {
                            finalValue = key;
                            isAutoFilled = true;
                        } else {
                            finalValue = "";
                        }
                    }

                    // 如果是预填项，添加一个特定的 class 用于样式区分
                    var inputClass = isAutoFilled ? "param-value-input auto-filled" : "param-value-input";

                    var rowHtml = `
                        <div class="param-editor-row" data-param-key="${key}">
                            <div class="param-header">
                                <span class="param-name">
                                    <strong>${key}</strong>
                                    ${isAutoFilled ? '<span class="auto-label">自动预填</span>' : ''}
                                </span>
                                <span class="param-type">${info.type || 'string'}</span>
                            </div>
                            <div class="param-desc">${info.description || '无描述'}</div>
                            <div class="param-input-wrapper">
                                <input type="text" class="${inputClass}" 
                                       placeholder="请填写事件参数名或输入参数值" 
                                       value="${RED.utils.sanitize(finalValue)}">
                            </div>
                        </div>
                    `;
                    $container.append(rowHtml);
                });
            } catch (e) {
                console.error("解析 serviceJson 失败:", e);
                $container.append('<div style="color: #d66161; padding: 10px;">配置解析错误</div>');
            }
        }

        RED.nodes.registerType("Action", {
            category: "应用构造",
            color: "#80b6fa",
            defaults: {
                action_name: { value: "" },
                action_params: { value: {} }
            },
            inputs: 1,
            outputs: 1,
            icon: "cog.svg",
            paletteLabel: "调用服务",
            label: function () {
                return this.action_name ? "调用服务：" + this.action_name : "调用服务：未选择";
            },
            oneditprepare: function () {
                var node = this;
                var $select = $("#node-input-action_name");

                $select.on("change", function () {
                    var val = $(this).val();
                    if (val) {
                        renderDynamicParams(node, val);
                    }
                });

                var baseUrl = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
                    ? "http://127.0.0.1:8080"
                    : "http://10.176.65.202:8080";
                
                var gridId = new URLSearchParams(window.location.search).get("gridId");

                $.getJSON(baseUrl + "/api/envService/list/" + gridId)
                    .done(function (data) {
                        if (Array.isArray(data)) {
                            RAW_SERVICES_DATA = data;
                            $select.empty();
                            $select.append('<option value="" disabled ' + (!node.action_name ? "selected" : "") + '>请选择调用服务类型</option>');
                            
                            data.forEach(function (service) {
                                var isSelected = (service.serviceName === node.action_name);
                                $select.append(
                                    $('<option></option>')
                                        .val(service.serviceName)
                                        .text(service.serviceName + " : " + service.description)
                                        .prop('selected', isSelected)
                                );
                            });

                            if (node.action_name) {
                                renderDynamicParams(node, node.action_name);
                            }
                        }
                    });
            },
            oneditsave: function () {
                var node = this;
                node.action_name = $("#node-input-action_name").val();
                var collectedParams = {};
                $("#params-container .param-editor-row").each(function () {
                    var key = $(this).data("param-key");
                    var val = $(this).find(".param-value-input").val();
                    collectedParams[key] = val;
                });
                node.action_params = collectedParams;
            }
        });
    })();
</script>

<style>
    #params-container {
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fafafa;
        min-height: 60px;
        max-height: 400px;
        overflow-y: auto;
        padding: 10px;
    }

    .param-editor-row {
        margin-bottom: 12px;
        padding: 10px;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 4px;
    }

    .param-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }

    .param-name {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* 自动映射标签样式 */
    .auto-label {
        background: #e6f7ff;
        color: #1890ff;
        border: 1px solid #91d5ff;
        font-size: 10px;
        padding: 0 5px;
        border-radius: 2px;
    }

    .param-type {
        background: #f5f5f5;
        color: #999;
        padding: 2px 5px;
        border-radius: 3px;
        font-size: 11px;
    }

    .param-desc {
        font-size: 12px;
        color: #777;
        margin-bottom: 8px;
    }

    .param-value-input {
        width: 100% !important;
        box-sizing: border-box;
        border: 1px solid #ccc !important;
        border-radius: 4px;
        padding: 6px 10px !important;
    }

    /* 预填项的特殊样式：淡蓝色背景，提示用户这是自动生成的 */
    .auto-filled {
        background-color: #f0f7ff !important;
        border-color: #adc6ff !important;
        color: #2f54eb;
        font-weight: bold;
    }

    .param-value-input:focus {
        border-color: #80b6fa !important;
        outline: none;
        background-color: #fff !important;
    }
</style>
