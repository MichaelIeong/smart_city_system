<script type="text/html" data-template-name="Action">
    <div class="form-row">
        <label for="node-input-action_name"><i class="fa fa-bolt"></i> 动作类型</label>
        <select id="node-input-action_name" style="width: 100%;">
            <option value="" disabled selected>请选择执行动作类型</option>
            <option value="broadcast">语音广播劝离</option>
            <option value="issue_work_order">下发执法工单</option>
            <option value="report_to_municipal">上报市政部门</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("Action", {
        category: "Application Construction",
        color: "#80b6fa",
        defaults: {
            action_name: { value: "", required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            var actionType = this.action_name;
            var actionName = "请选择";
            switch (actionType) {
                case "broadcast":
                    actionName = "语音广播劝离";
                    break;
                case "issue_work_order":
                    actionName = "下发执法工单";
                    break;
                case "report_to_municipal":
                    actionName = "上报市政部门";
                    break;
                default:
                    actionName = "请选择";
            }

            return "执行动作：" + actionName;
        },
        oneditprepare: function () {
            $("#node-input-action_name").val(this.action_name);
        },
        oneditsave: function () {
            this.action_name = $("#node-input-action_name").val();
        }
    });
</script>
