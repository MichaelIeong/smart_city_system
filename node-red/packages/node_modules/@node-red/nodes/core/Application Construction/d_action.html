<script type="text/html" data-template-name="Action">
  <div class="form-row">
    <label for="node-input-action_name"><i class="fa fa-bolt"></i> 动作类型</label>
    <select id="node-input-action_name" style="width:100%;">
      <option value="" disabled selected>加载中...</option>
    </select>
  </div>
</script>

<script type="text/javascript">
  (function () {
    var ACTION_DATA = []; // 保存数据源（mock 或接口返回）

    // 渲染下拉
    function buildOptions($select, list, currentVal) {
      ACTION_DATA = list;
      $select.empty();
      $select.append(
        '<option value="" disabled ' + (!currentVal ? "selected" : "") + '>请选择执行动作类型</option>'
      );
      list.forEach(function (item) {
        var value = item.value;
        var label = item.label;
        if (!value) return;
        var selected = value === currentVal ? "selected" : "";
        $select.append(
          '<option value="' + RED.utils.sanitize(value) + '" ' + selected + ">" +
          RED.utils.sanitize(label) +
          "</option>"
        );
      });
    }

    RED.nodes.registerType("Action", {
      category: "Application Construction",
      color: "#80b6fa",
      defaults: {
        action_name: { value: "" }
      },
      inputs: 1,
      outputs: 1,
      icon: "cog.svg",
      label: function () {
        const item = (ACTION_DATA || []).find(e => e.value === this.action_name);
        if(this.action_name) {
            return "执行动作：" + this.action_name;
        } else {
            return "执行动作：未选择";
        }
      },
      oneditprepare: function () {
        var node = this;
        var $action = $("#node-input-action_name");

        $action.html('<option value="" disabled selected>加载中...</option>');
        // 根据环境判断 API 地址
        var baseUrl;
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
          // 如果是本地开发，使用 127.0.0.1
          baseUrl = "http://127.0.0.1:8080";
        } else {
          // 如果是部署在服务器上，使用服务器的 IP 或域名
          baseUrl = "http://10.176.65.202:8080"; // 替换成实际的服务器地址
        }
        // 获取浏览器的查询参数
        var gridId = new URLSearchParams(window.location.search).get("gridId");
        $.getJSON(baseUrl + "/api/envService/list/" + gridId)
          .done(function (data) {
            if (Array.isArray(data)) {
              // 转换成符合下拉框需要的格式
              var formattedData = data.map(function (service) {
                return {
                  value: service.serviceName,  // 使用 serviceName 作为值
                  label: service.serviceName + " : " + service.description  // 使用 description 作为标签
                };
              });
              buildOptions($action, formattedData, node.action_name || "");
            }
            else {
              $event_type.html('<option value="" disabled selected>无有效数据</option>');
            }
          })
          .fail(function (xhr) {
            $action.html('<option value="" disabled selected>加载失败，请检查接口</option>');
            console.error("加载动作类型失败：", xhr);
          });
      },
      oneditsave: function () {
        this.action_name = $("#node-input-action_name").val();
      }
    });
  })();
</script>

<style>
  .form-row input[type="text"],
  .form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
  }
</style>
