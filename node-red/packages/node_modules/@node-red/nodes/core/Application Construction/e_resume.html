<script type="text/html" data-template-name="Resume">
    <div class="form-row">
        <label for="node-input-event_type"><i class="fa fa-play"></i> Event Type</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>Select Event Type</option>
            <option value="IllegalParking">IllegalParking</option>
            <option value="RoadsideBusiness">RoadsideBusiness</option>
            <option value="TrashOverflow">TrashOverflow</option>
            <option value="RoadTrashAccumulation">RoadTrashAccumulation</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-location"><i class="fa fa-map-marker"></i> Location</label>
        <input type="text" id="node-input-location" placeholder="Enter location variable (e.g., location)">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Resume', {
        category: 'Application Construction',
        color: "#80b6fa",
        defaults: {
            event_type: { value: "" },
            location: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            return "Resume: " + (this.event_type || "EventType");
        },
        oneditprepare: function () {
            $("#node-input-event_type").val(this.event_type);
            $("#node-input-location").val(this.location);
        },
        oneditsave: function () {
            this.event_type = $("#node-input-event_type").val();
            this.location = $("#node-input-location").val();
        }
    });
</script>
