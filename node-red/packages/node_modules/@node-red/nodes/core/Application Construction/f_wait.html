<script type="text/html" data-template-name="Wait">
    <div class="form-row">
        <label for="node-input-waitType"><i class="fa fa-clock"></i> Wait Type</label>
        <select id="node-input-waitType">
            <option value="" disabled selected>Select Wait Type</option>
            <option value="action_condition">Action Condition</option>
            <option value="time_condition">Time Condition</option>
        </select>
    </div>

    <div class="form-row" id="action-condition-fields" style="display: none;">
        <label for="node-input-event_type"><i class="fa fa-bell"></i> Event Type</label>
        <select id="node-input-event_type">
            <option value="" disabled selected>Select Event Type</option>
            <option value="IllegalParking">IllegalParking</option>
            <option value="RoadsideBusiness">RoadsideBusiness</option>
            <option value="TrashOverflow">TrashOverflow</option>
            <option value="RoadTrashAccumulation">RoadTrashAccumulation</option>
        </select>

        <label for="node-input-location"><i class="fa fa-map-marker"></i> Location</label>
        <input type="text" id="node-input-location" placeholder="e.g., location">
    </div>

    <div class="form-row" id="time-condition-fields" style="display: none;">
        <label for="node-input-duration"><i class="fa fa-hourglass-half"></i> Duration</label>
        <input type="number" id="node-input-duration" placeholder="e.g., 3">

        <label for="node-input-unit"><i class="fa fa-clock-o"></i> Unit</label>
        <select id="node-input-unit">
            <option value="second">Second</option>
            <option value="minute">Minute</option>
            <option value="hour">Hour</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("Wait", {
        category: "Application Construction",
        color: "#80b6fa",
        defaults: {
            waitType: { value: "" },
            event_type: { value: "" },
            location: { value: "" },
            duration: { value: "" },
            unit: { value: "minute" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            return "Wait: " + (this.waitType || "WaitType");
        },
        oneditprepare: function () {
            let node = this;
            $("#node-input-waitType").val(node.waitType);
            $("#node-input-event_type").val(node.event_type);
            $("#node-input-location").val(node.location);
            $("#node-input-duration").val(node.duration);
            $("#node-input-unit").val(node.unit);

            function updateView() {
                const type = $("#node-input-waitType").val();
                if (type === "action_condition") {
                    $("#action-condition-fields").show();
                    $("#time-condition-fields").hide();
                } else if (type === "time_condition") {
                    $("#action-condition-fields").hide();
                    $("#time-condition-fields").show();
                } else {
                    $("#action-condition-fields").hide();
                    $("#time-condition-fields").hide();
                }
            }

            $("#node-input-waitType").on("change", updateView);
            updateView();
        },
        oneditsave: function () {
            this.waitType = $("#node-input-waitType").val();
            this.event_type = $("#node-input-event_type").val();
            this.location = $("#node-input-location").val();
            this.duration = $("#node-input-duration").val();
            this.unit = $("#node-input-unit").val();
        }
    });
</script>
