<script type="text/html" data-template-name="Action">
    <div class="form-row">
        <label for="node-input-action_name"><i class="fa fa-bolt"></i> Action Name</label>
        <select id="node-input-action_name">
            <option value="Broadcast">Broadcast</option>
            <option value="IssueWorkOrder">IssueWorkOrder</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-action_location"><i class="fa fa-map-marker"></i> Action Location</label>
        <input type="text" id="node-input-action_location" placeholder='e.g., location, area1'>
    </div>

    <div class="form-row">
        <label for="node-input-action_param"><i class="fa fa-cogs"></i> Action Params</label>
        <textarea id="node-input-action_param" placeholder='Enter parameters in JSON format'></textarea>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("Action", {
        category: "Application Construction",
        color: "#80b6fa",
        defaults: {
            action_name: { value: "" },
            action_location: { value: "" },
            action_param: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            return "Action: " + (this.action_name || "ActionName");
        },
        oneditprepare: function () {
            $("#node-input-action_name").val(this.action_name);
            $("#node-input-action_location").val(this.action_location);
            $("#node-input-action_param").val(this.action_param);
        },
        oneditsave: function () {
            this.action_name = $("#node-input-action_name").val();
            this.action_location = $("#node-input-action_location").val();
            this.action_param = $("#node-input-action_param").val();
        }
    });
</script>
