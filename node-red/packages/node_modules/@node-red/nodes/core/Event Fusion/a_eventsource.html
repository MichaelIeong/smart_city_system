<script type="text/html" data-template-name="EventSource">

    <!-- CrossRegion UI -->
    <div id="eventsource-crossregion-container" style="display:none;">

        <div class="form-row">
            <label for="node-input-spaceEventType">
                <i class="fa fa-globe"></i> 环境级事件
            </label>
            <select id="node-input-spaceEventType">
                <option value="" disabled selected>请选择环境级事件</option>
            </select>
        </div>

    </div>

    <!-- Grid / Sensor UI -->
    <div id="eventsource-sensor-container" style="display:none;">

        <div class="form-row">
            <label for="node-input-sensorType">
                <i class="fa fa-microchip"></i> 传感器类型
            </label>
            <select id="node-input-sensorType">
                <option value="" disabled selected>请选择传感器类型</option>
            </select>
        </div>

        <div class="form-row">
            <label for="node-input-sensingEvent">
                <i class="fa fa-bolt"></i> 可感知的事件
            </label>
            <select id="node-input-sensingEvent">
                <option value="" disabled selected>
                    请选择该传感器可检测的事件
                </option>
            </select>
        </div>

    </div>

</script>

<script type="text/javascript">
RED.nodes.registerType('EventSource', {
    category: '事件融合',
    color: "#f89f9f",
    defaults: {
        eventSourceType: { value: "" },
        gridId: { value: "" },
        projectId: { value: "" },

        // CrossRegion
        spaceEventType: { value: "" },

        // Grid / Sensor
        sensorType: { value: "" },
        sensingEvent: { value: "" }
    },
    inputs: 0,
    outputs: 1,
    icon: "bridge.svg",

    label: function () {
        if (this.spaceEventType) {
            return "事件源：" + this.spaceEventType;
        }
        if (this.sensingEvent) {
            return "事件源：" + this.sensingEvent;
        }
        return "事件源";
    },
    paletteLabel: "事件源",

    oneditprepare: function () {
        var node = this;

        var baseUrl;
        if (
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
        ) {
            baseUrl = "http://127.0.0.1:8080";
        } else {
            baseUrl = "http://10.176.65.202:8080";
        }

        var spaceEventSelect = $("#node-input-spaceEventType");
        var sensorTypeSelect = $("#node-input-sensorType");
        var sensingEventSelect = $("#node-input-sensingEvent");

        /* ========= 1. 解析 URL 参数 ========= */
        function getUrlParam(name) {
            var params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        var gridParam = getUrlParam("gridId");
        var projectParam = getUrlParam("projectId");

        var isCrossRegion = (gridParam === "crossRegion");
        var gridId = isCrossRegion ? null : gridParam;
        
        node.eventSourceType = isCrossRegion ? "spaceEvent" : "sensorEvent";
        node.gridId = gridParam;

        node.projectId = projectParam;

        /* ========= 2. UI 显示控制 ========= */
        if (isCrossRegion) {
            $("#eventsource-crossregion-container").show();
            $("#eventsource-sensor-container").hide();
        } else {
            $("#eventsource-crossregion-container").hide();
            $("#eventsource-sensor-container").show();
        }

        /* ========= 3. CrossRegion 数据绑定 ========= */
        if (isCrossRegion) {
            $.getJSON(
                baseUrl + "/api/node-red/fusion/spaceEventTypes",
                function (list) {
                    spaceEventSelect
                        .empty()
                        .append('<option value="" disabled selected>请选择环境级事件</option>');

                    list.forEach(function (item) {
                        spaceEventSelect.append(
                            $("<option></option>")
                                .val(item)
                                .text(item)
                        );
                    });

                    if (node.spaceEventType) {
                        spaceEventSelect.val(node.spaceEventType);
                    }
                }
            );
        }

        /* ========= 4. Sensor / Grid 数据绑定 ========= */
        if (!isCrossRegion) {

            $.getJSON(
                baseUrl + "/api/node-red/fusion/sensorTypesInGrid",
                { gridId: gridId },
                function (list) {

                    sensorTypeSelect
                        .empty()
                        .append('<option value="" disabled selected>请选择传感器类型</option>');

                    if (!list || !list.length) {
                        return;
                    }

                    list.forEach(function (item) {

                        sensorTypeSelect.append(
                            $("<option></option>")
                                .val(item.productId)
                                .text(item.productName + " (" + item.productId + ")")
                        );
                    });

                    if (node.sensorType) {
                        sensorTypeSelect.val(node.sensorType).trigger("change");
                    }
                }
            );

            sensorTypeSelect.off("change").on("change", function () {

                var productId = this.value;

                sensingEventSelect
                    .empty()
                    .append(
                        '<option value="" disabled selected>' +
                        '请选择该传感器可检测的事件' +
                        '</option>'
                    );

                if (!productId) {
                    return;
                }

                $.getJSON(
                    baseUrl + "/api/product_events?productId=" + productId,
                    function (eventList) {

                        if (!eventList || !eventList.length) {
                            return;
                        }

                        eventList.forEach(function (eventItem) {

                            var eventName = eventItem.eventName;
                            var eventId = eventItem.eventId;

                            if (!eventName || !eventId) {
                                return;
                            }

                            sensingEventSelect.append(
                                $("<option></option>")
                                    .val(eventId)
                                    .text(eventName + " (" + eventId + ")")
                            );
                        });

                        if (node.sensingEvent) {
                            sensingEventSelect.val(node.sensingEvent);
                        }
                    }
                );
            });

        }
    },

    oneditsave: function () {
        var isCrossRegion =
            $("#eventsource-crossregion-container").is(":visible");

        this.eventSourceType = isCrossRegion ? "spaceEvent" : "sensorEvent";
        this.spaceEventType = $("#node-input-spaceEventType").val();
        this.sensorType = $("#node-input-sensorType").val();
        this.sensingEvent = $("#node-input-sensingEvent").val();

        if (!this.gridId) {
            var params = new URLSearchParams(window.location.search);
            this.gridId = params.get("gridId");
        }
        if (!this.projectId) {
            this.projectId = params.get("projectId");
        }
    }
});
</script>

<style>
.form-row input[type="text"],
.form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
}

.form-row button {
    margin-left: 150px;
    padding: 10px 20px;
    background-color: rgba(255, 255, 255, 0.71);
    border: 1px solid #b8b8b8;
    border-radius: 5px;
    color: #000000;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
}
</style>
