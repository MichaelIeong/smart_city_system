<script type="text/html" data-template-name="EventSource">

    <!-- 顶部模式切换 -->
    <div class="form-row">
        <button type="button"
                id="node-input-switch-source"
                class="btn btn-secondary">
            Switch to SensorSource
        </button>
    </div>

    <!-- DataSource UI -->
    <div id="eventsource-datasource-container">

        <div class="form-row">
            <label for="node-input-location"><i class="fa fa-map-marker"></i> Location</label>
            <select id="node-input-ds-location">
                <option value="" disabled selected>Select Location</option>
            </select>
        </div>

        <div class="form-row">
            <label for="node-input-datasourceType">
                <i class="fa fa-database"></i> DataSource Type
            </label>
            <select id="node-input-datasourceType">
                <option value="" disabled selected>Select DataSource Type</option>
            </select>
        </div>

    </div>

    <!-- Sensor UI -->
    <div id="eventsource-sensor-container" style="display:none;">

        <div class="form-row">
            <label for="node-input-location"><i class="fa fa-map-marker"></i> Location</label>
            <select id="node-input-sensor-location">
                <option value="" disabled selected>Select Location</option>
            </select>
        </div>

        <div class="form-row">
            <button type="button"
                    id="node-input-switch-to-type"
                    class="btn btn-secondary">
                Switch to Device Type
            </button>
        </div>

        <div class="form-row" id="device-name-row">
            <label for="node-input-device-name"><i class="fa fa-mobile"></i> Device Name</label>
            <select id="node-input-device-name">
                <option value="" disabled selected>Select Device Name</option>
            </select>
        </div>

        <div class="form-row" id="deviceType-row" style="display:none;">
            <label for="node-input-deviceType"><i class="fa fa-window-restore"></i> Device Type</label>
            <select id="node-input-deviceType">
                <option value="" disabled selected>Select Device Type</option>
            </select>
        </div>

        <div class="form-row">
            <label for="node-input-sensingFunction">
                <i class="fa fa-search"></i> Sensing Function
            </label>
            <select id="node-input-sensingFunction">
                <option value="" disabled selected>Select an ability of this sensor</option>
            </select>
        </div>

    </div>

    <input type="hidden" id="node-input-sensor-id"/>

</script>

<script type="text/javascript">
RED.nodes.registerType('EventSource', {
    category: 'Event Fusion',
    color: "#f89f9f",
    defaults: {
        name: {value: ""},
        sourceMode: {value: "DATASOURCE"},
        location: {value: ""},
        deviceName: {value: ""},
        deviceType: {value: ""},
        sensingFunction: {value: ""},
        datasourceType: {value: ""},
        sensorId: {value: ""}
    },
    inputs: 0,
    outputs: 1,
    icon: "bridge.svg",

    label: function () {
        if (this.sourceMode === "SENSOR") {
            return this.deviceName
                ? "EventSource : " + this.deviceName
                : "EventSource : ";
        }
        return this.datasourceType
            ? "EventSource : " + this.datasourceType
            : "EventSource : ";
    },

    oneditprepare: function () {
        var node = this;
        var projectId = 1;
        var sensorsData = [];
        var sourceMode = node.sourceMode || "DATASOURCE";

        var dsLocationSelect = $("#node-input-ds-location");
        var sensorLocationSelect = $("#node-input-sensor-location");
        var datasourceTypeSelect = $("#node-input-datasourceType");
        var deviceNameSelect = $("#node-input-device-name");
        var deviceTypeSelect = $("#node-input-deviceType");
        var sensingFunctionSelect = $("#node-input-sensingFunction");
        var sensorIdInput = $("#node-input-sensor-id");

        /* ===== 模式切换 ===== */
        function refreshModeUI() {
            if (sourceMode === "DATASOURCE") {
                $("#eventsource-datasource-container").show();
                $("#eventsource-sensor-container").hide();
                $("#node-input-switch-source").text("Switch to SensorSource");
            } else {
                $("#eventsource-datasource-container").hide();
                $("#eventsource-sensor-container").show();
                $("#node-input-switch-source").text("Switch to DataSource");
            }
        }

        $("#node-input-switch-source").on("click", function () {
            sourceMode = sourceMode === "DATASOURCE" ? "SENSOR" : "DATASOURCE";
            refreshModeUI();
        });

        refreshModeUI();
        if (sourceMode === "SENSOR") {
            initSensorView();
        }

        /* ===== DataSource API ===== */
        $.getJSON("http://127.0.0.1:8080/api/node-red/datasourceType", function (list) {
            datasourceTypeSelect.empty()
                .append('<option value="" disabled selected>Select DataSource Type</option>');
            list.forEach(item => {
                datasourceTypeSelect.append(
                    $("<option></option>")
                        .attr("value", item.datasourceType)
                        .text(item.datasourceType)
                );
            });
            datasourceTypeSelect.val(node.datasourceType);
        });

        /* ===== Sensor API ===== */
        function populateSelectOptions(select, options, text) {
            select.empty().append(`<option value="" disabled selected>${text}</option>`);
            options.forEach(o =>
                select.append($("<option></option>").val(o.value).text(o.text))
            );
        }

        function updateSensingFunctions(val, type) {
            sensingFunctionSelect.empty()
                .append('<option value="" disabled selected>Select an ability of this sensor</option>');
            const s = sensorsData.find(x =>
                (type === "deviceName" && x.deviceName === val) ||
                (type === "deviceType" && x.deviceType === val)
            );
            if (s && Array.isArray(s.function)) {
                s.function.forEach(f =>
                    sensingFunctionSelect.append(
                        $("<option></option>").val(f).text(f)
                    )
                );
            }
            sensingFunctionSelect.val(node.sensingFunction);
        }

        $.getJSON("http://127.0.0.1:8080/api/node-red/sensors/" + projectId, function (data) {
            sensorsData = data;

            const locations = [...new Set(data.map(s => s.location))];
            populateSelectOptions(
                dsLocationSelect,
                locations.map(l => ({ value: l, text: l })),
                "Select Location"
            );

            populateSelectOptions(
                sensorLocationSelect,
                locations.map(l => ({ value: l, text: l })),
                "Select Location"
            );

            sensorLocationSelect
                .val(node.location)
                .off("change")
                .on("change", function () {
                    const fs = sensorsData.filter(s => s.location === this.value);

                    populateSelectOptions(
                        deviceNameSelect,
                        fs.map(s => ({ value: s.deviceName, text: s.deviceName })),
                        "Select Device Name"
                    );

                    populateSelectOptions(
                        deviceTypeSelect,
                        fs.map(s => ({ value: s.deviceType, text: s.deviceType })),
                        "Select Device Type"
                    );

                    sensingFunctionSelect.empty()
                        .append('<option value="" disabled selected>Select an ability of this sensor</option>');
                });

            deviceNameSelect.on("change", function () {
                updateSensingFunctions(this.value, "deviceName");
                const s = sensorsData.find(x => x.deviceName === this.value);
                if (s) sensorIdInput.val(s.sensorId);
            });

            deviceTypeSelect.on("change", function () {
                updateSensingFunctions(this.value, "deviceType");
                const s = sensorsData.find(x => x.deviceType === this.value);
                if (s) sensorIdInput.val(s.sensorId);
            });

            if (node.location) locationSelect.trigger("change");
        });

        function initSensorView() {
            if (node.deviceName && node.deviceName !== "") {
                $("#device-name-row").show();
                $("#deviceType-row").hide();
                $("#node-input-switch-to-type").text("Switch to Device Type");
            } else if (node.deviceType && node.deviceType !== "") {
                $("#device-name-row").hide();
                $("#deviceType-row").show();
                $("#node-input-switch-to-type").text("Switch to Device Name");
            } else {
                $("#device-name-row").show();
                $("#deviceType-row").hide();
                $("#node-input-switch-to-type").text("Switch to Device Type");
            }
        }

        $("#node-input-switch-to-type")
            .off("click")
            .on("click", function () {
                var isDeviceNameVisible = $("#device-name-row").is(":visible");
                if (isDeviceNameVisible) {
                    $("#device-name-row").hide();
                    $("#deviceType-row").show();
                    $(this).text("Switch to Device Name");
                } else {
                    $("#device-name-row").show();
                    $("#deviceType-row").hide();
                    $(this).text("Switch to Device Type");
                }
            });
        },

    oneditsave: function () {
        this.sourceMode = $("#node-input-switch-source").text().includes("DataSource")
            ? "SENSOR"
            : "DATASOURCE";

        this.location =
            this.sourceMode === "SENSOR"
                ? $("#node-input-sensor-location").val()
                : $("#node-input-ds-location").val();

        this.datasourceType = $("#node-input-datasourceType").val();
        this.deviceName = $("#node-input-device-name").val();
        this.deviceType = $("#node-input-deviceType").val();
        this.sensingFunction = $("#node-input-sensingFunction").val();
        this.sensorId = $("#node-input-sensor-id").val();
    }
});
</script>

<style>
    .form-row input[type="text"],
    .form-row select {
        width: calc(100% - 180px);
        box-sizing: border-box;
    }

    .form-row button {
        margin-left: 150px;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.71);
        border: 1px solid #b8b8b8;
        border-radius: 5px;
        color: #000000;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
</style>
