<script type="text/html" data-template-name="EventSource">

    <!-- CrossRegion UI -->
    <div id="eventsource-crossregion-container" style="display:none;">

        <div class="form-row">
            <label for="node-input-spaceEventType">
                <i class="fa fa-globe"></i> SpaceEvent Type
            </label>
            <select id="node-input-spaceEventType">
                <option value="" disabled selected>Select SpaceEvent Type</option>
            </select>
        </div>

    </div>

    <!-- Grid / Sensor UI -->
    <div id="eventsource-sensor-container" style="display:none;">

        <div class="form-row">
            <label for="node-input-sensorType">
                <i class="fa fa-microchip"></i> Sensor Type
            </label>
            <select id="node-input-sensorType">
                <option value="" disabled selected>Select Sensor Type</option>
            </select>
        </div>

        <div class="form-row">
            <label for="node-input-sensingEvent">
                <i class="fa fa-bolt"></i> Sensing Event
            </label>
            <select id="node-input-sensingEvent">
                <option value="" disabled selected>
                    Select an event that can be detected by sensor
                </option>
            </select>
        </div>

    </div>

</script>

<script type="text/javascript">
RED.nodes.registerType('EventSource', {
    category: '事件融合',
    color: "#f89f9f",
    defaults: {
        eventSourceType: { value: "" },

        // CrossRegion
        spaceEventType: { value: "" },

        // Grid / Sensor
        sensorType: { value: "" },
        sensingEvent: { value: "" }
    },
    inputs: 0,
    outputs: 1,
    icon: "bridge.svg",

    label: function () {
        if (this.spaceEventType) {
            return "EventSource : " + this.spaceEventType;
        }
        if (this.sensorType) {
            return "EventSource : " + this.sensorType;
        }
        return "EventSource";
    },
    paletteLabel: "事件源",

    oneditprepare: function () {
        var node = this;

        var sensorTypeDataMap = {};

        var baseUrl;
        if (
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
        ) {
            baseUrl = "http://127.0.0.1:8080";
        } else {
            baseUrl = "http://10.176.65.202:8080";
        }

        var spaceEventSelect = $("#node-input-spaceEventType");
        var sensorTypeSelect = $("#node-input-sensorType");
        var sensingEventSelect = $("#node-input-sensingEvent");

        /* ========= 1. 解析 URL 参数 ========= */
        function getUrlParam(name) {
            var params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        var gridParam = getUrlParam("grid");

        var isCrossRegion = (gridParam === "crossRegion");
        var gridId = isCrossRegion ? null : gridParam;
        
        node.eventSourceType = isCrossRegion ? "spaceEvent" : "sensorEvent";

        /* ========= 2. UI 显示控制 ========= */
        if (isCrossRegion) {
            $("#eventsource-crossregion-container").show();
            $("#eventsource-sensor-container").hide();
        } else {
            $("#eventsource-crossregion-container").hide();
            $("#eventsource-sensor-container").show();
        }

        /* ========= 3. CrossRegion 数据绑定 ========= */
        if (isCrossRegion) {
            $.getJSON(
                baseUrl + "/api/node-red/fusion/spaceEventTypes",
                function (list) {
                    spaceEventSelect
                        .empty()
                        .append('<option value="" disabled selected>Select SpaceEvent Type</option>');

                    list.forEach(function (item) {
                        spaceEventSelect.append(
                            $("<option></option>")
                                .val(item)
                                .text(item)
                        );
                    });

                    if (node.spaceEventType) {
                        spaceEventSelect.val(node.spaceEventType);
                    }
                }
            );
        }

        /* ========= 4. Sensor / Grid 数据绑定 ========= */
        if (!isCrossRegion) {

            $.getJSON(
                baseUrl + "/api/node-red/fusion/sensorTypes",
                function (list) {

                    sensorTypeDataMap = {}; // 清空缓存

                    sensorTypeSelect
                        .empty()
                        .append('<option value="" disabled selected>Select Sensor Type</option>');

                    list.forEach(function (item) {

                        // 缓存数据：key = productId
                        sensorTypeDataMap[item.productId] = {
                            productName: item.productName,
                            sensingEvents: item.sensingEvents || []
                        };

                        // 下拉框显示：productName (productId)
                        sensorTypeSelect.append(
                            $("<option></option>")
                                .val(item.productId)
                                .text(item.productName + " (" + item.productId + ")")
                        );
                    });

                    if (node.sensorType) {
                        sensorTypeSelect.val(node.sensorType).trigger("change");
                    }
                }
            );

            sensorTypeSelect.off("change").on("change", function () {

                var productId = this.value;
                var sensorInfo = sensorTypeDataMap[productId];

                sensingEventSelect
                    .empty()
                    .append(
                        '<option value="" disabled selected>' +
                        'Select an event that can be detected by sensor' +
                        '</option>'
                    );

                if (!sensorInfo || !sensorInfo.sensingEvents.length) {
                    return;
                }

                sensorInfo.sensingEvents.forEach(function (eventName) {
                    sensingEventSelect.append(
                        $("<option></option>")
                            .val(eventName)
                            .text(eventName)
                    );
                });

                if (node.sensingEvent) {
                    sensingEventSelect.val(node.sensingEvent);
                }
            });

        }
    },

    oneditsave: function () {
        var isCrossRegion =
            $("#eventsource-crossregion-container").is(":visible");

        this.eventSourceType = isCrossRegion ? "spaceEvent" : "sensorEvent";
        this.spaceEventType = $("#node-input-spaceEventType").val();
        this.sensorType = $("#node-input-sensorType").val();
        this.sensingEvent = $("#node-input-sensingEvent").val();
    }
});
</script>

<style>
.form-row input[type="text"],
.form-row select {
    width: calc(100% - 180px);
    box-sizing: border-box;
}

.form-row button {
    margin-left: 150px;
    padding: 10px 20px;
    background-color: rgba(255, 255, 255, 0.71);
    border: 1px solid #b8b8b8;
    border-radius: 5px;
    color: #000000;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
}
</style>
