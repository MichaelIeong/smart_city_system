<script type="text/html" data-template-name="Operator">

    <!-- ===== MODE TIP ===== -->
    <div class="form-row">
        <div id="operator-mode-tip"
             style="color:#888;font-size:12px;margin-bottom:6px;">
        </div>
    </div>

    <!-- ===== MODE SWITCH ===== -->
    <div class="form-row">
        <button type="button"
                id="operator-mode-switch"
                class="red-ui-button"
                style="display:flex;align-items:center;justify-content:center;gap:6px;">
        </button>
    </div>

    <!-- ===== OPERATOR TYPE ===== -->
    <div class="form-row">
        <label for="node-input-operator">
            <i class="fa fa-calculator"></i> Operator Type
        </label>
        <select id="node-input-operator">
            <option value="" disabled selected>Select Operator Type</option>
        </select>
    </div>

    <!-- ===================== -->
    <!-- SERVICE OPERATOR UI   -->
    <!-- ===================== -->
    <div id="service-operator-container" style="display:none;">

        <div class="form-row">
            <label>
                <i class="fa fa-sign-in"></i> Inputs
            </label>
        </div>

        <div id="service-input-rows"></div>
    </div>

    <!-- ===================== -->
    <!-- COMMON OPERATOR UI    -->
    <!-- ===================== -->
    <div id="common-operator-container" style="display:none;">

        <div class="form-row" id="node-input-dynamic-value-container" style="display:none;">
            <label><i class="fa fa-pencil"></i> Value</label>
            <input type="number" id="node-input-dynamic-value" placeholder="Enter value">
        </div>

        <div class="form-row" id="common-output-type" style="display:none;">
            <label>Output Type</label>
            <input type="text" value="Boolean" disabled>
        </div>

        <div class="form-row" id="common-operator-desc" style="display:none;">
            <label>
                <i class="fa fa-info-circle"></i> Operator Description
            </label>
            <input type="text"
                id="node-input-operatorDesc"
                placeholder="Enter operator description">
        </div>

        <!-- Time_FILTER -->
        <div id="time-filter-container"
             style="display:none;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:6px;">
            <div class="form-row">
                <label>Time Mode</label>
                <select id="time-filter-mode">
                    <option value="COUNTDOWN">Count Down</option>
                    <option value="RANGE">Time Range</option>
                    <option value="EXACT">Exact Time</option>
                </select>
            </div>

            <div id="tf-countdown" style="display:none;">
                <div class="form-row">
                    <label>Duration</label>
                    <input type="number" id="tf-duration-sec">
                </div>
            </div>

            <div id="tf-range" style="display:none;">
                <div class="form-row">
                    <label>Start</label>
                    <input type="number" id="tf-startSec">
                </div>
                <div class="form-row">
                    <label>End</label>
                    <input type="number" id="tf-endSec">
                </div>
            </div>

            <div id="tf-exact" style="display:none;">
                <div class="form-row">
                    <label>Target</label>
                    <input type="number" id="tf-targetSec">
                </div>
            </div>
        </div>

        <!-- count 占位 -->
        <div id="count-placeholder"
             style="display:none;color:#aaa;font-size:12px;">
            No configuration required.
        </div>
    </div>
</script>

<script type="text/javascript">
(function () {

    const MODE_SERVICE = "service";
    const MODE_COMMON = "common";

    const TIME_FILTER = "Time_FILTER";
    const COUNT = "count";

    function show(el, flag) {
        $(el).css("display", flag ? "" : "none");
    }

    RED.nodes.registerType('Operator', {
        category: 'Event Fusion',
        color: "#fff082",
        defaults: {
            operator: { value: "" },
            operatorName: { value: "" },
            value: { value: null },
            mode: { value: MODE_SERVICE },
            operatorURL: { value: "" },
            inputsMapping: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",

        oneditprepare: function () {
            const node = this;
            let mode = node.mode || MODE_SERVICE;

            /* ===== baseUrl ===== */
            let baseUrl;
            if (
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
            ) {
                baseUrl = "http://127.0.0.1:8080";
            } else {
                baseUrl = "http://10.176.65.202:8080";
            }

            const tip = $("#operator-mode-tip");
            const switchBtn = $("#operator-mode-switch");
            const operatorSelect = $("#node-input-operator");
            const serviceInputs = $("#service-input-rows");

            const serviceBox = $("#service-operator-container");
            const commonBox = $("#common-operator-container");

            function refreshModeUI() {
                operatorSelect.empty()
                    .append('<option value="" disabled selected>Select Operator Type</option>');
                serviceInputs.empty();

                if (mode === MODE_SERVICE) {
                    tip.text("You are in service operator mode.");
                    switchBtn.text("Switch to Common Operator");
                    serviceBox.show();
                    commonBox.hide();
                    loadServiceOperators();
                } else {
                    tip.text("You are in common operator mode.");
                    switchBtn.text("Switch to Service Operator");
                    serviceBox.hide();
                    commonBox.show();
                    loadCommonOperators();
                }
            }

            switchBtn.on("click", function () {
                mode = mode === MODE_SERVICE ? MODE_COMMON : MODE_SERVICE;
                refreshModeUI();
            });

            /* ===== Service Operators ===== */
            function loadServiceOperators() {
                $.getJSON(baseUrl + "/api/is_resources/information", function (list) {
                    list.forEach(res => {
                        operatorSelect.append(
                            $("<option>")
                                .val(res.resourceName)
                                .text(res.resourceName)
                                .data("resource", res)
                        );
                    });
                });
            }

            /* ===== Common Operators ===== */
            function loadCommonOperators() {
                $.getJSON(baseUrl + "/api/node-red/operator/", function (list) {
                    list.forEach(op => {
                        operatorSelect.append(
                            $("<option>")
                                .val(op.operatorName)
                                .text(op.operatorName === TIME_FILTER ? "Time Filter" : op.operatorName)
                                .data("outputName", op.outputName)
                        );
                    });
                });
            }

            operatorSelect.on("change", function () {

                const selected = operatorSelect.find("option:selected");

                /* =========================
                * SERVICE OPERATOR MODE
                * ========================= */
                if (mode === MODE_SERVICE) {

                    serviceInputs.empty();

                    const res = selected.data("resource");
                    if (!res) return;

                    node.operatorURL = res.resourceUrl;

                    res.input.forEach(item => {
                        serviceInputs.append(`
                            <div class="form-row"
                                style="
                                    display:grid;
                                    grid-template-columns: auto 150px auto 200px auto 100px auto 1fr;
                                    gap:6px;
                                    align-items:center;
                                ">

                                <span>key:</span>
                                <input value="${item.key}" disabled>

                                <span>desc:</span>
                                <input value="${item.desc}" disabled>

                                <span>type:</span>
                                <input value="${item.type}" disabled>

                                <span>source:</span>
                                <input class="input-source" placeholder="Enter source">
                            </div>
                        `);
                    });

                    return;
                }

                /* =========================
                * COMMON OPERATOR MODE
                * ========================= */
                if (mode === MODE_COMMON) {

                    const opName = selected.val();
                    const outputName = selected.data("outputName");

                    // 统一先隐藏
                    show("#node-input-dynamic-value-container", false);
                    show("#common-output-type", false);
                    show("#common-operator-desc", false);
                    show("#time-filter-container", false);
                    show("#count-placeholder", false);

                    // Time_FILTER
                    if (opName === TIME_FILTER) {
                        show("#time-filter-container", true);
                        show("#common-output-type", true);
                        show("#common-operator-desc", true);
                        $("#common-output-type input").val(outputName || "");
                        return;
                    }

                    // count
                    if (opName === COUNT) {
                        show("#count-placeholder", true);
                        show("#common-output-type", true);
                        show("#common-operator-desc", true);
                        $("#common-output-type input").val(outputName || "");
                        return;
                    }

                    // 普通 operator
                    show("#node-input-dynamic-value-container", true);
                    show("#common-output-type", true);
                    show("#common-operator-desc", true);
                    $("#common-output-type input").val(outputName || "");
                }
            });

            refreshModeUI();

            this.oneditsave = function () {
                node.mode = mode;
                node.operator = operatorSelect.val();

                if (mode === MODE_SERVICE) {
                    const mappings = [];
                    serviceInputs.find(".form-row").each(function () {
                        const inputs = $(this).find("input");
                        mappings.push({
                            key: inputs.eq(0).val(),
                            desc: inputs.eq(1).val(),
                            type: inputs.eq(2).val(),
                            source: inputs.eq(3).val()
                        });
                    });
                    node.inputsMapping = mappings;
                }

                if (mode === MODE_COMMON) {
                    node.operator = operatorSelect.val();

                    if (node.operator === TIME_FILTER) {
                        // Time_FILTER 的 value 保存逻辑
                        // ⚠️ 这里直接复用你给的原始 Time_FILTER 保存代码
                        // 不重复粘贴，避免破坏
                        return;
                    }

                    if (node.operator === COUNT) {
                        node.value = null;
                        return;
                    }

                    // 普通 operator
                    node.value = $("#node-input-dynamic-value").val();
                    node.operatorName = $("#node-input-operatorName").val();
                    node.operatorDesc = $("#node-input-operatorDesc").val();
                }
            };
        }
    });

})();
</script>
