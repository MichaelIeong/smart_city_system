<script type="text/html" data-template-name="Operator">

    <!-- ===== MODE TIP ===== -->
    <div class="form-row">
        <div id="operator-mode-tip"
             style="color:#888;font-size:12px;margin-bottom:6px;">
        </div>
    </div>

    <!-- ===== MODE SWITCH ===== -->
    <div class="form-row">
        <button type="button"
                id="operator-mode-switch"
                class="red-ui-button"
                style="display:flex;align-items:center;justify-content:center;gap:6px;">
        </button>
    </div>

    <!-- ===== OPERATOR TYPE ===== -->
    <div class="form-row">
        <label for="node-input-operator">
            <i class="fa fa-calculator"></i> 算子类型
        </label>
        <select id="node-input-operator">
            <option value="" disabled selected>请选择算子类型</option>
        </select>
    </div>

    <!-- ===================== -->
    <!-- SERVICE OPERATOR UI   -->
    <!-- ===================== -->
    <div id="service-operator-container" style="display:none;">
        <div class="form-row">
            <label><i class="fa fa-sign-in"></i> 输入参数</label>
        </div>

        <div style="border:1px solid #ccc;border-radius:6px;background:#f9f9f9;padding:8px;">
            <table style="width:100%;border-collapse:collapse;font-size:12px;">
                <thead>
                    <tr style="border-bottom:1px solid #ddd;text-align:left;">
                        <th style="padding:6px;">键</th>
                        <th style="padding:6px;">描述</th>
                        <th style="padding:6px;">类型</th>
                        <th style="padding:6px;">数据来源</th>
                    </tr>
                </thead>
                <tbody id="service-input-rows">
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===================== -->
    <!-- COMMON OPERATOR UI    -->
    <!-- ===================== -->
    <div id="common-operator-container" style="display:none;">

        <!-- 普通 Value -->
        <div class="form-row" id="node-input-dynamic-value-container" style="display:none;">
            <label><i class="fa fa-pencil"></i> 数值</label>
            <input type="number" id="node-input-dynamic-value" placeholder="请输入数值">
        </div>

        <!-- Output Type -->
        <div class="form-row" id="common-output-type" style="display:none;">
            <label>输出类型</label>
            <input type="text" disabled>
        </div>

        <!-- Operator Description -->
        <div class="form-row" id="common-operator-desc" style="display:none;">
            <label><i class="fa fa-info-circle"></i> 算子描述</label>
            <input type="text"
                   id="node-input-operatorDesc"
                   placeholder="请输入算子描述">
        </div>

        <!-- ===== Time_FILTER ===== -->
        <div id="time-filter-container"
             style="display:none;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:6px;">

            <!-- 当前时间显示 -->
            <div class="form-row" style="margin-bottom:6px;">
                <label><i class="fa fa-info-circle"></i> 当前本地时间</label>
                <div style="display:flex;gap:12px;align-items:center;">
                    <div id="local-now" style="font-weight:600;"></div>
                    <div id="local-tz" style="font-size:12px;color:#666;"></div>
                </div>
            </div>

            <div class="form-row">
                <label>时间模式</label>
                <select id="time-filter-mode">
                    <option value="COUNTDOWN">倒计时</option>
                    <option value="RANGE">时间范围</option>
                    <option value="EXACT">指定时间</option>
                </select>
            </div>

            <div id="tf-countdown" style="display:none;">
                <div class="form-row">
                    <label>持续时间（秒）</label>
                    <input type="number" id="tf-duration-sec">
                </div>
            </div>

            <div id="tf-range" style="display:none;">
                <div class="form-row">
                    <label>开始时间（秒）</label>
                    <input type="number" id="tf-startSec">
                </div>
                <div class="form-row">
                    <label>结束时间（秒）</label>
                    <input type="number" id="tf-endSec">
                </div>
            </div>

            <div id="tf-exact" style="display:none;">
                <div class="form-row">
                    <label>目标时间（秒）</label>
                    <input type="number" id="tf-targetSec">
                </div>
            </div>
        </div>

        <!-- ===== COUNT CONFIG ===== -->
        <div id="count-container"
             style="display:none;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:6px;">

            <!-- TimeWindow -->
            <div class="form-row">
                <label>时间窗口</label>
                <div style="display:flex;align-items:center;gap:6px;">
                    <input type="number" id="count-time-window" style="width:120px;">
                    <span>分钟</span>
                </div>
            </div>

            <!-- CountingEvent -->
            <div class="form-row">
                <label>统计事件类型</label>
                <select id="count-space-event-type">
                    <option value="" disabled selected>请选择统计事件类型</option>
                </select>
            </div>

            <!-- Conditions -->
            <div class="form-row">
                <label>条件配置</label>
            </div>

            <div style="border:1px solid #ccc;border-radius:6px;background:#f9f9f9;padding:8px;">
                <table style="width:100%;border-collapse:collapse;font-size:12px;">
                    <thead>
                        <tr style="border-bottom:1px solid #ddd;text-align:left;">
                            <th style="padding:6px;">JSON路径</th>
                            <th style="padding:6px;">类型</th>
                            <th style="padding:6px;">操作符</th>
                            <th style="padding:6px;">值</th>
                            <th style="padding:6px;width:50px;text-align:center;">删除</th>
                        </tr>
                    </thead>
                    <tbody id="count-condition-rows">
                    </tbody>
                </table>
            </div>

            <div style="display:flex;justify-content:center;margin-top:8px;">
                <button type="button"
                        id="count-add-condition"
                        class="red-ui-button"
                        style="display:flex;align-items:center;justify-content:center;gap:6px;">
                    <i class="fa fa-plus"></i>
                    <span>添加</span>
                </button>
            </div>
        </div>
    </div>
</script>

<script type="text/javascript">
(function () {

    const MODE_SERVICE = "service";
    const MODE_COMMON = "common";

    const TIME_FILTER = "Time_FILTER";
    const COUNT = "count";

    // Time Filter 子模式常量
    const TF_MODE_COUNTDOWN = "COUNTDOWN";
    const TF_MODE_RANGE = "RANGE";
    const TF_MODE_EXACT = "EXACT";

    const TYPE_OPTIONS = ["String", "Number", "Boolean"];
    const OP_OPTIONS = [
        "Equal To",
        "Not Equal To",
        "Greater Than",
        "Greater Than or Equal To",
        "Less Than",
        "Less Than or Equal To",
        "Like"
    ];

    function getEventPayloadFields() {
        const eventSourceNodes = RED.nodes.filterNodes({ type: "EventSource" });
        for (let n of eventSourceNodes) {
            if (Array.isArray(n.eventPayload) && n.eventPayload.length) {
                console.log("使用payload：", n.eventPayload);
                return n.eventPayload;
            }
        }
        return [];
    }

    function show(el, flag) {
        $(el).css("display", flag ? "" : "none");
    }

    // Time Filter 时间显示工具函数
    function formatLocal(ms) {
        return new Date(ms).toLocaleString();
    }
    function getCurrentTimeZone() {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || "Local Timezone";
    }

    function buildConditionRow(data = {}) {
        const fields = getEventPayloadFields();

        const typeOpts =
            `<option value="" disabled ${!data.type ? "selected" : ""}></option>` +
            TYPE_OPTIONS.map(t =>
                `<option value="${t}" ${data.type === t ? "selected" : ""}>${t}</option>`
            ).join("");

        const opOpts =
            `<option value="" disabled ${!data.operation ? "selected" : ""}></option>` +
            OP_OPTIONS.map(o =>
                `<option value="${o}" ${data.operation === o ? "selected" : ""}>${o}</option>`
            ).join("");

        const fieldOpts =
            `<option value="" disabled ${!data.jsonPath ? "selected" : ""}></option>` +
            fields.map(f =>
                `<option value="${f}" ${data.jsonPath === f ? "selected" : ""}>${f}</option>`
            ).join("");

        const valueFieldOpts =
            `<option value="" disabled ${!data.value ? "selected" : ""}></option>` +
            fields.map(f =>
                `<option value="${f}" ${data.value === f ? "selected" : ""}>${f}</option>`
            ).join("");

        return $(`
            <tr class="count-condition-row" style="border-bottom:1px solid #eee;">
                <td style="padding:6px;">
                    <select class="cc-jsonpath" style="width:100%;">
                        ${fieldOpts}
                    </select>
                </td>

                <td style="padding:6px;">
                    <select class="cc-type" style="width:100%;">
                        ${typeOpts}
                    </select>
                </td>

                <td style="padding:6px;">
                    <select class="cc-op" style="width:100%;">
                        ${opOpts}
                    </select>
                </td>

                <td style="padding:6px;">
                    <select class="cc-value" style="width:100%;">
                        ${valueFieldOpts}
                    </select>
                </td>

                <td style="padding:6px;text-align:center;">
                    <button type="button"
                            class="red-ui-button cc-del"
                            style="width:30px;height:28px;display:flex;align-items:center;justify-content:center;">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `);
    }

    RED.nodes.registerType('Operator', {
        category: '事件融合',
        color: "#fff082",
        defaults: {
            operator: { value: "" },
            serviceOperator: { value: "" },
            commonOperator: { value: "" },
            operatorDesc: { value: "" },
            value: { value: null },
            mode: { value: MODE_SERVICE },
            operatorURL: { value: "" },
            inputsMapping: { value: [] },
            output: { value: null }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",

        label: function () {
            return this.operator
                ? `算子：${this.operator}`
                : "算子";
        },
        paletteLabel: "算子",

        oneditprepare: function () {
            const node = this;
            node.mode = node.mode || MODE_SERVICE;

            if (node.mode === MODE_SERVICE) {
                node.operator = node.serviceOperator || "";
            } else {
                node.operator = node.commonOperator || "";
            }

            /* ===== baseUrl ===== */
            let baseUrl;
            if (
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
            ) {
                baseUrl = "http://127.0.0.1:8080";
            } else {
                baseUrl = "http://10.176.65.202:8080";
            }

            /* ========= CrossRegion 判断 ========= */
            function getUrlParam(name) {
                var params = new URLSearchParams(window.location.search);
                return params.get(name);
            }
            var gridParam = getUrlParam("gridId");
            var isCrossRegion = (gridParam === "crossRegion");

            const tip = $("#operator-mode-tip");
            const switchBtn = $("#operator-mode-switch");
            const operatorSelect = $("#node-input-operator");
            const serviceInputs = $("#service-input-rows");

            const serviceBox = $("#service-operator-container");
            const commonBox = $("#common-operator-container");

            /* ===== Time Filter DOM ===== */
            const tfContainer = $("#time-filter-container");
            const tfMode = $("#time-filter-mode");

            const countBox = $("#count-container");
            const condBox = $("#count-condition-rows");

            function refreshTFUI(mode) {
                show("#tf-countdown", mode === TF_MODE_COUNTDOWN);
                show("#tf-range", mode === TF_MODE_RANGE);
                show("#tf-exact", mode === TF_MODE_EXACT);
            }

            // Time Filter 当前时间刷新
            function tickLocalNow() {
                $("#local-now").text(formatLocal(Date.now()));
                $("#local-tz").text(getCurrentTimeZone());
            }
            tickLocalNow();
            setInterval(tickLocalNow, 1000);

            function refreshModeUI() {
                operatorSelect.empty()
                    .append('<option value="" disabled selected>请选择算子类型</option>');
                serviceInputs.empty();

                if (node.mode === MODE_SERVICE) {
                    tip.text("当前为服务算子模式。");
                    switchBtn.text("切换到通用算子模式");
                    serviceBox.show();
                    commonBox.hide();
                    loadServiceOperators();
                } else {
                    tip.text("当前为通用算子模式。");
                    switchBtn.text("切换到服务算子模式");
                    serviceBox.hide();
                    commonBox.show();
                    loadCommonOperators();
                }
            }

            switchBtn.on("click", function () {

                if (node.mode === MODE_SERVICE) {
                    node.serviceOperator = $("#node-input-operator").val();
                } else {
                    node.commonOperator = $("#node-input-operator").val();
                }

                node.mode = node.mode === MODE_SERVICE ? MODE_COMMON : MODE_SERVICE;

                if (node.mode === MODE_SERVICE) {
                    node.operator = node.serviceOperator || "";
                } else {
                    node.operator = node.commonOperator || "";
                }

                refreshModeUI();
            });

            /* ===== Service Operators ===== */
            function loadServiceOperators() {
                $.getJSON(baseUrl + "/api/is_resources/information", function (list) {
                    list.forEach(res => {
                        operatorSelect.append(
                            $("<option>")
                                .val(res.resourceName)
                                .text(res.resourceName)
                                .data("resource", res)
                        );
                    });
                    if (node.serviceOperator) {
                        operatorSelect.val(node.serviceOperator);
                        if (operatorSelect.val() === node.serviceOperator) {
                            operatorSelect.trigger("change");
                        }
                    }
                });
            }

            /* ===== Common Operators ===== */
            function loadCommonOperators() {
                $.getJSON(baseUrl + "/api/node-red/operator/", function (list) {
                    list.forEach(op => {
                        operatorSelect.append(
                            $("<option>")
                                .val(op.operatorName)
                                .text(op.operatorName === TIME_FILTER ? "Time Filter" : op.operatorName)
                                .data("outputName", op.outputName)
                        );
                    });
                });
                // mock
                operatorSelect.append(
                    $("<option></option>")
                        .val(COUNT)
                        .text("count")
                );
                if (node.commonOperator) {
                    operatorSelect.val(node.commonOperator);
                    if (operatorSelect.val() === node.commonOperator) {
                        operatorSelect.trigger("change");
                    }
                }
            }

            operatorSelect.on("change", function () {
                
                const selected = operatorSelect.find("option:selected");
                const fields = getEventPayloadFields();

                /* ===== SERVICE MODE ===== */
                if (node.mode === MODE_SERVICE) {
                    serviceInputs.empty();
                    const res = selected.data("resource");
                    if (!res) return;

                    node.operatorURL = res.resourceUrl;
                    node.output = {
                        key: res.output.key,
                        desc: res.output.desc,
                        type: res.output.type
                    };
                    const savedMappings = Array.isArray(node.inputsMapping)
                        ? node.inputsMapping
                        : [];

                    res.input.forEach(item => {
                        const saved = savedMappings.find(m => m.key === item.key) || {};
                        const sourceOpts =
                            `<option value="" disabled ${!saved.source ? "selected" : ""}></option>` +
                            fields.map(f =>
                                `<option value="${f}" ${saved.source === f ? "selected" : ""}>${f}</option>`
                            ).join("");

                        serviceInputs.append(`
                            <tr class="service-input-row" style="border-bottom:1px solid #eee;">
                                <td style="padding:6px;">
                                    <input value="${item.key}" disabled style="width:100%;">
                                </td>

                                <td style="padding:6px;">
                                    <input value="${item.desc}" disabled style="width:100%;">
                                </td>

                                <td style="padding:6px;">
                                    <input value="${item.type}" disabled style="width:100%;">
                                </td>

                                <td style="padding:6px;">
                                    <select class="input-source" style="width:100%;">
                                        ${sourceOpts}
                                    </select>
                                </td>
                            </tr>
                        `);
                    });
                    return;
                }

                /* ===== COMMON MODE ===== */
                if (node.mode === MODE_COMMON) {

                    const opName = selected.val();
                    const outputName = selected.data("outputName");

                    show("#node-input-dynamic-value-container", false);
                    show("#common-output-type", false);
                    show("#common-operator-desc", false);
                    show("#time-filter-container", false);
                    show("#count-container", false);

                    if (opName === TIME_FILTER) {
                        show("#time-filter-container", true);
                        show("#common-output-type", true);
                        show("#common-operator-desc", true);
                        $("#common-output-type input").val(outputName || "");
                        refreshTFUI(tfMode.val());
                        return;
                    }

                    if (opName === COUNT) {
                        show("#count-container", true);
                        show("#common-operator-desc", true);
                        
                        const spaceEventSelect = $("#count-space-event-type");

                        const url = isCrossRegion
                            ? baseUrl + "/api/node-red/fusion/spaceEventTypes"
                            : baseUrl + "/api/node-red/fusion/allProductEvents";

                        $.getJSON(url, function (list) {

                            spaceEventSelect
                                .empty()
                                .append('<option value="" disabled selected>请选择统计事件类型</option>');

                            if (isCrossRegion) {
                                // ===== 环境级事件 =====
                                list.forEach(function (item) {
                                    spaceEventSelect.append(
                                        $("<option></option>").val(item).text(item)
                                    );
                                });
                            } else {
                                // ===== 产品级事件 =====
                                list.forEach(function (item) {
                                    spaceEventSelect.append(
                                        $("<option></option>")
                                            .val(item.productEventId)
                                            .text(item.productEventName)
                                    );
                                });
                            }

                            if (node.value && node.value.countingEvent) {
                                spaceEventSelect.val(node.value.countingEvent);
                            }
                        });

                        condBox.empty();

                        if (node.value && Array.isArray(node.value.conditions) && node.value.conditions.length) {
                            node.value.conditions.forEach(c => {
                                condBox.append(buildConditionRow(c));
                            });
                        } else {
                            condBox.append(buildConditionRow());
                        }
                        return;
                    }

                    show("#node-input-dynamic-value-container", true);
                    show("#common-output-type", true);
                    show("#common-operator-desc", true);
                    $("#common-output-type input").val(outputName || "");
                }
            });

            tfMode.on("change", function () {
                refreshTFUI($(this).val());
            });

            $("#count-add-condition").on("click", function () {
                condBox.append(buildConditionRow());
            });

            condBox.on("click", ".cc-del", function () {
                $(this).closest(".count-condition-row").remove();
            });

            refreshModeUI();
        },
        oneditsave: function () {
            this.mode = this.mode || MODE_SERVICE;

            if (this.mode === MODE_SERVICE) {
                this.serviceOperator = $("#node-input-operator").val();
                this.operator = this.serviceOperator;
            } else {
                this.commonOperator = $("#node-input-operator").val();
                this.operator = this.commonOperator;
            }   

            /* ===== SERVICE MODE ===== */
            if (this.mode === MODE_SERVICE) {

                const mappings = [];
                $("#service-input-rows")
                    .find("tr")
                    .each(function () {
                        const inputs = $(this).find("input");
                        const sourceSelect = $(this).find(".input-source");
                        mappings.push({
                            key: inputs.eq(0).val(),
                            desc: inputs.eq(1).val(),
                            type: inputs.eq(2).val(),
                            source: sourceSelect.val()
                        });
                    });

                this.inputsMapping = mappings;
                return;
            }

            /* ===== COMMON MODE ===== */
            if (this.mode === MODE_COMMON) {
                this.operatorDesc = $("#node-input-operatorDesc").val();
                if (this.operator === COUNT) {
                    const conditions = [];

                    $("#count-condition-rows .count-condition-row").each(function () {
                        const row = $(this);
                        conditions.push({
                            jsonPath: row.find(".cc-jsonpath").val(),
                            type: row.find(".cc-type").val(),
                            operation: row.find(".cc-op").val(),
                            value: row.find(".cc-value").val()
                        });
                    });

                    this.value = {
                        timeWindowMinute: Number($("#count-time-window").val()),
                        countingEvent: $("#count-space-event-type").val(),
                        conditions
                    };
                }
            }
        }

    });

})();
</script>
