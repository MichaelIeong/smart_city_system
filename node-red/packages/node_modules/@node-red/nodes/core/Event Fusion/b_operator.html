<script type="text/html" data-template-name="Operator">
    <div id="node-input-input-container"></div>

    <div class="form-row">
        <label for="node-input-operator"><i class="fa fa-calculator"></i> Operator</label>
        <select id="node-input-operator">
            <option value="" disabled selected>Select an operator</option>
        </select>
    </div>

    <!-- 普通数值输入 -->
    <div class="form-row" id="node-input-dynamic-value-container" style="display:none;">
        <label for="node-input-dynamic-value"><i class="fa fa-pencil"></i> Value</label>
        <input type="number" id="node-input-dynamic-value" placeholder="Enter value">
    </div>

    <!-- Time_FILTER 专用配置 -->
    <div id="time-filter-container"
         style="display:none;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:6px;">
        <div class="form-row" style="margin-bottom:6px;">
            <label><i class="fa fa-info-circle"></i> Current Local Time</label>
            <div style="display:flex;gap:12px;align-items:center;">
                <div id="local-now" style="font-weight:600;"></div>
                <div id="local-tz" style="font-size:12px;color:#666;"></div>
            </div>
        </div>

        <div class="form-row">
            <label for="time-filter-mode"><i class="fa fa-clock-o"></i> Time Mode</label>
            <select id="time-filter-mode">
                <option value="COUNTDOWN">Count Down</option>
                <option value="RANGE">Time Range</option>
                <option value="EXACT">Exact Time</option>
            </select>
        </div>

        <!-- COUNTDOWN -->
        <div id="tf-countdown" style="display:none;">
            <div class="form-row">
                <label for="tf-duration-sec"><i class="fa fa-hourglass-half"></i> Duration</label>
                <input type="number" id="tf-duration-sec" placeholder="e.g. 600">
            </div>
        </div>

        <!-- RANGE -->
        <div id="tf-range" style="display:none;">
            <div class="form-row">
                <label for="tf-startSec"><i class="fa fa-play"></i> Start Time</label>
                <input type="number" id="tf-startSec" placeholder="epoch seconds">
            </div>
            <div class="form-row">
                <label for="tf-endSec"><i class="fa fa-stop"></i> End Time</label>
                <input type="number" id="tf-endSec" placeholder="epoch seconds">
            </div>
        </div>

        <!-- EXACT -->
        <div id="tf-exact" style="display:none;">
            <div class="form-row">
                <label for="tf-targetSec"><i class="fa fa-bullseye"></i> Target Time</label>
                <input type="number" id="tf-targetSec" placeholder="epoch seconds">
            </div>
        </div>
    </div>

    <div class="form-row">
        <label for="node-input-output"><i class="fa fa-sign-out"></i> Output</label>
        <select id="node-input-output">
            <option value="" disabled selected>Select output item for the next node</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-operatorName"><i class="fa fa-pencil-square-o"></i> Operator Name</label>
        <input type="text" id="node-input-operatorName" placeholder="Enter operator name">
    </div>

    <!-- ANALYZE 专用配置 -->
    <div id="analyze-container"
        style="display:none;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:6px;">

        <div id="analyze-rows"></div>

        <div class="form-row">
            <button type="button" id="analyze-add-row" class="red-ui-button">
                <i class="fa fa-plus"></i> Add mapping
            </button>
        </div>
    </div>

</script>

<script type="text/javascript">
    (function () {
        const TIME_FILTER = "Time_FILTER";
        const ANALYZE = "analyze";
        const MODE_COUNTDOWN = "COUNTDOWN";
        const MODE_RANGE = "RANGE";
        const MODE_EXACT = "EXACT";

        function formatLocal(ms) {
            try {
                return new Intl.DateTimeFormat(undefined, {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                }).format(new Date(ms));
            } catch {
                return new Date(ms).toLocaleString();
            }
        }

        function getCurrentTimeZone() {
            try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local Timezone';
            } catch {
                return 'Local Timezone';
            }
        }

        function show(el, flag) {
            $(el).css("display", flag ? "" : "none");
        }

        function toNumber(raw) {
            if (raw === null || raw === undefined || raw === "") return null;
            const n = Number(raw);
            return isNaN(n) ? null : n;
        }

        RED.nodes.registerType('Operator', {
            category: 'Event Fusion',
            color: "#fff082",
            defaults: {
                operatorName: {value: ""},
                value: {value: null},
                operator: {value: ""},
                output: {value: ""}
            },
            inputs: 1,
            outputs: 1,
            icon: "cog.svg",
            label: function () {
                let labelStr = this.operatorName ? `Operator: ${this.operatorName}` : "Operator";
                if (this.operator === TIME_FILTER && this.value) {
                    labelStr += ` (Time ${this.value.mode})`;
                } else if (this.operator && this.value != null) {
                    labelStr += ` (${this.operator} ${this.value})`;
                } else if (this.operator) {
                    labelStr += ` (${this.operator})`;
                }
                return labelStr;
            },
            oneditprepare: function () {
                var node = this;
                $("#node-input-operatorName").val(node.operatorName);

                var operatorSelect = $("#node-input-operator");
                var outputSelect = $("#node-input-output");

                var tfContainer = $("#time-filter-container");
                var tfMode = $("#time-filter-mode");
                var tfDurationSec = $("#tf-duration-sec");
                var tfStartSec = $("#tf-startSec");
                var tfEndSec = $("#tf-endSec");
                var tfTargetSec = $("#tf-targetSec");
                var analyzeContainer = $("#analyze-container");
                var analyzeRows = $("#analyze-rows");
                var analyzeAddBtn = $("#analyze-add-row");

                function tickLocalNow() {
                    $("#local-now").text(formatLocal(Date.now()));
                    $("#local-tz").text(getCurrentTimeZone());
                }

                tickLocalNow();
                var localTimer = setInterval(tickLocalNow, 1000);

                function refreshUI(mode) {
                    show("#tf-countdown", mode === MODE_COUNTDOWN);
                    show("#tf-range", mode === MODE_RANGE);
                    show("#tf-exact", mode === MODE_EXACT);
                }

                function fillFromNode() {
                    if (node.operator === TIME_FILTER && node.value) {
                        const v = node.value;
                        tfMode.val(v.mode);
                        refreshUI(v.mode);
                        if (v.mode === MODE_COUNTDOWN) {
                            tfDurationSec.val(v.durationSec ?? "");
                        } else if (v.mode === MODE_RANGE) {
                            tfStartSec.val(v.startSec ?? "");
                            tfEndSec.val(v.endSec ?? "");
                        } else if (v.mode === MODE_EXACT) {
                            tfTargetSec.val(v.targetSec ?? "");
                        }
                    } else {
                        tfMode.val(MODE_COUNTDOWN);
                        refreshUI(MODE_COUNTDOWN);
                    }
                }

                function addAnalyzeRow(fromVal = "", toVal = "") {
                    const row = $(`
                        <div class="form-row analyze-row" style="display:flex;gap:8px;align-items:center;">
                            <span>from:</span>
                            <input type="text" class="analyze-from" style="width:120px" value="${fromVal}">
                            <span>to:</span>
                            <input type="text" class="analyze-to" style="width:120px" value="${toVal}">
                            <button type="button" class="red-ui-button analyze-remove">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    `);

                    row.find(".analyze-remove").on("click", function () {
                        row.remove();
                    });

                    analyzeRows.append(row);
                }

                $.getJSON("http://127.0.0.1:8080/api/node-red/operator/", function (data) {
                    operatorSelect.empty().append('<option value="" disabled selected>Select an operator</option>');
                    data.forEach(function (op) {
                        operatorSelect.append(
                            $("<option></option>")
                                .attr("value", op.operatorName)
                                .text(op.operatorName === TIME_FILTER ? "Time Filter" : op.operatorName)
                                .data("requiredInput", op.requiredInput)
                                .data("outputName", op.outputName)
                        );
                    });
                    // 🔧 mock 一个 analyze operator（后端未完成前）
                    operatorSelect.append(
                        $("<option></option>")
                            .attr("value", ANALYZE)
                            .text("analyze (mock)")
                    );
                    if (node.operator) {
                        operatorSelect.val(node.operator);
                        if (node.operator === TIME_FILTER) {
                            tfContainer.show();
                            fillFromNode();
                        }
                        if (node.operator === ANALYZE) {
                            analyzeContainer.show();
                            analyzeRows.empty();

                            if (node.value && Array.isArray(node.value.mappings)) {
                                node.value.mappings.forEach(m =>
                                    addAnalyzeRow(m.from, m.to)
                                );
                            } else {
                                addAnalyzeRow();
                            }
                        }
                    }
                    operatorSelect.change(function () {
                        const val = $(this).val();

                        tfContainer.hide();
                        analyzeContainer.hide();

                        if (val === TIME_FILTER) {
                            tfContainer.show();
                            fillFromNode();
                        }

                        if (val === ANALYZE) {
                            analyzeContainer.show();

                            analyzeRows.empty();
                            if (node.value && Array.isArray(node.value.mappings)) {
                                node.value.mappings.forEach(m =>
                                    addAnalyzeRow(m.from, m.to)
                                );
                            } else {
                                addAnalyzeRow(); // 默认一行
                            }
                        }
                    });
                    analyzeAddBtn.on("click", function () {
                        addAnalyzeRow();
                    });
                });

                tfMode.on("change", function () {
                    refreshUI($(this).val());
                });

                this.oneditsave = function () {
                    clearInterval(localTimer);
                    node.operatorName = $("#node-input-operatorName").val();
                    node.operator = $("#node-input-operator").val();
                    node.output = $("#node-input-output").val();
                    if (node.operator === TIME_FILTER) {
                        const mode = tfMode.val();
                        if (mode === MODE_COUNTDOWN) {
                            node.value = {mode: MODE_COUNTDOWN, durationSec: toNumber(tfDurationSec.val())};
                        } else if (mode === MODE_RANGE) {
                            node.value = {
                                mode: MODE_RANGE,
                                startSec: toNumber(tfStartSec.val()),
                                endSec: toNumber(tfEndSec.val())
                            };
                        } else if (mode === MODE_EXACT) {
                            node.value = {mode: MODE_EXACT, targetSec: toNumber(tfTargetSec.val())};
                        }
                    }
                };
                this.oneditcancel = function () {
                    clearInterval(localTimer);
                };
                this.oneditdelete = function () {
                    clearInterval(localTimer);
                };
            }
        });
    })();
</script>
