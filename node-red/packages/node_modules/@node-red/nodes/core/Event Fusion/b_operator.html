<script type="text/html" data-template-name="Operator">
    <div id="node-input-input-container"></div>

    <div class="form-row">
        <label for="node-input-operator"><i class="fa fa-calculator"></i> Operator</label>
        <select id="node-input-operator">
            <option value="" disabled selected>Select an operator</option>
        </select>
    </div>

    <div class="form-row" id="node-input-value-container" style="display:none;">
        <label for="node-input-value"><i class="fa fa-pencil"></i> Value</label>
        <input type="text" id="node-input-value" placeholder="Enter value">
    </div>

    <!-- Time_FILTER 专用配置 -->
    <div id="time-filter-container"
         style="display:none;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:6px;">
        <div class="form-row" style="margin-bottom:6px;">
            <label><i class="fa fa-info-circle"></i> Current Local Time</label>
            <div style="display:flex;gap:12px;align-items:center;">
                <div id="local-now" style="font-weight:600;"></div>
                <div id="local-tz" style="font-size:12px;color:#666;"></div>
            </div>
        </div>

        <div class="form-row">
            <label for="time-filter-mode"><i class="fa fa-clock-o"></i> Time Mode</label>
            <select id="time-filter-mode">
                <option value="COUNTDOWN">Count Down</option>
                <option value="RANGE">Time Range</option>
                <option value="EXACT">Exact Time</option>
            </select>
        </div>

        <!-- COUNTDOWN -->
        <div id="tf-countdown" style="display:none;">
            <div class="form-row">
                <label for="tf-duration-sec"><i class="fa fa-hourglass-half"></i> Duration</label>
                <input type="number" id="tf-duration-sec" placeholder="e.g. 600">
            </div>
        </div>

        <!-- RANGE -->
        <div id="tf-range" style="display:none;">
            <div class="form-row">
                <label for="tf-startSec"><i class="fa fa-play"></i> Start Time</label>
                <input type="number" id="tf-startSec" placeholder="epoch seconds">
            </div>
            <div class="form-row">
                <label for="tf-endSec"><i class="fa fa-stop"></i> End Time</label>
                <input type="number" id="tf-endSec" placeholder="epoch seconds">
            </div>
        </div>

        <!-- EXACT -->
        <div id="tf-exact" style="display:none;">
            <div class="form-row">
                <label for="tf-targetSec"><i class="fa fa-bullseye"></i> Target Time</label>
                <input type="number" id="tf-targetSec" placeholder="epoch seconds">
            </div>
        </div>
    </div>

    <div class="form-row">
        <label for="node-input-output"><i class="fa fa-sign-out"></i> Output</label>
        <select id="node-input-output">
            <option value="" disabled selected>Select output item for the next node</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-operatorName"><i class="fa fa-pencil-square-o"></i> Operator Name</label>
        <input type="text" id="node-input-operatorName" placeholder="Enter operator name">
    </div>
</script>

<script type="text/javascript">
    (function () {
        const TIME_FILTER = "Time_FILTER";
        const MODE_COUNTDOWN = "COUNTDOWN";
        const MODE_RANGE = "RANGE";
        const MODE_EXACT = "EXACT";

        function formatLocal(ms) {
            try {
                return new Intl.DateTimeFormat(undefined, {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                }).format(new Date(ms));
            } catch {
                return new Date(ms).toLocaleString();
            }
        }

        function getCurrentTimeZone() {
            try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local Timezone';
            } catch {
                return 'Local Timezone';
            }
        }

        function show(el, flag) {
            $(el).css("display", flag ? "" : "none");
        }

        function toNumber(raw) {
            if (raw === null || raw === undefined || raw === "") return null;
            const n = Number(raw);
            return isNaN(n) ? null : n;
        }

        RED.nodes.registerType('Operator', {
            category: 'Event Fusion',
            color: "#fff082",
            defaults: {
                operatorName: {value: ""},
                value: {value: null},  // 注意：绑定 node-input-value
                operator: {value: ""},
                output: {value: ""}
            },
            inputs: 1,
            outputs: 1,
            icon: "cog.svg",
            label: function () {
                let labelStr = this.operatorName ? `Operator: ${this.operatorName}` : "Operator";
                if (this.operator && this.value != null) {
                    labelStr += ` (${this.operator} ${this.value})`;
                } else if (this.operator) {
                    labelStr += ` (${this.operator})`;
                }
                return labelStr;
            },

            oneditprepare: function () {
                const node = this;

                $("#node-input-operatorName").val(node.operatorName);

                const operatorSelect = $("#node-input-operator");
                const outputSelect = $("#node-input-output");
                const valueContainer = $("#node-input-value-container");
                const valueInput = $("#node-input-value");

                const tfContainer = $("#time-filter-container");
                const tfMode = $("#time-filter-mode");
                const tfDurationSec = $("#tf-duration-sec");
                const tfStartSec = $("#tf-startSec");
                const tfEndSec = $("#tf-endSec");
                const tfTargetSec = $("#tf-targetSec");

                // 本地时间显示
                const tickLocalNow = () => {
                    $("#local-now").text(formatLocal(Date.now()));
                    $("#local-tz").text(getCurrentTimeZone());
                };
                tickLocalNow();
                this._localTimer = setInterval(tickLocalNow, 1000);

                function refreshTFUI(mode) {
                    show("#tf-countdown", mode === MODE_COUNTDOWN);
                    show("#tf-range", mode === MODE_RANGE);
                    show("#tf-exact", mode === MODE_EXACT);
                }

                function fillTimeFilterFromValue() {
                    let cfg = null;
                    if (node.operator === TIME_FILTER && node.value) {
                        if (typeof node.value === "string") {
                            try {
                                cfg = JSON.parse(node.value);
                            } catch (e) {
                                cfg = null;
                            }
                        } else if (typeof node.value === "object") {
                            cfg = node.value;
                        }
                    }
                    if (!cfg) {
                        tfMode.val(MODE_COUNTDOWN);
                        refreshTFUI(MODE_COUNTDOWN);
                        tfDurationSec.val("");
                        tfStartSec.val("");
                        tfEndSec.val("");
                        tfTargetSec.val("");
                        return;
                    }
                    const m = cfg.mode || MODE_COUNTDOWN;
                    tfMode.val(m);
                    refreshTFUI(m);
                    if (m === MODE_COUNTDOWN) {
                        tfDurationSec.val(cfg.durationSec ?? "");
                    } else if (m === MODE_RANGE) {
                        tfStartSec.val(cfg.startSec ?? "");
                        tfEndSec.val(cfg.endSec ?? "");
                    } else {
                        tfTargetSec.val(cfg.targetSec ?? "");
                    }
                }

                // operator change
                operatorSelect.on("change", function () {
                    const val = $(this).val();
                    const opt = $(this).find("option:selected");
                    const outputName = opt.data("outputName");

                    if (val === TIME_FILTER) {
                        tfContainer.show();
                        valueContainer.hide();
                        valueInput.val("");
                        fillTimeFilterFromValue();
                    } else if (val) {
                        tfContainer.hide();
                        valueContainer.show();

                        // 普通算子回填旧值（字符串）
                        if (node.operator === val && node.value != null && typeof node.value !== "object") {
                            valueInput.val(node.value);
                        } else {
                            valueInput.val("");
                        }
                    } else {
                        tfContainer.hide();
                        valueContainer.hide();
                        valueInput.val("");
                    }

                    // output 下拉
                    outputSelect.empty().append(
                        '<option value="" disabled selected>Select output item for the next node</option>'
                    );
                    if (outputName) {
                        outputSelect.append(
                            '<option value="' + outputName + '">' + outputName + '</option>'
                        );
                        const initial = node.output || outputName;
                        outputSelect.val(initial);
                        outputSelect.prop("disabled", false);
                    } else if (node.output) {
                        outputSelect.append(
                            '<option value="' + node.output + '">' + node.output + '</option>'
                        );
                        outputSelect.val(node.output);
                        outputSelect.prop("disabled", false);
                    } else {
                        outputSelect.prop("disabled", !val);
                    }
                });

                // 加载后端 operator 列表
                $.getJSON("http://127.0.0.1:8080/api/node-red/operator/", function (data) {
                    operatorSelect.empty().append(
                        '<option value="" disabled selected>Select an operator</option>'
                    );

                    data.forEach(function (op) {
                        operatorSelect.append(
                            $("<option></option>")
                                .attr("value", op.operatorName)
                                .text(op.operatorName === TIME_FILTER ? "Time Filter" : op.operatorName)
                                .data("requiredInput", op.requiredInput)
                                .data("outputName", op.outputName)
                        );
                    });

                    if (node.operator) {
                        operatorSelect.val(node.operator);
                    }
                    operatorSelect.trigger("change");
                });

                tfMode.on("change", function () {
                    refreshTFUI($(this).val());
                });
            },

            oneditsave: function () {
                if (this._localTimer) {
                    clearInterval(this._localTimer);
                    this._localTimer = null;
                }

                const operator = $("#node-input-operator").val();
                const tfMode = $("#time-filter-mode");
                const tfDurationSec = $("#tf-duration-sec");
                const tfStartSec = $("#tf-startSec");
                const tfEndSec = $("#tf-endSec");
                const tfTargetSec = $("#tf-targetSec");
                const valueInput = $("#node-input-value");

                this.operatorName = $("#node-input-operatorName").val();
                this.operator = operator;
                this.output = $("#node-input-output").val();

                if (operator === TIME_FILTER) {
                    const mode = tfMode.val() || MODE_COUNTDOWN;
                    let cfg;
                    if (mode === MODE_COUNTDOWN) {
                        cfg = {mode: MODE_COUNTDOWN, durationSec: toNumber(tfDurationSec.val())};
                    } else if (mode === MODE_RANGE) {
                        cfg = {
                            mode: MODE_RANGE,
                            startSec: toNumber(tfStartSec.val()),
                            endSec: toNumber(tfEndSec.val())
                        };
                    } else {
                        cfg = {mode: MODE_EXACT, targetSec: toNumber(tfTargetSec.val())};
                    }
                    const jsonStr = JSON.stringify(cfg);
                    valueInput.val(jsonStr);
                    this.value = jsonStr;
                } else {
                    // 普通算子，直接存文本
                    const raw = valueInput.val();
                    this.value = raw;
                }
            },

            oneditcancel: function () {
                if (this._localTimer) {
                    clearInterval(this._localTimer);
                    this._localTimer = null;
                }
            },
            oneditdelete: function () {
                if (this._localTimer) {
                    clearInterval(this._localTimer);
                    this._localTimer = null;
                }
            }
        });
    })();
</script>
