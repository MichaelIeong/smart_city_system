<script type="text/html" data-template-name="Publish">

    <!-- ===== SpaceEvent Name ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventName">
            <i class="fa fa-tag"></i> 环境级事件名称（中文）
        </label>
        <input type="text"
               id="node-input-spaceEventName"
               placeholder="请输入环境级事件名称（中文）">
    </div>

    <!-- ===== SpaceEvent Type ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventType">
            <i class="fa fa-tag"></i> 环境级事件名称（英文）
        </label>
        <input type="text"
               id="node-input-spaceEventType"
               placeholder="请输入环境级事件名称（英文）">
    </div>

    <!-- ===== SpaceEvent Description ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventDesc">
            <i class="fa fa-info-circle"></i> 环境级事件描述
        </label>
        <input type="text"
               id="node-input-spaceEventDesc"
               placeholder="请输入环境级事件描述">
    </div>

    <!-- ===== Publish Condition ===== -->
    <div class="form-row">
        <label for="node-input-publishCondition">
            <i class="fa fa-filter"></i> 发布条件
        </label>
        <div style="display:flex;gap:6px;">

            <select id="pc-level1" style="width:30%;">
                <option value="">选择节点</option>
                <option value="eventsource">事件源</option>
                <option value="operator">算子</option>
            </select>

            <select id="pc-level2" style="width:30%;">
                <option value="">选择数据来源</option>
            </select>

            <input type="text"
                id="pc-expression"
                style="width:40%;"
                placeholder="表达式">
        </div>
    </div>

    <!-- ===== Outputs ===== -->
    <div class="form-row">
        <label><i class="fa fa-sign-out"></i> 输出参数</label>
    </div>

    <div style="border:1px solid #ccc;border-radius:6px;background:#f9f9f9;padding:8px;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead>
                <tr style="border-bottom:1px solid #ddd;text-align:left;">
                    <th style="padding:6px;">键</th>
                    <th style="padding:6px;">类型</th>
                    <th style="padding:6px;">描述</th>
                    <th style="padding:6px;">数据来源</th>
                    <th style="padding:6px;width:40px;"></th>
                </tr>
            </thead>
            <tbody id="publish-output-rows">
            </tbody>
        </table>
    </div>

    <!-- ===== Add mapping ===== -->
    <div style="display:flex;justify-content:center;margin-top:8px;">
        <button type="button"
                id="output-add-row"
                class="red-ui-button"
                style="display:flex;align-items:center;justify-content:center;gap:6px;">
            <i class="fa fa-plus"></i>
            <span>添加映射</span>
        </button>
    </div>

</script>

<script type="text/javascript">
(function () {

    const TYPE_OPTIONS = ["String", "Number", "Boolean"];
    const FIELD_OPTIONS = [
        "id","tempId","eventNo","eventName","eventTempName","eventMain",
        "eventType","eventTypeName","eventLevel","fromAlarm","dataSource",
        "eventTime","status","handleStatus","filterStatus","filterRef",
        "plate_number","filterTime","handler","handleTime","handleFlag",
        "validTime","finishTime","dutyNetwork","dutyNetworkName","address",
        "longitude","latitude","remarks","photos","deviceRef","createUser",
        "createUserName","lastDoneUserName","todoUserName","createTime",
        "lastUpdateUser","lastUpdateUserName","lastUpdateTime","stopReason",
        "discardReason","flowResult","areaCodes","areaNames","reportUserInfo",
        "dictMap"
    ];

    function buildOutputRow(data = {}) {

        const typeOpts =
            `<option value="" disabled ${!data.type ? "selected" : ""}></option>` +
            TYPE_OPTIONS.map(t =>
                `<option value="${t}" ${data.type === t ? "selected" : ""}>${t}</option>`
            ).join("");
        const sourceOpts =
            `<option value="" disabled ${!data.source ? "selected" : ""}></option>` +
            FIELD_OPTIONS.map(f =>
                `<option value="${f}" ${data.source === f ? "selected" : ""}>${f}</option>`
            ).join("");

        return $(`
            <tr class="publish-output-row"
                style="border-bottom:1px solid #eee;">

                <td style="padding:6px;">
                    <input class="po-key"
                        style="width:100%;"
                        value="${data.key || ""}">
                </td>

                <td style="padding:6px;">
                    <select class="po-type"
                            style="width:100%;">
                        ${typeOpts}
                    </select>
                </td>

                <td style="padding:6px;">
                    <input class="po-desc"
                        style="width:100%;"
                        value="${data.description || ""}">
                </td>

                <td style="padding:6px;">
                    <select class="po-source" style="width:100%;">
                        ${sourceOpts}
                    </select>
                </td>

                <td style="padding:6px;text-align:center;">
                    <button type="button"
                            class="red-ui-button po-del"
                            style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `);
    }

    RED.nodes.registerType('Publish', {
        category: '事件融合',
        color: '#80b6fa',
        defaults: {
            spaceEventName: { value: "" },
            spaceEventType: { value: "" },
            spaceEventDesc: { value: "" },
            publishCondition: {
                value: {
                    level1: "",
                    level2: "",
                    expression: ""
                }
            },
            outputsMapping: { value: [] },
            backendIp: { value: "" }
        },
        inputs: 1,
        outputs: 0,
        icon: "file-in.svg",
        label: function () {
            return this.spaceEventName
                ? `发布: ${this.spaceEventName}`
                : "发布";
        },
        paletteLabel: "发布",
        oneditprepare: function () {
            const node = this;
            const rowsBox = $("#publish-output-rows");
            const level1 = $("#pc-level1");
            const level2 = $("#pc-level2");
            const expression = $("#pc-expression");

            function getBackendIp() {
                const hostname = window.location.hostname;
                return (hostname === "localhost" || hostname === "127.0.0.1")
                    ? "127.0.0.1"
                    : hostname;
            }
            if (!node.backendIp) {
                node.backendIp = getBackendIp();
            }

            $("#node-input-spaceEventName").val(node.spaceEventName || "");
            $("#node-input-spaceEventType").val(node.spaceEventType || "");
            $("#node-input-spaceEventDesc").val(node.spaceEventDesc || "");

            if (node.publishCondition) {
                level1.val(node.publishCondition.level1 || "");
                renderLevel2(node.publishCondition.level1);
                level2.val(node.publishCondition.level2 || "");
                expression.val(node.publishCondition.expression || "");
            }

            var operatorNodes = RED.nodes.filterNodes({ type: "Operator" });

            function renderLevel2(type) {

                level2.empty();
                level2.append(`<option value="">选择数据来源</option>`);

                // ===== 事件源 =====
                if (type === "eventsource") {
                    FIELD_OPTIONS.forEach(f => {
                        level2.append(`<option value="${f}">${f}</option>`);
                    });
                }

                // ===== 算子 =====
                if (type === "operator") {

                    operatorNodes.forEach(n => {

                        // 服务算子
                        if (n.mode === "service") {
                            if (n.output && n.output.key) {
                                level2.append(`<option value="${n.output.key}">
                                    ${n.output.key}
                                </option>`);
                            }
                        }

                        // 通用算子
                        else {
                            if (n.operator) {
                                level2.append(`<option value="${n.operator}">
                                    ${n.operator}
                                </option>`);
                            }
                        }

                    });
                }
            }

            level1.on("change", function () {
                const val = $(this).val();
                renderLevel2(val);
            });

            rowsBox.empty();

            /* 恢复已有 Outputs */
            if (Array.isArray(node.outputsMapping) && node.outputsMapping.length) {
                node.outputsMapping.forEach(item => {
                    rowsBox.append(buildOutputRow(item));
                });
            } else {
                rowsBox.append(buildOutputRow());
            }

            /* Add */
            $("#output-add-row").off("click").on("click", function () {
                rowsBox.append(buildOutputRow());
            });

            /* Delete */
            rowsBox.on("click", ".po-del", function () {
                $(this).closest(".publish-output-row").remove();
            });
        },
        oneditsave: function () {
            this.backendIp = this.backendIp;

            this.spaceEventName =
                $("#node-input-spaceEventName").val();
            
            this.spaceEventType =
                $("#node-input-spaceEventType").val();

            this.spaceEventDesc =
                $("#node-input-spaceEventDesc").val();

            this.publishCondition = {
                level1: $("#pc-level1").val(),
                level2: $("#pc-level2").val(),
                expression: $("#pc-expression").val()
            };

            const outputs = [];

            $("#publish-output-rows .publish-output-row").each(function () {
                const row = $(this);
                outputs.push({
                    key: row.find(".po-key").val(),
                    type: row.find(".po-type").val(),
                    description: row.find(".po-desc").val(),
                    source: row.find(".po-source").val()
                });
            });

            this.outputsMapping = outputs;
        }
    });

    RED.comms.subscribe("publish-result", function (topic, data) {

        let msg = data.message;

        try {
            const obj = JSON.parse(msg);
            msg = obj.message || msg;
        } catch (e) {}

        RED.notify(
            "规则上传结果: " + msg,
            { type: "info", timeout: 5000 }
        );

    });
})();
</script>
