<script type="text/html" data-template-name="Publish">
    <div class="form-row">
        <label for="node-input-rulename"><i class="fa fa-tag"></i> Rule Name</label>
        <input type="text" id="node-input-rulename" placeholder="Enter Rule Name">
    </div>
    <div class="form-row">
        <label for="node-input-fusionTarget"><i class="fa fa-database"></i> Fusion Target</label>
        <select id="node-input-fusionTarget">
            <option value="">Loading...</option>
        </select>
    </div>

    <!-- 隐藏的 branchId 输入，交给 Node-RED 自动持久化 -->
    <div class="form-row" style="display:none;">
        <input type="hidden" id="node-input-branchId">
    </div>

    <div class="form-row">
        <p>
            This rule will be published in the Smart City System after you<br>
            select all the nodes and press deploy.
        </p>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Publish', {
        category: 'Event Fusion',
        color: '#80b6fa',
        defaults: {
            name: {value: ""},
            rulename: {value: ""},
            fusionTarget: {value: ""},
            branchId: {value: ""}   // 配置里有这个字段
        },
        inputs: 1,
        outputs: 0,
        icon: "file-in.svg",
        label: function () {
            return "Publish : " + (this.rulename || "");
        },
        oneditprepare: function () {
            // 让编辑器输入框和当前配置同步
            $("#node-input-rulename").val(this.rulename || "");

            // 把当前 config.branchId 映射到隐藏 input（可选，不映射也行）
            $("#node-input-branchId").val(this.branchId || "");

            const $select = $("#node-input-fusionTarget");

            // 提前储存之前选中的值
            $select.data('selected', this.fusionTarget || "");

            // 清空并显示 loading
            $select.empty().append('<option disabled selected>Loading...</option>');

            // 拉取 fusion target 列表
            $.get("http://localhost:8080/api/node-red/fusion_table/")
                .done(function (data) {
                    $select.empty();
                    if (Array.isArray(data)) {
                        data.forEach(function (item) {
                            const isSelected = item === $select.data('selected');
                            $select.append(
                                '<option value="' + item + '" ' +
                                (isSelected ? 'selected' : '') + '>' +
                                item + '</option>'
                            );
                        });
                    } else {
                        $select.append('<option disabled>Error loading</option>');
                    }
                })
                .fail(function () {
                    $select.empty().append('<option disabled>Failed to load</option>');
                });
        },
        oneditsave: function () {
            this.rulename = $("#node-input-rulename").val();
            this.fusionTarget = $("#node-input-fusionTarget").val();

            // 这里保存 branchId（一般来自 flowJson 注入）
            const bid = $("#node-input-branchId").val();
            if (bid !== undefined && bid !== null && bid !== "") {
                this.branchId = bid;
            }
        }
    });
</script>
