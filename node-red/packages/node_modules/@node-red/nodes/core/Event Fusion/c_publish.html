<script type="text/html" data-template-name="Publish">

    <!-- ===== SpaceEvent Name ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventName">
            <i class="fa fa-tag"></i> SpaceEvent Name
        </label>
        <input type="text"
               id="node-input-spaceEventName"
               placeholder="Enter SpaceEvent Name">
    </div>

    <!-- ===== SpaceEvent Type ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventType">
            <i class="fa fa-tag"></i> SpaceEvent Type
        </label>
        <input type="text"
               id="node-input-spaceEventType"
               placeholder="Enter SpaceEvent Type">
    </div>

    <!-- ===== SpaceEvent Description ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventDesc">
            <i class="fa fa-info-circle"></i> SpaceEvent Description
        </label>
        <input type="text"
               id="node-input-spaceEventDesc"
               placeholder="Enter SpaceEvent Description">
    </div>

    <!-- ===== Publish Condition ===== -->
    <div class="form-row">
        <label for="node-input-publishCondition">
            <i class="fa fa-filter"></i> Publish Condition
        </label>
        <input type="text"
               id="node-input-publishCondition"
               placeholder="Enter Publish Condition">
    </div>

    <!-- ===== Outputs ===== -->
    <div class="form-row">
        <label><i class="fa fa-sign-out"></i> Outputs</label>
    </div>

    <div id="publish-output-rows"></div>

    <!-- ===== Add mapping ===== -->
    <div style="display:flex;justify-content:center;margin-top:8px;">
        <button type="button"
                id="output-add-row"
                class="red-ui-button"
                style="display:flex;align-items:center;justify-content:center;gap:6px;">
            <i class="fa fa-plus"></i>
            <span>Add mapping</span>
        </button>
    </div>

</script>

<script type="text/javascript">
(function () {

    const TYPE_OPTIONS = ["String", "Number", "Boolean"];

    function buildOutputRow(data = {}) {

        const typeOpts =
            `<option value="" disabled selected>Select Type</option>` +
            TYPE_OPTIONS.map(t =>
                `<option value="${t}" ${data.type === t ? "selected" : ""}>${t}</option>`
            ).join("");

        return $(`
            <div class="publish-output-row"
                 style="
                    display:grid;
                    grid-template-columns: 6fr 1fr;
                    gap:8px;
                    align-items:center;
                    margin-bottom:8px;
                 ">

                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span>key:</span>
                    <input class="po-key" style="width:120px;"
                           value="${data.key || ""}">

                    <span>type:</span>
                    <select class="po-type" style="width:120px;">
                        ${typeOpts}
                    </select>

                    <span>description:</span>
                    <input class="po-desc" style="width:120px;"
                           value="${data.description || ""}">

                    <span>source:</span>
                    <input class="po-source" style="width:120px;"
                           value="${data.source || ""}">
                </div>

                <!-- delete -->
                <button type="button"
                        class="red-ui-button po-del"
                        style="width:30px;display:flex;align-items:center;justify-content:center;">
                    <i class="fa fa-trash"></i>
                </button>
            </div>
        `);
    }

    RED.nodes.registerType('Publish', {
        category: '事件融合',
        color: '#80b6fa',
        defaults: {
            spaceEventName: { value: "" },
            spaceEventType: { value: "" },
            spaceEventDesc: { value: "" },
            publishCondition: { value: "" },
            outputsMapping: { value: [] }
        },
        inputs: 1,
        outputs: 0,
        icon: "file-in.svg",
        label: function () {
            return this.spaceEventName
                ? `发布: ${this.spaceEventName}`
                : "发布";
        },
        paletteLabel: "发布",
        oneditprepare: function () {
            const node = this;
            const rowsBox = $("#publish-output-rows");

            $("#node-input-spaceEventName").val(node.spaceEventName || "");
            $("#node-input-spaceEventType").val(node.spaceEventType || "");
            $("#node-input-spaceEventDesc").val(node.spaceEventDesc || "");
            $("#node-input-publishCondition").val(node.publishCondition || "");

            rowsBox.empty();

            /* 恢复已有 Outputs */
            if (Array.isArray(node.outputsMapping) && node.outputsMapping.length) {
                node.outputsMapping.forEach(item => {
                    rowsBox.append(buildOutputRow(item));
                });
            } else {
                rowsBox.append(buildOutputRow());
            }

            /* Add */
            $("#output-add-row").off("click").on("click", function () {
                rowsBox.append(buildOutputRow());
            });

            /* Delete */
            rowsBox.on("click", ".po-del", function () {
                $(this).closest(".publish-output-row").remove();
            });
        },
        oneditsave: function () {

            this.spaceEventName =
                $("#node-input-spaceEventName").val();
            
            this.spaceEventType =
                $("#node-input-spaceEventType").val();

            this.spaceEventDesc =
                $("#node-input-spaceEventDesc").val();

            this.publishCondition =
                $("#node-input-publishCondition").val();

            const outputs = [];

            $("#publish-output-rows .publish-output-row").each(function () {
                const row = $(this);
                outputs.push({
                    key: row.find(".po-key").val(),
                    type: row.find(".po-type").val(),
                    description: row.find(".po-desc").val(),
                    source: row.find(".po-source").val()
                });
            });

            this.outputsMapping = outputs;
        }
    });
})();
</script>
