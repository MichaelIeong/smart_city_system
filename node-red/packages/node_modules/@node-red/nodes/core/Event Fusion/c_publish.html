<script type="text/html" data-template-name="Publish">

    <!-- ===== SpaceEvent Name ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventName">
            <i class="fa fa-tag"></i> 环境级事件名称（中文）
        </label>
        <input type="text"
               id="node-input-spaceEventName"
               placeholder="请输入环境级事件名称（中文）">
    </div>

    <!-- ===== SpaceEvent Type ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventType">
            <i class="fa fa-tag"></i> 环境级事件名称（英文）
        </label>
        <input type="text"
               id="node-input-spaceEventType"
               placeholder="请输入环境级事件名称（英文）">
    </div>

    <!-- ===== SpaceEvent Description ===== -->
    <div class="form-row">
        <label for="node-input-spaceEventDesc">
            <i class="fa fa-info-circle"></i> 环境级事件描述
        </label>
        <input type="text"
               id="node-input-spaceEventDesc"
               placeholder="请输入环境级事件描述">
    </div>

    <!-- ===== Publish Condition ===== -->
    <div class="form-row">
        <label for="node-input-publishCondition">
            <i class="fa fa-filter"></i> 发布条件
        </label>
        <input type="text"
               id="node-input-publishCondition"
               placeholder="请输入发布条件">
    </div>

    <!-- ===== Outputs ===== -->
    <div class="form-row">
        <label><i class="fa fa-sign-out"></i> 输出参数</label>
    </div>

    <div style="border:1px solid #ccc;border-radius:6px;background:#f9f9f9;padding:8px;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead>
                <tr style="border-bottom:1px solid #ddd;text-align:left;">
                    <th style="padding:6px;">键</th>
                    <th style="padding:6px;">类型</th>
                    <th style="padding:6px;">描述</th>
                    <th style="padding:6px;">数据来源</th>
                    <th style="padding:6px;width:40px;"></th>
                </tr>
            </thead>
            <tbody id="publish-output-rows">
            </tbody>
        </table>
    </div>

    <!-- ===== Add mapping ===== -->
    <div style="display:flex;justify-content:center;margin-top:8px;">
        <button type="button"
                id="output-add-row"
                class="red-ui-button"
                style="display:flex;align-items:center;justify-content:center;gap:6px;">
            <i class="fa fa-plus"></i>
            <span>添加映射</span>
        </button>
    </div>

</script>

<script type="text/javascript">
(function () {

    const TYPE_OPTIONS = ["String", "Number", "Boolean"];

    function buildOutputRow(data = {}) {

        const typeOpts =
            `<option value="" disabled ${!data.type ? "selected" : ""}></option>` +
            TYPE_OPTIONS.map(t =>
                `<option value="${t}" ${data.type === t ? "selected" : ""}>${t}</option>`
            ).join("");

        return $(`
            <tr class="publish-output-row"
                style="border-bottom:1px solid #eee;">

                <td style="padding:6px;">
                    <input class="po-key"
                        style="width:100%;"
                        value="${data.key || ""}">
                </td>

                <td style="padding:6px;">
                    <select class="po-type"
                            style="width:100%;">
                        ${typeOpts}
                    </select>
                </td>

                <td style="padding:6px;">
                    <input class="po-desc"
                        style="width:100%;"
                        value="${data.description || ""}">
                </td>

                <td style="padding:6px;">
                    <input class="po-source"
                        style="width:100%;"
                        value="${data.source || ""}">
                </td>

                <td style="padding:6px;text-align:center;">
                    <button type="button"
                            class="red-ui-button po-del"
                            style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `);
    }

    RED.nodes.registerType('Publish', {
        category: '事件融合',
        color: '#80b6fa',
        defaults: {
            spaceEventName: { value: "" },
            spaceEventType: { value: "" },
            spaceEventDesc: { value: "" },
            publishCondition: { value: "" },
            outputsMapping: { value: [] },
            backendIp: { value: "" }
        },
        inputs: 1,
        outputs: 0,
        icon: "file-in.svg",
        label: function () {
            return this.spaceEventName
                ? `发布: ${this.spaceEventName}`
                : "发布";
        },
        paletteLabel: "发布",
        oneditprepare: function () {
            const node = this;
            const rowsBox = $("#publish-output-rows");

            function getBackendIp() {
                const hostname = window.location.hostname;
                return (hostname === "localhost" || hostname === "127.0.0.1")
                    ? "127.0.0.1"
                    : hostname;
            }
            if (!node.backendIp) {
                node.backendIp = getBackendIp();
            }

            $("#node-input-spaceEventName").val(node.spaceEventName || "");
            $("#node-input-spaceEventType").val(node.spaceEventType || "");
            $("#node-input-spaceEventDesc").val(node.spaceEventDesc || "");
            $("#node-input-publishCondition").val(node.publishCondition || "");

            rowsBox.empty();

            /* 恢复已有 Outputs */
            if (Array.isArray(node.outputsMapping) && node.outputsMapping.length) {
                node.outputsMapping.forEach(item => {
                    rowsBox.append(buildOutputRow(item));
                });
            } else {
                rowsBox.append(buildOutputRow());
            }

            /* Add */
            $("#output-add-row").off("click").on("click", function () {
                rowsBox.append(buildOutputRow());
            });

            /* Delete */
            rowsBox.on("click", ".po-del", function () {
                $(this).closest(".publish-output-row").remove();
            });
        },
        oneditsave: function () {
            this.backendIp = this.backendIp;

            this.spaceEventName =
                $("#node-input-spaceEventName").val();
            
            this.spaceEventType =
                $("#node-input-spaceEventType").val();

            this.spaceEventDesc =
                $("#node-input-spaceEventDesc").val();

            this.publishCondition =
                $("#node-input-publishCondition").val();

            const outputs = [];

            $("#publish-output-rows .publish-output-row").each(function () {
                const row = $(this);
                outputs.push({
                    key: row.find(".po-key").val(),
                    type: row.find(".po-type").val(),
                    description: row.find(".po-desc").val(),
                    source: row.find(".po-source").val()
                });
            });

            this.outputsMapping = outputs;
        }
    });

    RED.comms.subscribe("publish-result", function (topic, data) {

        let msg = data.message;

        try {
            const obj = JSON.parse(msg);
            msg = obj.message || msg;
        } catch (e) {}

        RED.notify(
            "规则上传结果: " + msg,
            { type: "info", timeout: 5000 }
        );

    });
})();
</script>
