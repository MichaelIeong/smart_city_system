    <div class="form-row">
        <label for="node-input-rulename"><i class="fa fa-tag"></i> SpaceEvent Description</label>
        <input type="text" id="node-input-rulename" placeholder="Enter SpaceEvent Description">
    </div>
    <!-- <div class="form-row">
        <label for="node-input-fusionTarget"><i class="fa fa-database"></i> Fusion Target</label>
        <select id="node-input-fusionTarget">
            <option value="">Loading...</option>
        </select>
    </div> -->

    <div class="analyze-row"
        style="
            display:grid;
            grid-template-columns: 6fr 1fr;
            gap:8px;
            align-items:center;
            margin-bottom:8px;
        ">

        <div style="display:flex;align-items:center;gap:6px;">
            <span style="text-align:right;">key:</span>

        <button type="button"
                id="analyze-add-row"

<script type="text/javascript">
    RED.nodes.registerType('Publish', {
        category: 'Event Fusion',
        color: '#80b6fa',
        defaults: {
            name: { value: "" },
            rulename: { value: "" },
            fusionTarget: { value: "" }
        },
        inputs: 1,
        outputs: 0,
        icon: "file-in.svg",
        label: function () {
            return "Publish : " + (this.rulename || "");
        },
        oneditprepare: function () {
            $("#node-input-rulename").val(this.rulename || "");

            const $select = $("#node-input-fusionTarget");

            // 提前儲存之前選擇的值
            $select.data('selected', this.fusionTarget || "");

            // 清除並顯示 loading
            $select.empty().append(`<option disabled selected>Loading...</option>`);

            // 取得 fusion target 清單
            $.get("http://localhost:8080/api/node-red/fusion_table/")
                .done(function (data) {
                    $select.empty();
                    if (Array.isArray(data)) {
                        data.forEach(function (item) {
                            const isSelected = item === $select.data('selected');
                            $select.append(`<option value="${item}" ${isSelected ? "selected" : ""}>${item}</option>`);
                        });
                    } else {
                        $select.append(`<option disabled>Error loading</option>`);
                    }
                })
                .fail(function () {
                    $select.empty().append(`<option disabled>Failed to load</option>`);
                });
        },
        oneditsave: function () {
            this.rulename = $("#node-input-rulename").val();
            this.fusionTarget = $("#node-input-fusionTarget").val();
        }
    });
</script>
