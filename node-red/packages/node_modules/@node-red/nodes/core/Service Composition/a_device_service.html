<script type="text/html" data-template-name="Device Service">
    <div class="form-row">
        <label for="node-input-deviceType"><i class="fa fa-window-restore"></i> Device Type</label>
        <select id="node-input-deviceType">
            <option value="" disabled selected>Select Device Type</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-deviceService"><i class="fa fa-cogs"></i> Actuating Function</label>
        <select id="node-input-deviceService">
            <option value="" disabled selected>Select Actuating Function</option>
        </select>
    </div>

    <input type="hidden" id="node-input-device-id"/>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Device Service', {
        category: 'Service Composition',
        color: "#efa1f8",
        defaults: {
            name: { value: "" },
            deviceType: { value: "" },
            deviceTypeName: { value: "" },        // 👈 新增
            deviceService: { value: "" },
            deviceServiceName: { value: "" },     // 👈 新增
            deviceId: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "light.svg",
        label: function () {
            return this.deviceTypeName ? "Device Service : " + this.deviceTypeName : "Device Service";
        },
        oneditprepare: function () {
            var node = this;
            var projectId = 1;
            var deviceTypeSelect = $("#node-input-deviceType");
            var deviceServiceSelect = $("#node-input-deviceService");
            var deviceIdInput = $("#node-input-device-id");

            var deviceTypeData = [];

            function populateSelectOptions(selectElement, options, defaultText) {
                selectElement.empty().append('<option value="" disabled selected>' + defaultText + '</option>');
                options.forEach(function (option) {
                    selectElement.append($("<option></option>").attr("value", option.value).text(option.text));
                });
            }

            $.getJSON("http://127.0.0.1:8080/api/deviceTypes/alldevicetype?projectId=" + projectId, function (data) {
                if (!data || data.length === 0) {
                    console.error("No device types received from the API.");
                    return;
                }

                deviceTypeData = data;

                var deviceTypes = data.map(function (dt) {
                    return {
                        value: dt.deviceTypeId,
                        text: dt.deviceTypeName
                    };
                });

                populateSelectOptions(deviceTypeSelect, deviceTypes, "Select Device Type");

                if (node.deviceType) {
                    deviceTypeSelect.val(node.deviceType).trigger("change");
                }
            });

            deviceTypeSelect.off("change").on("change", function () {
                var selectedId = $(this).val();
                deviceIdInput.val(selectedId);

                var selectedType = deviceTypeData.find(dt => dt.deviceTypeId === selectedId);

                if (selectedType && Array.isArray(selectedType.actuatingFunctions)) {
                    var funcs = selectedType.actuatingFunctions.map(function (f) {
                        return {
                            value: f.id,
                            text: f.name
                        };
                    });
                    populateSelectOptions(deviceServiceSelect, funcs, "Select Actuating Function");

                    if (node.deviceService) {
                        deviceServiceSelect.val(node.deviceService);
                    }
                } else {
                    populateSelectOptions(deviceServiceSelect, [], "No Functions Available");
                }
            });

            if (node.deviceType) {
                deviceTypeSelect.trigger("change");
            }
        },
        oneditsave: function () {
            this.name = $("#node-input-name").val();

            this.deviceType = $("#node-input-deviceType").val();
            this.deviceTypeName = $("#node-input-deviceType option:selected").text();

            this.deviceService = $("#node-input-deviceService").val();
            this.deviceServiceName = $("#node-input-deviceService option:selected").text();
        }
    });</script>
