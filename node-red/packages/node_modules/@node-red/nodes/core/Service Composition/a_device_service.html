<script type="text/html" data-template-name="Device Service">
    <div class="form-row">
        <label for="node-input-deviceType"><i class="fa fa-window-restore"></i> 设备类型</label>
        <select id="node-input-deviceType">
            <option value="" disabled selected> 选择设备类型</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-deviceService"><i class="fa fa-cogs"></i> 设备功能</label>
        <select id="node-input-deviceService">
            <option value="" disabled selected> 选择设备功能</option>
        </select>
    </div>

    <div class="form-row">
        <label>设备服务参数</label>
        <table id="param-table" class="node-table">
            <thead>
                <tr>
                    <th>参数名称</th>
                    <th>参数类型</th>
                    <th>参数描述</th>
                </tr>
            </thead>
            <tbody id="param-body">
                <!-- 动态行将插入到这里 -->
            </tbody>
        </table>
    </div>
    <!-- 👇 隐藏域：用于保存数据到节点配置中 -->
    <input type="hidden" id="node-input-nodeParams">

    <input type="hidden" id="node-input-device-id"/>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Device Service', {
        category: 'Service Composition',
        color: "#efa1f8",
        defaults: {
            name: { value: "" },
            deviceType: { value: "" },
            deviceTypeName: { value: "" },        // 👈 新增
            deviceService: { value: "" },
            deviceServiceName: { value: "" },     // 👈 新增
            deviceId: { value: "" },
            nodeParams: { value: "[]" }
        },
        inputs: 1,
        outputs: 1,
        icon: "light.svg",
        label: function () {
            return this.deviceTypeName ? "Device Service : " + this.deviceTypeName : "Device Service";
        },
        oneditprepare: function () {
            var node = this;
            var projectId = 1;
            var deviceTypeSelect = $("#node-input-deviceType");
            var deviceServiceSelect = $("#node-input-deviceService");
            var deviceIdInput = $("#node-input-device-id");
            var $paramBody = $("#param-body");
            var $hiddenInput = $("#node-input-nodeParams");

            var deviceTypeData = [];

            function populateSelectOptions(selectElement, options, defaultText) {
                selectElement.empty().append('<option value="" disabled selected>' + defaultText + '</option>');
                options.forEach(function (option) {
                    selectElement.append($("<option></option>").attr("value", option.value).text(option.text));
                });
            }

            $.getJSON("http://127.0.0.1:8080/api/deviceTypes/alldevicetype?projectId=" + projectId, function (data) {
                if (!data || data.length === 0) {
                    console.error("No device types received from the API.");
                    return;
                }

                deviceTypeData = data;

                var types = data.map(dt => ({
                    value: dt.id, // 👈 使用数据库自增 id 作为 value
                    text: dt.device_type_name // 👈 使用下划线命名的字段
                }));

                populateSelectOptions(deviceTypeSelect, deviceTypes, "选择设备类型");

                if (node.deviceType) {
                    deviceTypeSelect.val(node.deviceType).trigger("change");
                }
            });

            deviceTypeSelect.off("change").on("change", function () {
                var selectedId = $(this).val();
                deviceIdInput.val(selectedId);

                deviceServiceSelect.empty();
                $paramBody.empty();
                $hiddenInput.val("[]");

                if (!selectedId) return;

                var selectedType = deviceTypeData.find(dt => dt.deviceTypeId === selectedId);

                $.getJSON(`http://127.0.0.1:8080/api/deviceTypes/${selectedTypeId}/functions`, function(funcData) {
                    if (!Array.isArray(funcData)) return;

                    var funcs = funcData.map(f => ({
                        value: f.id,
                        text: f.name // 对应 actuating_functions.name
                    }));
        
                    populateSelect(deviceServiceSelect, funcs, "选择设备功能");

                    // --- 功能回显 ---
                    if (node.deviceService) {
                        deviceServiceSelect.val(node.deviceService);
                    }
                    // 触发功能 change，加载参数
                    deviceServiceSelect.trigger("change");
                });
            });

            deviceServiceSelect.off("change").on("change", function () {
                var functionId = $(this).val();
        
                if (!functionId) {
                    $paramBody.empty();
                    $hiddenInput.val("[]");
                    return;
                }

                // 🎯 调用 API 获取该功能的参数列表
                $.get("http://127.0.0.1:8080/api/parameters?function_id=" + functionId, function (data) {
                    if (!Array.isArray(data)) {
                        console.warn("获取参数失败或数据格式错误");
                        $paramBody.empty();
                        $hiddenInput.val("[]");
                        return;
                    }

                // 清空现有行
                    $paramBody.empty();

                // 渲染每一行参数
                    data.forEach(function (param) {
                        var $tr = $("<tr>");

                        $tr.append(
                            $("<td>").text(param.type),
                            $("<td>").text(param.name).prop("readonly", true),
                            $("<td>").text(param.description)
                        );
                        $paramBody.append($tr);
                    });

            // ✅ 同步保存到隐藏域
                    updateParamsHiddenInput();
                });
            });

            // 4. 页面加载时，如果节点有配置，触发 change 事件以加载数据
            if (node.deviceType) {
                deviceTypeSelect.trigger("change");
            }

            // 💡 新增函数：同步当前表格内容到隐藏域
            function updateParamsHiddenInput() {
                var params = [];
                $paramBody.find("tr").each(function() {
                    var $tr = $(this);
                    params.push({
                        type: $tr.find(".node-input-param-type").val(),
                        name: $tr.find(".node-input-param-name").val(),
                        desc: $tr.find(".node-input-param-desc").val()
                    });
                });
                $hiddenInput.val(JSON.stringify(params));
            }

            $paramBody.on("input", "input, select", updateParamsHiddenInput);
        },
    
        oneditsave: function () {
            this.name = $("#node-input-name").val();

            this.deviceType = $("#node-input-deviceType").val();
            this.deviceTypeName = $("#node-input-deviceType option:selected").text();

            this.deviceService = $("#node-input-deviceService").val();
            this.deviceServiceName = $("#node-input-deviceService option:selected").text();

            try {
                this.nodeParams = $("#node-input-nodeParams").val() || "[]";
            } catch (e) {
                this.nodeParams = "[]";
            }
        }
    });</script>
