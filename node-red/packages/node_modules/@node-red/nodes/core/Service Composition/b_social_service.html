<script type="text/html" data-template-name="Social Service">
    <div class="form-row">
        <label for="node-input-socialResourceLabel"><span> 社会服务名称 </span></label>
        <select id="node-input-socialResourceLabel" class="form-control">
            <!-- 选项由 JS 动态加载 -->
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-details"><span> 社会服务描述 </span></label>
        <textarea id="node-input-details" class="form-control" rows="3" readonly></textarea>
    </div>
    
    <div class="form-row">
        <label><span> 参数列表 </span></label>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th> 参数名 </th>
                    <th> 参数类型 </th>
                    <th> 参数说明 </th>
                    <th> 对应组合节点参数名称 </th>
                </tr>
            </thead>
            <tbody id="param-body">
                <!-- 表格内容由 JS 动态生成 -->
            </tbody>
        </table>
        <!-- 隐藏域用于保存数据到 Node-RED 节点 -->
        <input type="hidden" id="node-input-nodeParams">
    </div>

    

    <style>
        /* 为参数列表表格添加边框和更大的列间距 */
        #param-body tr {
            border-bottom: 1px solid #ddd; /* 行底部分割线 */
        }
        
        #param-body th,
        #param-body td {
            padding: 12px 20px; /* 增加内边距，增大列间距 */
            border-right: 1px solid #eee; /* 列之间的竖线 */
            text-align: left;
        }
        
        /* 最后一列去掉右边框 */
        #param-body th:last-child,
        #param-body td:last-child {
            border-right: none;
        }
        
        /* 表头背景色可选 */
        #param-body th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        </style>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Social Service', {
        category: 'Service Composition',
        color: "#a5d4d4",
        defaults: {
            socialResourceLabel: { value: "" },     // 保存 description (显示文本)
            socialResourceDetails: { value: "" },   // 具体描述细节
            nodeParams: { value: "[]" },                // 参数列表
            func: { value: "" }                     // 保存 url
        },
        inputs: 1,
        outputs: 1,
        icon: "users.svg",
        label: function () {
            return this.socialResourceLabel ? "社会服务 : " + this.socialResourceLabel : "社会服务";
        },

        oneditprepare: function () {
            var node = this;

            // 1. 修正变量名和ID拼写错误
            // 注意：HTML里是 "node-input-socialResourceLabel"，JS里也要对应
            var $socialResourceLabel = $("#node-input-socialResourceLabel"); 
            var $socialResourceDetails = $("#node-input-details"); // 对应描述的 textarea
            var $paramBody = $("#param-body"); // 对应参数表格的 tbody
            var $hiddenInput = $("#node-input-nodeParams"); // 隐藏域保存参数 JSON

            let currentParamData = [];

            // 2. 加载下拉框数据
            $.getJSON("http://127.0.0.1:8080/api/socialResources/services", function (data) {
                if (!data || !Array.isArray(data)) {
                    console.error("Invalid data format", data);
                    return;
                }

                $socialResourceLabel.empty();
                $socialResourceLabel.append('<option value="">-- 请选择服务 --</option>');
                
                data.forEach(function (item) {
                    // 假设后端返回 { "value": "id", "label": "description" }
                    $socialResourceLabel.append(
                        $("<option></option>").val(item.label).text(item.label)
                    );
                });

                if (node.socialResourceLabel) {
                    $socialResourceLabel.val(node.socialResourceLabel);
                    // 手动触发 change 事件以加载详情
                    $socialResourceLabel.trigger("change");
                }

            }).fail(function (xhr, status, error) {
                console.error("Failed to load services:", status, error);
            });

            // 4. 绑定下拉框 change 事件 (核心逻辑)
            $socialResourceLabel.off("change").on("change", function () {
                var selectedValue = $(this).val(); // 比如 "pr001"
                var selectedLabel = $(this).find("option:selected").text(); // 比如 "社区养老"

                // 清空之前的数据显示
                $socialResourceDetails.val("");
                $paramBody.empty();
                currentParamData = [];

                // 如果没有选择，或者选择的是“请选择”，直接返回
                if (!selectedValue) {
                    return;
                }

                // 4.1 获取详情 (调用 /details 接口)
                $.get("http://127.0.0.1:8080/api/socialResources/details", {
                    description: selectedValue
                }, function (details) {
                    // 将返回的字符串直接填入描述框
                    $socialResourceDetails.val(details);
                    node.socialResourceDetails = details;
                }).fail(function () {
                    $socialResourceDetails.val("描述加载失败");
                });

                
                // 4.2 获取参数列表 (调用 /params 接口)
                $.get("http://127.0.0.1:8080/api/socialResources/params", {
                    description: selectedValue
                }, function (paramJsonString) {
                    try {
                        // 将后端返回的 JSON 字符串解析为对象
                        var paramArray = JSON.parse(paramJsonString);

                        // 清空表格并重新填充
                        $paramBody.empty();

                        if (Array.isArray(paramArray) && paramArray.length > 0) {

                            currentParamData = paramArray.map(param => {
                                // 如果节点已有保存的映射名称，则恢复它
                                let savedMapping = "";
                                if (node.nodeParams && typeof node.nodeParams === "string") {
                                    try {
                                        const savedParams = JSON.parse(node.nodeParams);
                                        const savedParam = savedParams.find(sp => sp.key === param.key && sp.type === param.type && sp.desc === param.desc);
                                        if (savedParam && savedParam.mappingName) {
                                            savedMapping = savedParam.mappingName;
                                        }
                                    } catch(e) {
                                        console.warn("Could not parse saved nodeParams for mapping restore:", e);
                                    }
                                }
                                return { ...param, mappingName: savedMapping };
                            });


                            currentParamData.forEach(function (param,index) {
                                var row = $("<tr>");
                                
                                row.append($("<td>").text(param.key || ""));
                                row.append($("<td>").text(param.type || ""));
                                row.append($("<td>").text(param.desc || ""));
                                // 创建映射名称输入框单元格
                                var mappingCell = $("<td>");
                                var mappingInput = $("<input type='text' placeholder='请输入映射名称'>")
                                    .val(param.mappingName || "") // 设置初始值
                                    .attr("data-param-index", index); // 添加索引标记，便于识别是哪一行的输入框
                                
                                mappingCell.append(mappingInput);
                                row.append(mappingCell);

                                $paramBody.append(row);
                            });
                        } else {
                            currentParamData = [];
                            $paramBody.append($("<tr><td colspan='4'>无参数</td></tr>"));
                        }

                        // 同时保存到隐藏域，以便节点保存时携带数据
                        $hiddenInput.val(paramJsonString);

                    } catch (e) {
                        console.error("解析参数JSON失败:", e);
                        $paramBody.append($("<tr><td colspan='4'>参数格式错误</td></tr>"));
                    }
                }).fail(function () {
                    $paramBody.append($("<tr><td colspan='4'>参数加载失败</td></tr>"));
                });

                

                

            });

            $paramBody.off("input", "input[type='text']").on("input", "input[type='text']", function() {
                    const $input = $(this);
                    const index = parseInt($input.attr("data-param-index"));

                    if (!isNaN(index) && currentParamData[index]) {
                        // 更新当前数据
                        currentParamData[index].mappingName = $input.val();
                        // 更新隐藏域
                        updateHiddenInput();
                    }
            });

            function updateHiddenInput() {
                    const jsonString = JSON.stringify(currentParamData);
                    $hiddenInput.val(jsonString);
                    // 同时更新节点对象的 nodeParams 属性
                    node.nodeParams = jsonString;
            }

        }, 

    });
</script>
