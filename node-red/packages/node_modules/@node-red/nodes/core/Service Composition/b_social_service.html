<script type="text/html" data-template-name="Social Service">
    <div class="form-row">
        <label for="node-input-socialResourceLabel"><span> 社会服务名称 </span></label>
        <select id="node-input-socialResourceLabel" class="form-control">
            <!-- 选项由 JS 动态加载 -->
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-details"><span> 社会服务描述 </span></label>
        <textarea id="node-input-details" class="form-control" rows="3" readonly></textarea>
    </div>
    
    <div class="form-row">
        <label><span> 参数列表 </span></label>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>参数名</th>
                    <th>参数类型</th>
                    <th>参数说明</th>
                </tr>
            </thead>
            <tbody id="param-body">
                <!-- 表格内容由 JS 动态生成 -->
            </tbody>
        </table>
        <!-- 隐藏域用于保存数据到 Node-RED 节点 -->
        <input type="hidden" id="node-input-params">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Social Service', {
        category: 'Service Composition',
        color: "#a5d4d4",
        defaults: {
            resourceType: { value: "" },
            socialResource: { value: "" },          // 保存 id
            socialResourceLabel: { value: "" },     // 保存 description (显示文本)
            socialResourceDetails: { value: "" },   // 具体描述细节
            params: { value: "[]" },                // 参数列表
            func: { value: "" }                     // 保存 url
        },
        inputs: 1,
        outputs: 1,
        icon: "users.svg",
        label: function () {
            return this.socialResourceLabel ? "Social Service : " + this.socialResourceLabel : "Social Service";
        },

        oneditprepare: function () {
            var node = this;

            // 1. 修正变量名和ID拼写错误
            // 注意：HTML里是 "node-input-socialResourceLabel"，JS里也要对应
            var $socialResourceLabel = $("#node-input-socialResourceLabel"); 
            var $socialResourceDetails = $("#node-input-details"); // 对应描述的 textarea
            var $paramBody = $("#param-body"); // 对应参数表格的 tbody
            var $hiddenInput = $("#node-input-params"); // 隐藏域保存参数 JSON

            // 2. 加载下拉框数据
            $.getJSON("http://127.0.0.1:8080/api/socialResources/services", function (data) {
                if (!data || !Array.isArray(data)) {
                    console.error("Invalid data format", data);
                    return;
                }

                $socialResourceLabel.empty();
                $socialResourceLabel.append('<option value="">-- 请选择服务 --</option>');
                
                data.forEach(function (item) {
                    // 假设后端返回 { "value": "id", "label": "description" }
                    $socialResourceLabel.append(
                        $("<option></option>").val(item.value).text(item.label)
                    );
                });

                // 3. 如果是编辑已有节点，尝试恢复选中状态
                if (node.socialResourceLabel) {
                    $socialResourceLabel.val(node.socialResourceLabel);
                    // 手动触发 change 事件以加载详情
                    $socialResourceLabel.trigger("change");
                }

            }).fail(function (xhr, status, error) {
                console.error("Failed to load services:", status, error);
            });

            // 4. 绑定下拉框 change 事件 (核心逻辑)
            $socialResourceLabel.off("change").on("change", function () {
                var selectedDescription = $(this).val();

                // 清空之前的数据显示
                $socialResourceDetails.val("");
                $paramBody.empty();

                // 如果没有选择，或者选择的是“请选择”，直接返回
                if (!selectedDescription) {
                    return;
                }

                // 4.1 获取详情 (调用 /details 接口)
                $.get("http://127.0.0.1:8080/api/socialResources/details", {
                    description: selectedDescription
                }, function (details) {
                    // 将返回的字符串直接填入描述框
                    $socialResourceDetails.val(details);
                }).fail(function () {
                    $socialResourceDetails.val("描述加载失败");
                });

                // 4.2 获取参数列表 (调用 /params 接口)
                $.get("http://127.0.0.1:8080/api/socialResources/params", {
                    description: selectedDescription
                }, function (paramJsonString) {
                    try {
                        // 将后端返回的 JSON 字符串解析为对象
                        var paramArray = JSON.parse(paramJsonString);

                        // 清空表格并重新填充
                        $paramBody.empty();

                        if (Array.isArray(paramArray) && paramArray.length > 0) {
                            paramArray.forEach(function (param) {
                                var row = $("<tr>");
                                
                                row.append($("<td>").text(param.key || ""));
                                row.append($("<td>").text(param.type || ""));
                                row.append($("<td>").text(param.desc || ""));
                                $paramBody.append(row);
                            });
                        } else {
                            $paramBody.append($("<tr><td colspan='3'>无参数</td></tr>"));
                        }

                        // 同时保存到隐藏域，以便节点保存时携带数据
                        $hiddenInput.val(paramJsonString);

                    } catch (e) {
                        console.error("解析参数JSON失败:", e);
                        $paramBody.append($("<tr><td colspan='3'>参数格式错误</td></tr>"));
                    }
                }).fail(function () {
                    $paramBody.append($("<tr><td colspan='3'>参数加载失败</td></tr>"));
                });
            });

        }
    });
</script>
