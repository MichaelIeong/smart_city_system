<script type="text/html" data-template-name="Social Service">
    <div class="form-row">
        <label for="node-input-resourceType"><i class="fa fa-tags"></i> Resource Type</label>
        <select id="node-input-resourceType">
            <option value="" disabled selected>Select Resource Type</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-socialResource"><i class="fa fa-users"></i> Social Resource</label>
        <select id="node-input-socialResource">
            <option value="" disabled selected>Select Social Resource</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-function"><i class="fa fa-cogs"></i> Function</label>
        <select id="node-input-function">
            <option value="" disabled selected>Select Function</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Social Service', {
        category: 'Service Composition',
        color: "#a5d4d4",
        defaults: {
            resourceType: { value: "" },
            socialResource: { value: "" },          // 保存 id
            socialResourceLabel: { value: "" },     // 保存 description
            func: { value: "" }                     // 保存 url
        },
        inputs: 1,
        outputs: 1,
        icon: "users.svg",
        label: function () {
            if (this.socialResourceLabel) {
                return "Social Service : " + this.socialResourceLabel;
            } else {
                return "Social Service";
            }
        },
        oneditprepare: function () {
            var node = this;
            var $resourceType = $("#node-input-resourceType");
            var $resource = $("#node-input-socialResource");
            var $function = $("#node-input-function");

            var resourceMap = {};

            // 获取 socialResources 数据
            $.getJSON("http://127.0.0.1:8080/api/socialResources/project/1", function (data) {
                var grouped = {};

                // 按 resourceType 分组
                data.forEach(function (res) {
                    if (!grouped[res.resourceType]) {
                        grouped[res.resourceType] = [];
                    }
                    grouped[res.resourceType].push(res);
                });

                // 填充 ResourceType 下拉框
                Object.keys(grouped).forEach(function (type) {
                    $resourceType.append($("<option></option>").attr("value", type).text(type));
                });

                if (node.resourceType) {
                    $resourceType.val(node.resourceType).trigger("change");
                }
            });

            // ResourceType 改变时，刷新 Social Resource
            $resourceType.on("change", function () {
                var selectedType = $(this).val();
                $resource.empty().append('<option value="" disabled selected>Select Social Resource</option>');
                $function.empty().append('<option value="" disabled selected>Select Function</option>');

                $.getJSON("http://127.0.0.1:8080/api/socialResources/project/1", function (data) {
                    var resources = data.filter(r => r.resourceType === selectedType);
                    resources.forEach(function (res) {
                        $resource.append($("<option></option>").attr("value", res.id).text(res.description));
                        resourceMap[res.id] = res;
                    });

                    if (node.socialResource) {
                        $resource.val(node.socialResource).trigger("change");
                    }
                });
            });

            // Social Resource 改变时，刷新 Function
            $resource.on("change", function () {
                var resId = $(this).val();
                $function.empty().append('<option value="" disabled selected>Select Function</option>');
                var resData = resourceMap[resId];
                if (resData) {
                    $function.append($("<option></option>").attr("value", resData.url).text(resData.url));
                    if (node.func) {
                        $function.val(node.func);
                    }
                }
            });
        },
        oneditsave: function () {
            var selectedOption = $("#node-input-socialResource option:selected");
            this.resourceType = $("#node-input-resourceType").val();
            this.socialResource = selectedOption.val();       // 保存 id
            this.socialResourceLabel = selectedOption.text(); // 保存 description
            this.func = $("#node-input-function").val();      // 保存 url
        }
    });
</script>
