<script type="text/html" data-template-name="Information Service">
    <div class="form-row">
        <label for="node-input-infoResourceLabel"><i class="fa fa-tag"></i> 信息服务名称</label>
        <select id="node-input-infoResourceLabel" style="width: 70%;">
            </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-details"><i class="fa fa-info-circle"></i> 信息服务描述</label>
        <textarea id="node-input-details" style="width: 70%;" rows="3" readonly></textarea>
    </div>
    
    <div class="form-row" style="margin-top: 20px; margin-bottom: 10px;">
        <label><i class="fa fa-list"></i> 参数映射配置</label>
    </div>

    <div class="form-row">
        <table class="param-table">
            <thead>
                <tr>
                    <th width="20%">参数名</th>
                    <th width="15%">类型</th>
                    <th width="35%">说明</th>
                    <th width="30%">组合节点映射名称</th>
                </tr>
            </thead>
            <tbody id="param-body">
                <tr>
                    <td colspan="4" style="text-align: center; color: #999; padding: 20px;">
                        请先选择一个服务以配置参数
                    </td>
                </tr>
            </tbody>
        </table>
        <input type="hidden" id="node-input-nodeParams">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Information Service', {
        category: '服务组合',
        color: "#a5d4d4",
        defaults: {
            infoResourceLabel: { value: "" },
            infoResourceDetails: { value: "" },
            nodeParams: { value: "[]" }, // 关键：确保默认是 JSON 字符串
            func: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "users.svg",
        label: function () {
            return this.infoResourceLabel ? "信息服务 : " + this.infoResourceLabel : "信息服务";
        },
        paletteLabel: "信息服务",
        oneditprepare: function () {
            var node = this;
            var $infoResourceLabel = $("#node-input-infoResourceLabel"); 
            var $infoResourceDetails = $("#node-input-details");
            var $paramBody = $("#param-body");

            // --- 核心修复：渲染表格并回填数据 ---
            function renderParamTable(apiParams) {
                $paramBody.empty();
                
                // 解析节点当前保存的参数值
                var savedParams = [];
                try {
                    savedParams = JSON.parse(node.nodeParams || "[]");
                } catch(e) { savedParams = []; }

                if (!apiParams || apiParams.length === 0) {
                    $paramBody.append('<tr><td colspan="4" style="text-align: center; color: #999; padding: 20px;">该服务无需配置参数</td></tr>');
                    return;
                }

                apiParams.forEach(function (param) {
                    // 在已保存的数组中查找当前 key 是否有对应的映射值
                    var match = savedParams.find(p => p.key === param.key);
                    var currentVal = match ? match.mapping : "";

                    var row = $(`<tr class="param-row">
                        <td><strong>${param.key || ''}</strong></td>
                        <td><span class="param-type-tag">${param.type || 'string'}</span></td>
                        <td><div style="font-size:12px; color:#666;">${param.desc || '-'}</div></td>
                        <td>
                            <input type="text" class="param-mapping-input" 
                                   style="width:100%"
                                   placeholder="输入映射键名" 
                                   value="${RED.utils.sanitize(currentVal)}">
                        </td>
                    </tr>`);
                    
                    // 将原始定义数据绑定到行对象上，保存时使用
                    row.data("raw", param);
                    $paramBody.append(row);
                });
            }

            // 1. 初始化下拉框
            $.getJSON("http://10.176.65.202:8080/api/cyberResources/services", function (data) {
                if (!Array.isArray(data)) return;
                $infoResourceLabel.empty().append('<option value="">-- 请选择服务 --</option>');
                data.forEach(function (item) {
                    $infoResourceLabel.append($("<option></option>").val(item.label).text(item.label));
                });

                // 如果是编辑状态，恢复下拉框选值并触发加载参数
                if (node.infoResourceLabel) {
                    $infoResourceLabel.val(node.infoResourceLabel);
                    // 只有在编辑已有节点时，手动触发一次以加载表格
                    loadServiceDetails(node.infoResourceLabel);
                }
            });

            // 2. 封装加载逻辑
            function loadServiceDetails(selectedLabel) {
                if (!selectedLabel) return;
                
                // 加载描述
                $.get("http://10.176.65.202:8080/api/cyberResources/details", { description: selectedLabel }, function (details) {
                    $infoResourceDetails.val(details);
                });

                // 加载参数列表
                $.get("http://10.176.65.202:8080/api/cyberResources/params", { description: selectedLabel }, function (resp) {
                    try {
                        var apiParams = (typeof resp === 'string') ? JSON.parse(resp) : resp;
                        renderParamTable(apiParams);
                    } catch (e) {
                        console.error("Params parse error", e);
                    }
                });
            }

            // 3. 绑定下拉框切换
            $infoResourceLabel.on("change", function () {
                loadServiceDetails($(this).val());
            });
        },

        oneditsave: function () {
            var node = this;
            var paramsArray = [];
            
            // --- 核心修复：确保遍历每一行并正确保存 ---
            $("#param-body .param-row").each(function () {
                var $row = $(this);
                var raw = $row.data("raw"); // 获取渲染时绑定的原始数据
                var mappingVal = $row.find(".param-mapping-input").val();
                
                paramsArray.push({
                    key: raw.key,
                    type: raw.type,
                    desc: raw.desc,
                    mapping: mappingVal
                });
            });

            // 将结果转为字符串存入隐藏域，Node-RED 会自动持久化此字段
            $("#node-input-nodeParams").val(JSON.stringify(paramsArray));
            
            // 调试用：控制台打印看看是否抓到了数据
            console.log("Saving params:", paramsArray);
        }
    });
</script>

<style>
    .param-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #ddd;
        font-size: 13px;
        background: #fff;
    }
    .param-table th {
        background-color: #f8f9fa;
        padding: 10px;
        border: 1px solid #eee;
        text-align: left;
    }
    .param-table td {
        padding: 8px 10px;
        border: 1px solid #eee;
        vertical-align: middle;
    }
    .param-type-tag {
        background: #f0f0f0;
        color: #777;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 11px;
    }
    .param-mapping-input {
        width: 100% !important;
        box-sizing: border-box;
        border: 1px solid #ccc !important;
        border-radius: 3px;
        padding: 4px 8px !important;
        height: 28px !important;
    }
    .param-mapping-input:focus {
        border-color: #80b6fa !important;
        outline: none;
    }
</style>
