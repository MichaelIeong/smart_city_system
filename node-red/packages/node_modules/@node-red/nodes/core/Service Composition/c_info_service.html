<script type="text/html" data-template-name="Information Service">
    <div class="form-row">
        <label for="node-input-resourceType"><i class="fa fa-tags"></i> Resource Type</label>
        <select id="node-input-resourceType">
            <option value="" disabled selected>Select Resource Type</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-informationResource"><i class="fa fa-info-circle"></i> Information Resource</label>
        <select id="node-input-informationResource">
            <option value="" disabled selected>Select Information Resource</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-function"><i class="fa fa-cogs"></i> Function</label>
        <select id="node-input-function">
            <option value="" disabled selected>Select Function</option>
        </select>
    </div>

    <div class="form-row">
        <label>信息服务参数</label>
        <table id="param-table" class="node-table">
            <thead>
                <tr>
                    <th>参数类型</th>
                    <th>参数名称</th>
                    <th>参数值</th>
                    <th>参数描述</th>
                    <th style="width:50px;"></th>
                </tr>
            </thead>
            <tbody>
                <!-- 动态行将插入到这里 -->
            </tbody>
        </table>
        <button type="button" class="editor-button" id="add-param-btn"><i class="fa fa-plus"></i> 添加参数</button>
    </div>
    <!-- 👇 隐藏域：用于保存数据到节点配置中 -->
    <input type="hidden" id="node-input-nodeParams">
    
</script>

<script type="text/javascript">
    RED.nodes.registerType('Information Service', {
        category: 'Service Composition',
        color: "#d4a5a5",
        defaults: {
            resourceType: { value: "" },
            informationResource: { value: "" },        // 存 id
            informationResourceLabel: { value: "" },   // 存 description
            func: { value: "" },
            nodeParams: { value: "[]" }
        },
        inputs: 1,
        outputs: 1,
        icon: "envelope.svg",
        label: function () {
            if (this.informationResourceLabel) {
                return "Information Service : " + this.informationResourceLabel;
            } else {
                return "Information Service";
            }
        },
        oneditprepare: function () {
            var node = this;
            var $resourceType = $("#node-input-resourceType");
            var $resource = $("#node-input-informationResource");
            var $function = $("#node-input-function");

            var resourceMap = {};

            $.getJSON("http://127.0.0.1:8080/api/cyberResources/project/1", function (data) {
                var grouped = {};

                data.forEach(function (res) {
                    if (!grouped[res.resourceType]) {
                        grouped[res.resourceType] = [];
                    }
                    grouped[res.resourceType].push(res);
                });

                Object.keys(grouped).forEach(function (type) {
                    $resourceType.append($("<option></option>").attr("value", type).text(type));
                });

                if (node.resourceType) {
                    $resourceType.val(node.resourceType).trigger("change");
                }
            });

            $resourceType.on("change", function () {
                var selectedType = $(this).val();
                $resource.empty().append('<option value="" disabled selected>Select Information Resource</option>');
                $function.empty().append('<option value="" disabled selected>Select Function</option>');

                $.getJSON("http://127.0.0.1:8080/api/cyberResources/project/1", function (data) {
                    var resources = data.filter(r => r.resourceType === selectedType);
                    resources.forEach(function (res) {
                        $resource.append($("<option></option>").attr("value", res.id).text(res.description));
                        resourceMap[res.id] = res;
                    });

                    if (node.informationResource) {
                        $resource.val(node.informationResource).trigger("change");
                    }
                });
            });

            $resource.on("change", function () {
                var resId = $(this).val();
                $function.empty().append('<option value="" disabled selected>Select Function</option>');
                var resData = resourceMap[resId];
                if (resData) {
                    $function.append($("<option></option>").attr("value", resData.url).text(resData.url));
                    if (node.func) {
                        $function.val(node.func);
                    }
                }
            });

            var $tableBody = $("#param-table tbody");
            var $addButton = $("#add-param-btn");
            var $hiddenInput = $("#node-input-nodeParams"); // 指向隐藏域

            // 解析已有的参数数据 (如果节点之前配置过)
            var currentParams = [];
            try {
                // 如果 node.nodeParams 存在且是字符串，则解析它
                if (node.nodeParams) {
                    currentParams = JSON.parse(node.nodeParams);
                }
            } catch (e) {
                console.warn("解析 nodeParams 失败", e);
            }

            // 渲染表格行的函数
            function renderRows(params) {
                $tableBody.empty(); // 清空现有行
                params.forEach(function(param) {
                    addRow(param.type, param.name, param.value, param.desc);
                });
            }

            // 添加单行的函数
            function addRow(type, name, value, desc) {
                var $row = $("<tr>");

                // 参数类型 (下拉框)
                var $typeCell = $("<td>").append(
                    $("<select>").addClass("node-input-property-type").css("width", "100%")
                        .append($("<option>").val("string").text("字符串"))
                        .append($("<option>").val("number").text("数字"))
                        .append($("<option>").val("boolean").text("布尔值"))
                        .append($("<option>").val("json").text("JSON"))
                        .val(type || "string")
                );
                $row.append($typeCell);

                // 参数名称 (输入框)
                var $nameCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-name")
                        .attr("type", "text")
                        .attr("placeholder", "例如: temperature")
                        .css("width", "100%")
                        .val(name || "")
                );
                $row.append($nameCell);

                // 参数值 (输入框)
                var $valueCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-value")
                        .attr("type", "text")
                        .attr("placeholder", "例如: 25")
                        .css("width", "100%")
                        .val(value || "")
                );
                $row.append($valueCell);

                // 参数描述 (输入框)
                var $descCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-desc")
                        .attr("type", "text")
                        .attr("placeholder", "描述")
                        .css("width", "100%")
                        .val(desc || "")
                );
                $row.append($descCell);

                // 删除按钮
                var $actionCell = $("<td>").append(
                    $("<button>")
                        .addClass("editor-button small")
                        .attr("type", "button")
                        .text("X")
                        .click(function() {
                            $row.remove();
                            updateHiddenInput(); // 更新隐藏域
                        })
                );
                $row.append($actionCell);

                $tableBody.append($row);
            }

            // 更新隐藏域数据的函数
            // 这个函数会把表格里的内容整理成 JSON 字符串，存入 hidden input
            // Node-RED 保存时会自动读取这个值
            function updateHiddenInput() {
                var params = [];
                $tableBody.find("tr").each(function() {
                    var $tr = $(this);
                    params.push({
                        type: $tr.find(".node-input-property-type").val(),
                        name: $tr.find(".node-input-property-name").val(),
                        value: $tr.find(".node-input-property-value").val(),
                        desc: $tr.find(".node-input-property-desc").val()
                    });
                });
                $hiddenInput.val(JSON.stringify(params));
            }

            // 绑定添加按钮
            $addButton.click(function() {
                addRow("string", "", "", "");
                updateHiddenInput(); // 添加后立即更新
            });

            // 监听表格内输入框的变化 (实时保存)
            $tableBody.on("input", "input, select", updateHiddenInput);

            // 初始化：如果之前有数据，渲染出来
            if (currentParams.length > 0) {
                renderRows(currentParams);
            } else {
                // 默认空一行
                addRow("string", "", "", "");
            }

            // 初始状态更新一次 (确保数据正确)
            updateHiddenInput();
        },
        oneditsave: function () {
            var selectedOption = $("#node-input-informationResource option:selected");
            this.resourceType = $("#node-input-resourceType").val();
            this.informationResource = selectedOption.val();       // 保存 id
            this.informationResourceLabel = selectedOption.text(); // 保存 description
            this.func = $("#node-input-function").val();
        }
    });
</script>
