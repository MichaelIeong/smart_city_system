<script type="text/html" data-template-name="Composition">
    <div class="form-row">
        <label for="node-input-composition-name"><i class="fa fa-tag"></i> 服务组合名</label>
        <input type="text" 
           id="node-input-composition-name" 
           placeholder="请用英文+下划线填写服务组合名称,例如:clean_up">
    </div>

    <div class="form-row">
        <label for="node-input-composition-name-CN"><i class="fa fa-tag"></i> 中文名称</label>
        <input type="text" 
           id="node-input-composition-name-CN" 
           placeholder="请用中文填写服务组合名称">
    </div>

    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-align-left"></i> 服务描述</label>
        <input type="text" 
            id="node-input-description" 
            placeholder="输入该服务的中文描述" />
    </div>

    <div class="form-row">
        <label>参数列表</label>
        <table id="param-table" class="node-table">
            <thead>
                <tr>
                    <th>参数名称</th>
                    <th>参数类型</th>
                    <th>参数描述</th>
                    <th style="width:50px;"></th> <!-- 删除按钮列 -->
                </tr>
            </thead>
            <tbody>
                <!-- 动态行将插入到这里 -->
            </tbody>
        </table>
        <button type="button" class="editor-button" id="add-param-btn"><i class="fa fa-plus"></i> 添加参数</button>
    </div>

    <input type="hidden" id="node-input-project-id"/>
    <input type="hidden" id="node-input-nodeParams">
</script>

<script type="text/javascript">
    RED.nodes.registerType('Composition', {
        category: '服务组合',
        color: "#a0d468",
        defaults: {
            compositionName: { value: "" },        // 保存选中的 id
            compositionNameLabel: { value: "" },   // 保存选中的 name
            compositionNameCN: { value: "" },
            description: { value: "" },            // 新增: 描述
            nodeParams: { value: "[]" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            return this.compositionNameLabel
                ? "服务组合 : " + this.compositionNameLabel
                : "服务组合";
        },
        paletteLabel: "组合",
        oneditprepare: function () {
            var node = this;
            var $compositionInput = $("#node-input-composition-name");
            var $compositionInputCN = $("#node-input-composition-name-CN");
            var $description = $("#node-input-description");
            var $tableBody = $("#param-table tbody");
            var $addButton = $("#add-param-btn");
            var $hiddenInput = $("#node-input-nodeParams");
            
            if (node.compositionName) {
                $compositionInput.val(node.compositionName);
            }
            $description.val(node.description || "");

            if (node.compositionNameCN) {
                $compositionInputCN.val(node.compositionNameCN);
            }
            
            var $tableBody = $("#param-table tbody");
            var $addButton = $("#add-param-btn");
            var $hiddenInput = $("#node-input-nodeParams"); // 指向隐藏域

            // 解析已有的参数数据 (如果节点之前配置过)
            var currentParams = [];
            try {
                // 如果 node.nodeParams 存在且是字符串，则解析它
                if (node.nodeParams) {
                    currentParams = JSON.parse(node.nodeParams);
                }
            } catch (e) {
                console.warn("解析 nodeParams 失败", e);
            }

            // 渲染表格行的函数
            function renderRows(params) {
                $tableBody.empty(); // 清空现有行
                params.forEach(function(param) {
                    addRow(param.type, param.name, param.value, param.desc);
                });
            }

            // 添加单行的函数
            function addRow(type, name, value, desc) {
                var $row = $("<tr>");

                // 参数名称 (输入框)
                var $nameCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-name")
                        .attr("type", "text")
                        .attr("placeholder", "例如: temperature")
                        .css("width", "100%")
                        .val(name || "")
                );
                $row.append($nameCell);

                // 参数类型 (下拉框)
                var $typeCell = $("<td>").append(
                    $("<select>").addClass("node-input-property-type").css("width", "100%")
                        .append($("<option>").val("string").text("string"))
                        .append($("<option>").val("number").text("number"))
                        .append($("<option>").val("bool").text("bool"))
                        .val(type || "string")
                );
                $row.append($typeCell);

                // 参数描述 (输入框)
                var $descCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-desc")
                        .attr("type", "text")
                        .attr("placeholder", "请输入描述")
                        .css("width", "100%")
                        .val(desc || "")
                );
                $row.append($descCell);

                // 删除按钮
                var $actionCell = $("<td>").append(
                    $("<button>")
                        .addClass("editor-button small")
                        .attr("type", "button")
                        .text("X")
                        .click(function() {
                            $row.remove();
                            updateHiddenInput(); // 更新隐藏域
                        })
                );
                $row.append($actionCell);

                $tableBody.append($row);
            }

            // 更新隐藏域数据的函数
            // 这个函数会把表格里的内容整理成 JSON 字符串，存入 hidden input
            // Node-RED 保存时会自动读取这个值
            function updateHiddenInput() {
                var params = [];
                $tableBody.find("tr").each(function() {
                    var $tr = $(this);
                    params.push({
                        type: $tr.find(".node-input-property-type").val(),
                        name: $tr.find(".node-input-property-name").val(),
                        value: $tr.find(".node-input-property-value").val(),
                        desc: $tr.find(".node-input-property-desc").val()
                    });
                });
                $hiddenInput.val(JSON.stringify(params));
            }

            // 绑定添加按钮
            $addButton.click(function() {
                addRow("string", "", "", "");
                updateHiddenInput(); // 添加后立即更新
            });

            // 监听表格内输入框的变化 (实时保存)
            $tableBody.on("input", "input, select", updateHiddenInput);

            // 初始化：如果之前有数据，渲染出来
            if (currentParams.length > 0) {
                renderRows(currentParams);
            } else {
                // 默认空一行
                addRow("string", "", "", "");
            }

            // 初始状态更新一次 (确保数据正确)
            updateHiddenInput();
        },

        oneditsave: function () {
            var $compositionInput = $("#node-input-composition-name");
            var $compositionInputCN = $("#node-input-composition-name-CN")
            var inputValue = $compositionInput.val();
            this.compositionName = inputValue;        // id (保存输入值)
            this.compositionNameLabel = inputValue;   // name (保存输入值)
            this.compositionNameCN = $compositionInputCN.val(); 
            this.description = $("#node-input-description").val(); // 描述
        }

    });

    // 监听 'deploy' 事件，当用户点击部署时触发
    RED.events.on('deploy', function() {
        
        try {
            // 获取当前工作区的所有节点数据
            
            var allNodes = RED.nodes.createCompleteNodeSet(); 
            
            console.log("开始处理composition");
            
            var totalJson = convertToStandardFormat_TotalJson(allNodes);
            console.log("获取到整个流程的json:",totalJson);
            // 找到 Composition 节点
            var serviceNodes = getNodesByType("Device Service");
            var deviceTypeArray = serviceNodes.map(function(node) {
                return node.deviceType; // 直接取属性值
            });
            var compositionNodes = getNodesByType("Composition");
            console.log("获取 到compositionNode:",compositionNodes);

            const compositionNode = compositionNodes[0];
            console.log("获取到对应节点:",compositionNode);

            var array = getTypesArray(deviceTypeArray);
            console.log("获取到所有包含的设备类型：",array);

            if (!compositionNode) {
                console.log('[Composition Editor] 🟡 警告：未找到 Composition 节点，跳过处理');
                return; 
            }

            if (compositionNode) {
                console.log('[Composition Editor] 捕获到部署事件，准备处理数据...');

                try {
                    var standardData = convertToStandardFormat(compositionNode);

                    console.log('[Composition Editor] 转换后的标准格式:', standardData);

                    var urlParams = new URLSearchParams(window.location.search);
                    var gridId = urlParams.get('gridId');
                    var projectId = urlParams.get('projectId');
                    var ip = window.location.hostname;
                    
                    if(ip != "127.0.0.1") {
                        ip = "10.176.65.202";
                    }
                    // 通过 AJAX 发送给后端
                    var ServiceJson = {
                        compositionJson: standardData,      // 字段名必须是 compositionJson
                        totalJson: totalJson,            // 字段名必须是 totalJson
                        deviceTypeArray: array // 字段名必须是 deviceTypeArray
                    };
                    
                    $.ajax({
                        url: 'http://' + ip +':8080/api/services/uploadCompositionService?gridId='+ gridId + "&projectId=" + projectId, // 自定义的后端路由
                        type: 'POST',
                        data: JSON.stringify(ServiceJson),
                        contentType: 'application/json',
                        success: function() {
                            console.log('[Composition Editor] 数据发送成功');
                        },
                        error: function(err) {
                            console.error('[Composition Editor] 数据发送失败:', err);
                        }
                    });

                } catch (e) {
                    console.error('处理节点参数失败:', e);
                }
            }
        } catch (e){
            console.error('[Composition Editor] 部署事件处理总线错误:', e);
        }
        
    });

    // 定义发送数据的函数
    function sendFlowData() {
        // 1. 【核心】在前端直接获取 JSON
        // getFlows() 返回包含 wires 的完整数据
        const rawFlow = RED.nodes.getFlows(); 
        // 或者使用 RED.nodes.export() 获取序列化数据

        // 2. 提取你需要的信息 (参考你之前的逻辑)
        const functionalNodes = rawFlow.filter(n => n.type !== "tab");
        if (functionalNodes.length === 0) {
            alert("未检测到有效节点");
            return;
        }

        const tabNode = rawFlow.find(n => n.type === "tab") || {};
        
        // 3. 准备数据
        const dataToSend = {
            gridId: "你的GridId", // 从页面表单或变量中获取
            ip: "目标IP",
            flowJson: JSON.stringify(rawFlow) // 在前端就序列化好
        };

        // 4. 发送给后端 (调用你刚才写的 /env-event/sync 接口)
        fetch('/uploadCompositionService', { // 注意：这里不需要写域名，直接用相对路径
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dataToSend)
        })
        .then(response => response.json())
        .then(result => {
            console.log("同步成功:", result);
            alert("同步成功！");
        })
        .catch(err => {
            console.error("同步失败:", err);
            alert("同步失败");
        });
    }

    function getTypesArray(deviceTypeArray){
        var array = [];
        deviceTypeArray.forEach(type =>{
            array.push(type);
        })
        return array;
    }

    function convertToStandardFormat(compositionNode) {//处理组合节点的参数列表并转换为要求的json格式

        let rawParams = compositionNode.nodeParams;

        if (typeof rawParams === 'string') {
            try {
                // 去除首尾空白并解析
                rawParams = JSON.parse(rawParams.trim());
            } catch (e) {
                console.warn('解析 nodeParams JSON 失败，可能是空字符串或格式错误:', e);
                // 如果解析失败，尝试将其视为空数组
                rawParams = [];
            }
        }
        
        const actionParams = {};
        rawParams.forEach(param => {
            const paramName = param.name; // 例如: "location", "event_type"
            actionParams[paramName] = {
                type: param.type,
                description: param.desc
            };
        });

        // 组装最终的标准格式
        const result = {
            action_name: compositionNode.compositionName,
            description: compositionNode.description,
            action_params: actionParams
        };

        return result;
    }


    function getNodesByType(type) {
        const targetTypes = Array.isArray(type) ? type : [type];
        const foundNodes = [];

        RED.nodes.eachNode(function(node) {
            if (targetTypes.includes(node.type)) {
                foundNodes.push(node);
            }
        });

        return foundNodes;
    }

    function convertToStandardFormat_TotalJson(sourceNodes) {
        // 1. 找到 Composition 根节点
        const rootNode = sourceNodes.find(node => node.type === "Composition");
        if (!rootNode) {
            throw new Error("未找到 Composition 根节点");
        }

        // 解析根节点的参数
        let inputs = [];
        try {
            inputs = JSON.parse(rootNode.nodeParams || "[]").map(param => ({
                name: param.name,
                type: param.type,
                desc: param.desc
            }));
        } catch (e) {
            console.error("解析根节点参数失败:", e);
        }

        // 2. 构建节点映射表 (ID -> 节点对象)
        const nodeMap = new Map(sourceNodes.map(node => [node.id, node]));

        // 3. 广度优先搜索 (BFS) 遍历所有连接的节点
        const steps = []; // 存储所有转换后的步骤
        const visited = new Set(); // 记录已处理的节点，防止重复或死循环
        const queue = []; // 处理队列

        // 将根节点的所有输出作为起始点
        const startNodeIds = (rootNode.wires[0] || []).map(id => id);
        
        // 初始化队列
        startNodeIds.forEach(id => {
            if (!visited.has(id)) {
                queue.push(id);
                visited.add(id);
            }
        });

        // BFS 遍历
        while (queue.length > 0) {
            const currentNodeId = queue.shift();
            const node = nodeMap.get(currentNodeId);

            if (!node) continue;

            // 转换当前节点
            const step = transformNode(node, nodeMap);
            steps.push(step);

            // 将当前节点的所有后继加入队列 (用于下一轮处理)
            const nextIds = (node.wires[0] || []).map(id => id);
            nextIds.forEach(nextId => {
                if (!visited.has(nextId)) {
                    queue.push(nextId);
                    visited.add(nextId);
                }
            });
        }

        // 4. 组装最终结果
        // 注意：start 依然是根节点直接连接的那些
        return {
            id: rootNode.compositionName,
            desc: rootNode.description,
            inputs: inputs,
            start: startNodeIds,
            steps: steps
        };
    }

    // 辅助函数：单独转换一个节点
    function transformNode(node, nodeMap) {
        // 根据类型映射 type 字段
        let type = "";
        if (node.type === "Information Service") type = "cyber";
        else if (node.type === "Social Service") type = "social";
        else if (node.type === "Device Service") type = "physical";

        // 根据类型映射 name 字段
        let name = "";
        if (node.type === "Information Service") name = node.infoResourceLabel;
        else if (node.type === "Social Service") name = node.socialResourceLabel;
        else if (node.type === "Device Service") name = node.deviceTypeName;

        // 解析 nodeParams 构建 args 对象
        let args = {};
        try {
            const params = JSON.parse(node.nodeParams || "[]");
            params.forEach(param => {
                // 规则：A:B 格式，A是name，B是mappingKey
                if (param.name && param.mappingKey) {
                    args[param.name] = param.mappingKey;
                }
            });
        } catch (e) {
            console.error(`节点  $ {node.id} 解析参数失败:`, e);
        }

        // 获取连线作为 next (这里直接取该节点的 wires)
        const next = (node.wires[0] || []).map(id => id);

        return {
            id: node.id,
            type: type,
            name: name,
            action: node.deviceService || "", // 只有设备服务有 action
            args: args,
            next: next // 这里会自动包含 B->C, C->D 等关系
        };
    }

</script>

<script>
    // 等待 Node-RED 编辑器完全加载
    // (function( $ ) { ... })(jQuery); 是为了确保 jQuery 可用
    (function( $ ) {
        // 监听 "部署完成" 事件
        // 注意：使用 'beforeDeploy' 可以在部署数据发送前截获最新的 JSON
        RED.events.on('editor:beforeDeploy', function(event) {
            
            // 1. 获取画布上所有的节点和连线数据
            // 这里的 flows 数据结构包含了所有的 wires 信息
            const flows = RED.nodes.getFlows(); 
            
            // 2. 转换为 JSON 字符串
            // 这就是你想要的包含 wires 的完整 JSON
            const fullJsonString = JSON.stringify(flows, null, 2);
            
            console.log("【部署拦截】获取到的完整流数据:", fullJsonString);
            
            // 3. 后续处理：将数据发送给你的后端或进行其他操作
            // 例如：通过 fetch 发送到你的 API
            sendToBackend(fullJsonString);
        });
        
        function sendToBackend(jsonData) {
            fetch('/uploadCompositionService', { // 调用你之前写的后端接口
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: jsonData
            })
            .then(response => response.json())
            .then(data => {
                console.log('同步成功:', data);
                // 可以在这里给用户提示
            })
            .catch((error) => {
                console.error('同步失败:', error);
                // 阻止部署或报错提示
            });
        }
        
    })(jQuery);
</script>
