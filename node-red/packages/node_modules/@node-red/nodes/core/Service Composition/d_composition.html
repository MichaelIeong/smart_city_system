<script type="text/html" data-template-name="Composition">
    <div class="form-row">
        <label for="node-input-composition-name"><i class="fa fa-tag"></i> Composition Name</label>
        <input type="text" id="node-input-composition-name" placeholder="Enter Composition Name" />
    </div>

    <div class="form-row">
        <label for="node-input-space"><i class="fa fa-cube"></i> Space</label>
        <select id="node-input-space">
            <option value="">请选择空间</option>
        </select>
    </div>

    <input type="hidden" id="node-input-project-id"/>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Composition', {
        category: 'Service Composition',
        color: "#a0d468",
        defaults: {
            compositionName: { value: "" },
            space: { value: "" },
            spaceName: { value: "" },
            projectId: { value: "1" }
        },
        inputs: 1,
        outputs: 0,
        icon: "cog.svg",
        label: function () {
            return this.compositionName ? "Composition : " + this.compositionName : "Composition";
        },
        oneditprepare: function () {
            var node = this;
            var $spaceSelect = $("#node-input-space");

            $spaceSelect.empty().append('<option value="">请选择空间</option>');

            $.get("http://127.0.0.1:8080/api/spaces/allspace", function (data) {
                if (Array.isArray(data)) {
                    data.forEach(function (space) {
                        $spaceSelect.append(
                            $("<option>", { value: space.id, text: space.spaceName })
                        );
                    });
                    if (node.space) {
                        $spaceSelect.val(node.space);
                    }
                }
            });
        },
        oneditsave: function () {
            this.compositionName = $("#node-input-composition-name").val();
            this.space = $("#node-input-space").val();
            this.spaceName = $("#node-input-space option:selected").text();
            this.projectId = $("#node-input-project-id").val();
        }
    });
</script>
