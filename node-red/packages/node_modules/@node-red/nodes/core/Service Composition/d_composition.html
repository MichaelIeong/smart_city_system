<script type="text/html" data-template-name="Composition">
    <div class="form-row">
        <label for="node-input-composition-name"><i class="fa fa-tag"></i> 服务组合名</label>
        <input type="text" 
           id="node-input-composition-name" 
           placeholder="请填写服务组合名称">
    </div>

    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-align-left"></i> 服务描述</label>
        <input type="text" id="node-input-description" placeholder="Enter description" />
    </div>

    <div class="form-row">
        <label>参数列表</label>
        <table id="param-table" class="node-table">
            <thead>
                <tr>
                    <th>参数名称</th>
                    <th>参数类型</th>
                    <th>参数描述</th>
                    <th style="width:50px;"></th> <!-- 删除按钮列 -->
                </tr>
            </thead>
            <tbody>
                <!-- 动态行将插入到这里 -->
            </tbody>
        </table>
        <button type="button" class="editor-button" id="add-param-btn"><i class="fa fa-plus"></i> 添加参数</button>
    </div>

    <input type="hidden" id="node-input-project-id"/>
    <input type="hidden" id="node-input-nodeParams">
</script>

<script type="text/javascript">
    RED.nodes.registerType('Composition', {
        category: '服务组合',
        color: "#a0d468",
        defaults: {
            compositionName: { value: "" },        // 保存选中的 id
            compositionNameLabel: { value: "" },   // 保存选中的 name
            description: { value: "" },            // 新增: 描述
            nodeParams: { value: "[]" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function () {
            return this.compositionNameLabel
                ? "服务组合 : " + this.compositionNameLabel
                : "服务组合";
        },
        paletteLabel: "组合",
        oneditprepare: function () {
            var node = this;
            var $compositionInput = $("#node-input-composition-name");
            var $description = $("#node-input-description");
            var $tableBody = $("#param-table tbody");
            var $addButton = $("#add-param-btn");
            var $hiddenInput = $("#node-input-nodeParams");
            
            if (node.compositionName) {
                $compositionInput.val(node.compositionName);
            }
            $description.val(node.description || "");
            
            var $tableBody = $("#param-table tbody");
            var $addButton = $("#add-param-btn");
            var $hiddenInput = $("#node-input-nodeParams"); // 指向隐藏域

            // 解析已有的参数数据 (如果节点之前配置过)
            var currentParams = [];
            try {
                // 如果 node.nodeParams 存在且是字符串，则解析它
                if (node.nodeParams) {
                    currentParams = JSON.parse(node.nodeParams);
                }
            } catch (e) {
                console.warn("解析 nodeParams 失败", e);
            }

            // 渲染表格行的函数
            function renderRows(params) {
                $tableBody.empty(); // 清空现有行
                params.forEach(function(param) {
                    addRow(param.type, param.name, param.value, param.desc);
                });
            }

            // 添加单行的函数
            function addRow(type, name, value, desc) {
                var $row = $("<tr>");

                // 参数名称 (输入框)
                var $nameCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-name")
                        .attr("type", "text")
                        .attr("placeholder", "例如: temperature")
                        .css("width", "100%")
                        .val(name || "")
                );
                $row.append($nameCell);

                // 参数类型 (下拉框)
                var $typeCell = $("<td>").append(
                    $("<select>").addClass("node-input-property-type").css("width", "100%")
                        .append($("<option>").val("string").text("String"))
                        .append($("<option>").val("number").text("Integer"))
                        .append($("<option>").val("boolean").text("Boolean"))
                        .val(type || "string")
                );
                $row.append($typeCell);

                // 参数描述 (输入框)
                var $descCell = $("<td>").append(
                    $("<input>").addClass("node-input-property-desc")
                        .attr("type", "text")
                        .attr("placeholder", "请输入描述")
                        .css("width", "100%")
                        .val(desc || "")
                );
                $row.append($descCell);

                // 删除按钮
                var $actionCell = $("<td>").append(
                    $("<button>")
                        .addClass("editor-button small")
                        .attr("type", "button")
                        .text("X")
                        .click(function() {
                            $row.remove();
                            updateHiddenInput(); // 更新隐藏域
                        })
                );
                $row.append($actionCell);

                $tableBody.append($row);
            }

            // 更新隐藏域数据的函数
            // 这个函数会把表格里的内容整理成 JSON 字符串，存入 hidden input
            // Node-RED 保存时会自动读取这个值
            function updateHiddenInput() {
                var params = [];
                $tableBody.find("tr").each(function() {
                    var $tr = $(this);
                    params.push({
                        type: $tr.find(".node-input-property-type").val(),
                        name: $tr.find(".node-input-property-name").val(),
                        value: $tr.find(".node-input-property-value").val(),
                        desc: $tr.find(".node-input-property-desc").val()
                    });
                });
                $hiddenInput.val(JSON.stringify(params));
            }

            // 绑定添加按钮
            $addButton.click(function() {
                addRow("string", "", "", "");
                updateHiddenInput(); // 添加后立即更新
            });

            // 监听表格内输入框的变化 (实时保存)
            $tableBody.on("input", "input, select", updateHiddenInput);

            // 初始化：如果之前有数据，渲染出来
            if (currentParams.length > 0) {
                renderRows(currentParams);
            } else {
                // 默认空一行
                addRow("string", "", "", "");
            }

            // 初始状态更新一次 (确保数据正确)
            updateHiddenInput();
        },

        oneditsave: function () {
            var $compositionInput = $("#node-input-composition-name");
            var inputValue = $compositionInput.val();
            this.compositionName = inputValue;        // id (保存输入值)
            this.compositionNameLabel = inputValue;   // name (保存输入值)
            this.description = $("#node-input-description").val(); // 描述
        }

    });

    // 监听 'deploy' 事件，当用户点击部署时触发
    RED.events.on('deploy', function() {
        
        try {
            // 1. 获取当前工作区的所有节点数据
            var allNodes = RED.nodes;
            console.log("开始处理composition");
            console.log("获取 到allNodes:",allNodes);

            // 2. 找到你的 Composition 节点

            var compositionNodes = getNodesByType("Composition");
            console.log("获取 到compositionNode:",compositionNodes);
            const compositionNode = JSON.stringify(compositionNodes[0], null, 2);
            console.log("获取到对应节点:",compositionNode);
            if (!compositionNode) {
                console.log('[Composition Editor] 🟡 警告：未找到 Composition 节点，跳过处理');
                return; // 退出，不报错
            }

            if (compositionNode) {
                console.log('[Composition Editor] 捕获到部署事件，准备处理数据...');

                try {
                    var standardData = convertToStandardFormat(compositionNode);

                    console.log('[Composition Editor] 转换后的标准格式:', standardData);

                    // 5. 通过 AJAX 发送给后端
                    // 注意：不能再用标准 fetch，要用 RED.library 的 ajax 方法，带鉴权
                    $.ajax({
                        url: '/composition/handle-deploy', // 自定义的后端路由
                        type: 'POST',
                        data: JSON.stringify(standardData),
                        contentType: 'application/json',
                        success: function() {
                            console.log('[Composition Editor] 数据发送成功');
                        },
                        error: function(err) {
                            console.error('[Composition Editor] 数据发送失败:', err);
                        }
                    });

                } catch (e) {
                    console.error('处理节点参数失败:', e);
                }
            }
        } catch (e){
            console.error('[Composition Editor] 部署事件处理总线错误:', e);
        }
        
    });

    function convertToStandardFormat(compositionNode) {

        let paramsArray = compositionNode.nodeParams;

        const actionParams = {};
        paramsArray.forEach(param => {
            const paramName = param.name; // 例如: "location", "event_type"
            actionParams[paramName] = {
                type: param.type,
                description: param.desc
            };
        });

        // 4. 组装最终的标准格式
        const result = {
            action_name: compositionNode.compositionName,
            description: compositionNode.description,
            action_params: actionParams
        };

        return result;
    }

    function getNodesByType(type) {
        const targetTypes = Array.isArray(type) ? type : [type];
        const foundNodes = [];

        RED.nodes.eachNode(function(node) {
            if (targetTypes.includes(node.type)) {
                foundNodes.push(node);
            }
        });

        return foundNodes;
    }
</script>
