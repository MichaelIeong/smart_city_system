<script type="text/html" data-template-name="Composition">
    <div class="form-row">
        <label for="node-input-composition-name"><i class="fa fa-tag"></i> Composition Name</label>
        <select id="node-input-composition-name">
            <option value="">请选择服务</option>
        </select>
    </div>

    <input type="hidden" id="node-input-project-id"/>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Composition', {
        category: 'Service Composition',
        color: "#a0d468",
        defaults: {
            compositionName: { value: "" },        // 保存选中的 id
            compositionNameLabel: { value: "" },   // 保存选中的 name
            projectId: { value: "1" }
        },
        inputs: 1,
        outputs: 0,
        icon: "cog.svg",
        label: function () {
            return this.compositionNameLabel
                ? "Composition : " + this.compositionNameLabel
                : "Composition";
        },
        oneditprepare: function () {
            var node = this;
            var projectId = 1;
            var $compositionSelect = $("#node-input-composition-name");

            $compositionSelect.empty().append('<option value="">请选择服务</option>');

            // 请求 EnvServiceInfo 列表
            $.get("http://127.0.0.1:8080/api/env-services?projectId=" + projectId, function (data) {
                if (Array.isArray(data)) {
                    data.forEach(function (service) {
                        $compositionSelect.append(
                            $("<option>", { value: service.id, text: service.envServiceName })
                        );
                    });
                    if (node.compositionName) {
                        $compositionSelect.val(node.compositionName);
                    }
                }
            });
        },
        oneditsave: function () {
            var selectedOption = $("#node-input-composition-name option:selected");
            this.compositionName = selectedOption.val();        // id
            this.compositionNameLabel = selectedOption.text();  // name
            this.projectId = $("#node-input-project-id").val();
        }
    });
</script>
