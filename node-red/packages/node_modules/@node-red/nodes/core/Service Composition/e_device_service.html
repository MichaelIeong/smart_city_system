<script type="text/html" data-template-name="Social Service2">
    <div class="form-row">
        <label for="node-input-socialResourceLabel"><span> 社会服务名称 </span></label>
        <select id="node-input-socialResourceLabel" class="form-control">
            <!-- 选项由 JS 动态加载 -->
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-details"><span> 社会服务描述 </span></label>
        <textarea id="node-input-details" class="form-control" rows="3" readonly></textarea>
    </div>
    
    <div class="form-row">
        <label><span> 参数列表 </span></label>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th> 参数名 </th>
                    <th> 参数类型 </th>
                    <th> 参数说明 </th>
                    <th> 组合节点映射名称 </th>
                </tr>
            </thead>
            <tbody id="param-body">
                <!-- 表格内容由 JS 动态生成 -->
            </tbody>
        </table>
        <!-- 隐藏域用于保存数据到 Node-RED 节点 -->
        <input type="hidden" id="node-input-nodeParams">
    </div>

    

    <style>
        /* 为参数列表表格添加边框和更大的列间距 */
        #param-body tr {
            border-bottom: 1px solid #ddd; /* 行底部分割线 */
        }
        
        #param-body th,
        #param-body td {
            padding: 12px 20px; /* 增加内边距，增大列间距 */
            border-right: 1px solid #eee; /* 列之间的竖线 */
            text-align: left;
        }
        
        /* 最后一列去掉右边框 */
        #param-body th:last-child,
        #param-body td:last-child {
            border-right: none;
        }
        
        /* 表头背景色可选 */
        #param-body th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        </style>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Social Service2', {
        category: '服务组合',
        color: "#a5d4d4",
        defaults: {
            socialResourceLabel: { value: "" },     // 保存 description (显示文本)
            socialResourceDetails: { value: "" },   // 具体描述细节
            nodeParams: { value: "[]" },                // 参数列表
            func: { value: "" }                     // 保存 url
        },
        inputs: 1,
        outputs: 1,
        icon: "users.svg",
        label: function () {
            return this.socialResourceLabel ? "社会服务2 : " + this.socialResourceLabel : "社会服务2";
        },
        paletteLabel: "社会服务2",

        oneditprepare: function () {
            var node = this;

            var  $socialResourceLabel =  $ ("#node-input-socialResourceLabel");
            var  $socialResourceDetails =  $ ("#node-input-details");
            var  $paramBody =  $ ("#param-body");
            var  $hiddenInput =  $ ("#node-input-nodeParams");

            node.currentParamData = [];
            if (node.nodeParams && typeof node.nodeParams === "string") {
                try {
                    node.currentParamData = JSON.parse(node.nodeParams);
                    console.log("从 node.nodeParams 初始化 node.currentParamData:", node.currentParamData);
                } catch(e) {
                    console.warn("Could not parse initial nodeParams:", e);
                    node.currentParamData = [];
                }
            } else {
                console.log("node.nodeParams 为空，初始化 node.currentParamData 为 []");
            }

            // --- 修改：将 input 事件处理逻辑提取为独立函数 ---
            function handleInputChange() {
                const  $input =  $ (this);
                const index = parseInt( $input.attr("data-param-index"));

                if (!isNaN(index) && index >= 0 && index < node.currentParamData.length) {
                    console.log(`Input event - Index:  $ {index}, New Value: " $ { $ input.val()}"`);
                    // 注意：这里需要先更新数据，再渲染，否则渲染时会用旧值覆盖输入的新值
                    node.currentParamData[index].mappingName =  $input.val();
                    console.log("Updated node.currentParamData:", node.currentParamData);
                    renderParamTable(); // 调用渲染函数
                } else {
                    console.warn("Invalid index in input handler:", index, "Length:", node.currentParamData.length);
                }
            }
            // --- 结束修改 ---

            // --- 修改：统一渲染函数，包含事件绑定 ---
            function renderParamTable() {
                console.log("Rendering Param Table. Current Data:", node.currentParamData);

                $paramBody.empty(); // 清空现有内容

                if (Array.isArray(node.currentParamData) && node.currentParamData.length > 0) {
                    node.currentParamData.forEach(function (param, index) {
                        var row =  $ ("<tr>");
                        row.append( $ ("<td>").text(param.key || ""));
                        row.append( $ ("<td>").text(param.type || ""));
                        row.append( $ ("<td>").text(param.desc || ""));
                        var mappingCell =  $ ("<td>");
                        var inputId = "param-mapping-input-" + index;
                        var mappingInput =  $ ("<input type='text' placeholder='请输入映射名称' id='" + inputId + "'>")
                            .val(param.mappingName || "")
                            .attr("data-param-index", index);
                        mappingCell.append(mappingInput);
                        row.append(mappingCell);
                    });
                } else {
                    $paramBody.append( $ ("<tr><td colspan='4'>无参数</td></tr>"));
                }

                // --- 在渲染完成后，为所有输入框绑定事件 ---
                $paramBody.off("input", "input[type='text']").on("input", "input[type='text']", handleInputChange);
                // --- 结束绑定 ---

                // 渲染完成后，再次更新隐藏域以反映最新状态
                updateHiddenInput();
            }
            // --- 结束修改 ---

            // ... (加载下拉框数据的代码，保持不变) ...
            $ .getJSON("http://127.0.0.1:8080/api/socialResources/services", function (data) {
                // ... (加载下拉框选项的代码，保持不变) ...
                if (!data || !Array.isArray(data)) {
                    console.error("Invalid data format", data);
                    return;
                }

                $socialResourceLabel.empty();
                $socialResourceLabel.append('<option value="">-- 请选择服务 --</option>');
                
                data.forEach(function (item) {
                    // 假设后端返回 { "value": "id", "label": "description" }
                    $socialResourceLabel.append(
                        $("<option></option>").val(item.label).text(item.label)
                    );
                });
                if (node.socialResourceLabel) {
                    $socialResourceLabel.val(node.socialResourceLabel);
                    $socialResourceLabel.trigger("change");
                }
            }).fail(function (xhr, status, error) {
                console.error("Failed to load services:", status, error);
            });

            // 4. 绑定下拉框 change 事件 (核心逻辑)
            $socialResourceLabel.off("change").on("change", function () {
                var selectedValue =  $ (this).val();
                var selectedLabel =  $ (this).find("option:selected").text();

                $socialResourceDetails.val("");

                if (!selectedValue) {
                    node.currentParamData = [];
                    renderParamTable(); // 调用渲染函数
                    return;
                }

                // 4.1 获取详情 (调用 /details 接口)
                $ .get("http://127.0.0.1:8080/api/socialResources/details", {
                    description: selectedValue
                }, function (details) {
                    $socialResourceDetails.val(details);
                    node.socialResourceDetails = details;
                }).fail(function () {
                    $socialResourceDetails.val("描述加载失败");
                });

                // 4.2 获取参数列表 (调用 /params 接口)
                $ .get("http://127.0.0.1:8080/api/socialResources/params", {
                    description: selectedValue
                }, function (paramJsonString) {
                    try {
                        var paramArray = JSON.parse(paramJsonString);
                        console.log("参数列表1 (from API):", paramArray);

                        const newCurrentParamData = [];
                        const existingMap = new Map(node.currentParamData.map(p => [` $ {p.key}- $ {p.type}- $ {p.desc}`, p]));

                        paramArray.forEach(param => {
                            const key = ` $ {param.key}- $ {param.type}- $ {param.desc}`;
                            const existingItem = existingMap.get(key);
                            if (existingItem) {
                                newCurrentParamData.push({ ...param, mappingName: existingItem.mappingName });
                            } else {
                                newCurrentParamData.push({ ...param, mappingName: "" });
                            }
                        });

                        node.currentParamData = newCurrentParamData;
                        console.log("Reconstructed node.currentParamData:", node.currentParamData);

                        renderParamTable(); // 调用渲染函数

                    } catch (e) {
                        console.error("解析参数JSON失败:", e);
                        node.currentParamData = [];
                        renderParamTable(); // 渲染空状态
                    }
                }).fail(function () {
                    console.error("参数加载失败");
                    node.currentParamData = [];
                    renderParamTable(); // 渲染空状态
                });
            });

            function updateHiddenInput() {
                const jsonString = JSON.stringify(node.currentParamData);
                console.log("Updating hidden input with:", jsonString);
                $hiddenInput.val(jsonString);
                // node.nodeParams = jsonString; // 确保这行被注释掉
            }
        },

        oneditsave: function() {
            if (Array.isArray(this.currentParamData)) {
                this.nodeParams = JSON.stringify(this.currentParamData);
                console.log("Saving nodeParams:", this.nodeParams);
            } else {
                this.nodeParams =  $ ("#node-input-nodeParams").val();
            }
        }

    });
</script>
