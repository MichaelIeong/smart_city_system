<script type="text/html" data-template-name="Device Service2">
    <div class="form-row">
        <label for="node-input-deviceType"><i class="fa fa-window-restore"></i> 设备类型</label>
        <select id="node-input-deviceType">
            <option value="" disabled selected> 选择设备类型</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-deviceService"><i class="fa fa-cogs"></i> 设备功能</label>
        <select id="node-input-deviceService">
            <option value="" disabled selected> 选择设备功能</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-deviceCommand"><i class="fa fa-cogs"></i> 设备指令</label>
        <select id="node-input-deviceCommand">
            <option value="" disabled selected> 选择设备指令</option>
        </select>
    </div>

    <div class="form-row">
        <label>设备服务参数</label>
        <table id="param-table" class="node-table">
            <thead>
                <tr>
                    <th> 参数名称 </th>
                    <th> 参数类型 </th>
                    <th> 参数描述 </th>
                    <th> 对应组合节点参数名称 </th>
                </tr>
            </thead>
            <tbody id="param-body">
                <!-- 动态行将插入到这里 -->
            </tbody>
        </table>
    </div>
    <!-- 👇 隐藏域：用于保存数据到节点配置中 -->
    <input type="hidden" id="node-input-nodeParams" name="nodeParams" />

    <input type="hidden" id="node-input-device-id"/>

    <style>
        /* 为参数列表表格添加边框和更大的列间距 */
        #param-body tr {
            border-bottom: 1px solid #ddd; /* 行底部分割线 */
        }
        
        #param-body th,
        #param-body td {
            padding: 12px 20px; /* 增加内边距，增大列间距 */
            border-right: 1px solid #eee; /* 列之间的竖线 */
            text-align: left;
        }
        
        /* 最后一列去掉右边框 */
        #param-body th:last-child,
        #param-body td:last-child {
            border-right: none;
        }
        
        /* 表头背景色可选 */
        #param-body th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
    </style>
</script>

<script type="text/javascript">
    RED.nodes.registerType('Device Service2', {
        category: '服务组合',
        color: "#efa1f8",
        defaults: {
            deviceType: { value: "" },
            deviceTypeName: { value: "" },
            deviceService: { value: "" },
            deviceServiceName: { value: "" },
            deviceId: { value: "" },
            deviceCommand: { value: "" },
            deviceCommandCN: { value: "" },
            nodeParams: { value: "[]" }
        },
        inputs: 1,
        outputs: 1,
        icon: "light.svg",
        label: function () {
            return this.deviceTypeName ? "设备服务 : " + this.deviceTypeName : "设备服务";
        },
        paletteLabel: "设备服务",
        oneditprepare: function () {
            var node = this;
            var deviceTypeSelect = $("#node-input-deviceType");
            var deviceServiceSelect = $("#node-input-deviceService");
            var deviceIdInput = $("#node-input-device-id");
            var deviceCommandSelect = $("#node-input-deviceCommand");
            var $paramBody = $("#param-body");
            var $hiddenInput = $("#node-input-nodeParams");

            // 获取当前页面的 URL
            var urlParams = new URLSearchParams(window.location.search);
            var gridId = urlParams.get('gridId'); 

            console.log("从URL获取的gridId:", gridId);

            // 如果没有 gridId，可以给个默认提示或退出
            if (!gridId) {
                $.notify("未找到 gridId 参数", "error");
                return;
            }

            // --- 加载设备类型 ---
            $.getJSON("http://10.176.65.202:8080/api/devices/types/byGridId?gridId=" + gridId, function (data) {
                if (!data || !Array.isArray(data)) {
                    console.error("Invalid device types data", data);
                    return;
                }

                deviceTypeSelect.empty().append('<option value="">-- 请选择设备类型 --</option>');
                data.forEach(function(item) {
                    deviceTypeSelect.append(
                        $("<option></option>")
                            .val(item.value)
                            .text(item.label)
                    );
                });
                

                if (node.deviceType) {
                    deviceTypeSelect.val(node.deviceType);
                    // 触发 change 以加载对应的功能列表
                    deviceTypeSelect.trigger("change");
                }
            }).fail(function(xhr, status, error) {
                 console.error("Failed to load device types:", status, error, xhr.responseText);
            });

            // --- 监听设备类型变化 ---
            deviceTypeSelect.off("change").on("change", function () {
                var selectedProductId = $(this).val();
                console.log("选中的设备类型id:", selectedProductId); // Debug log

                // 更新 deviceId
                deviceIdInput.val(selectedProductId);

                // 清空功能下拉框和参数表
                deviceServiceSelect.empty().append('<option value="" disabled selected>选择设备功能</option>');
                $paramBody.empty();
                $hiddenInput.val("[]");

                if (!selectedProductId) {
                    console.log("No product ID selected, skipping function load.");
                    return;
                }

                // 根据设备类型id加载对应的功能(function)列表
                $.getJSON("http://10.176.65.202:8080/api/product_function/functions", {
                    typeId: selectedProductId
                }, function (funcList) {
                    console.log("*******获取到的功能列表:****", funcList); // Debug log
                    if (!Array.isArray(funcList)) {
                        console.error("Invalid function list data for type", selectedProductId, funcList);
                        return;
                    }

                    deviceServiceSelect.empty();
                    funcList.forEach(function(funcName) {
                        deviceServiceSelect.append(
                            $("<option></option>")
                                .val(funcName)
                                .text(funcName)
                        );
                    });

                    // 尝试恢复之前保存的功能选择
                    if (node.deviceService) {
                        // 如果 node.deviceService 存在，则尝试设置它
                        deviceServiceSelect.val(node.deviceService);
                        console.log("Set deviceService to saved value:", node.deviceService); // Debug log
                    } else {
                        // 如果没有保存的值，且列表中有项，则默认选中第一项
                        if (funcList.length > 0) {
                            deviceServiceSelect.val(funcList[0]);
                            console.log("Set deviceService to first available value:", funcList[0]); // Debug log
                        }
                    }

                    // 不管是否设置了值，都触发一次 change 事件
                    // 这样可以确保参数列表被加载
                    deviceServiceSelect.trigger("change");
                }).fail(function(xhr, status, error) {
                    console.error("Failed to load functions for type", selectedProductId, ":", status, error, xhr.responseText);
                });
            });

            // --- 监听设备功能变化，加载command ---
            deviceServiceSelect.off("change").on("change", function () {
                var selectedFunction = $(this).val();
                var selectedProductId = deviceTypeSelect.val(); // 获取当前选中的产品ID

                deviceCommandSelect.empty().append('<option value="" disabled selected>选择设备指令</option>');
                $paramBody.empty();
                $hiddenInput.val("[]");

                console.log("Device Function changed to:", selectedFunction); // Debug log

                // 每次功能变化都清空表格和隐藏域
                $paramBody.empty();

                // 检查条件：只有当产品ID和功能都有效时才请求参数
                if (!selectedProductId || !selectedFunction) {
                    console.log("Product ID or Function is missing, skipping params request.", "PID:", selectedProductId, "Func:", selectedFunction); // Debug log
                    if (!selectedFunction) {
                        // 如果只是功能未选择，显示提示
                        $paramBody.append('<tr><td colspan="3">请选择设备功能</td></tr>');
                        updateParamsHiddenInput();
                    }
                    return;
                }

                //发起请求获取command
                console.log("*****当前选中设备功能*******", selectedFunction); // Debug log

                $.getJSON("http://10.176.65.202:8080/api/product_function/f-commands?functionName="+selectedFunction, function(commandList) {
                    console.log("获取到的设备command列表:", commandList);

                    if (!Array.isArray(commandList)) {
                        console.error("Invalid function list data for type", commandList);
                        return;
                    }

                    commandList.forEach(function(command){
                        deviceCommandSelect.append(
                            $("<option></option>")
                                .val(command.value)
                                .text(command.label)
                        );
                    });

                    if (node.deviceCommand) {
                        // 如果 node.deviceCommand 存在，则尝试设置它
                        deviceCommandSelect.val(node.deviceCommand);
                        console.log("****设备指令设置为:****",node.deviceCommand); // Debug log
                    } else {
                        // 如果没有保存的值，且列表中有项，则默认选中第一项
                        if (commandList.length > 0) {
                            deviceCommandSelect.val(commandList[0]);
                            console.log("设备指令设置为第一个:", commandList[0]); // Debug log
                        }
                    } 
                    
                    deviceCommandSelect.trigger("change");
                })
            });
                
            //根据选中指令读取参数列表
            deviceCommandSelect.off("change").on("change", function (){
                var selectedCommand = deviceCommandSelect.val();

                console.log("当前选中的指令：",selectedCommand);
                //根据选中的设备指令获取参数列表
                $.getJSON("http://10.176.65.202:8080/api/product_function/c-commandJson", {
                    commandId: selectedCommand // 这里传递的是 typeId
                }, function (responseData) {
                    console.log("获取到指令对应的参数列表：", responseData); // Debug log
                    $paramBody.empty(); // 再次清空，以防网络延迟导致显示旧数据

                    // 检查响应数据是否为空
                    if (!responseData || 
                        (Array.isArray(responseData) && responseData.length === 0) || 
                        (typeof responseData === 'object' && responseData !== null && Object.keys(responseData).length === 0)) {
                        console.log("Response data is empty, showing 'no params' message."); // Debug log
                        $paramBody.append('<tr><td colspan="3">该功能无参数</td></tr>');
                        return;
                    }

                    var paramsArray = [];
                    // 根据数据类型进行处理
                    if (Array.isArray(responseData)) {
                        console.log("Processing response as Array of Objects"); // Debug log
                        paramsArray = responseData.map(item => {
                            if (typeof item !== 'object' || item === null) {
                                console.warn("Skipping non-object item in response array:", item); // Debug log
                                return { name: '未知参数', type: '未知', desc: String(item) };
                            }
                            return {
                                name: item.name || item.key || '未知参数',
                                type: item.type || '未知类型',
                                desc: item.desc || item.description || '无描述'
                            };
                        });
                    } else if (typeof responseData === 'object') {
                        console.log("Processing response as Object"); // Debug log
                        paramsArray = objectToParamsArray(responseData);
                    } else if (typeof responseData === 'string') {
                        console.log("Processing response as String (attempting parse)"); // Debug log
                        try {
                            var parsedData = JSON.parse(responseData);
                            if (Array.isArray(parsedData)) {
                                paramsArray = parsedData.map(item => {
                                    if (typeof item !== 'object' || item === null) {
                                         console.warn("Skipping non-object item in parsed array:", item); // Debug log
                                         return { name: '未知参数', type: '未知', desc: String(item) };
                                    }
                                    return {
                                        name: item.name || item.key || '未知参数',
                                        type: item.type || '未知类型',
                                        desc: item.desc || item.description || '无描述'
                                    };
                                });
                            } else if (typeof parsedData === 'object') {
                                 paramsArray = objectToParamsArray(parsedData);
                            } else {
                                throw new Error("Parsed data is not an object or array");
                            }
                        } catch (e) {
                            console.error("JSON Parse Error for response:", responseData, "Error:", e);
                            $paramBody.append('<tr><td colspan="3">参数数据格式错误</td></tr>');
                            updateParamsHiddenInput();
                            return;
                        }
                    } else {
                         console.error("Unexpected response data type:", typeof responseData, "Value:", responseData);
                         $paramBody.append('<tr><td colspan="3">参数数据格式错误</td></tr>');
                         updateParamsHiddenInput();
                         return;
                    }

                    // 读取已保存的数据 (从隐藏域)
                    var savedDataStr = $hiddenInput.val(); // 获取隐藏域的值
                    console.log("A:",savedDataStr);
                    console.log("B:",paramsArray);
                    var savedMappings = {};

                    // 尝试解析 JSON，如果为空数组或解析失败则设为空对象
                    try {
                        var savedParams = JSON.parse(savedDataStr) || [];
                        // 将保存的数组转换为 { originalName: mappingKey } 的对象格式，方便查找
                        savedParams.forEach(function(savedItem) {
                            // 确保 savedItem 有 name 和 mappingKey
                            if (savedItem && savedItem.name && savedItem.mappingKey) {
                                savedMappings[savedItem.name] = savedItem.mappingKey;
                            }
                        });
                    } catch (e) {
                        console.error("解析保存数据失败:", e);
                    }

                    // ✅ 2. 【关键步骤】混合数据：给 paramsArray 注入 mappingKey
                    var finalParams = paramsArray.map(function(param) {
                        var newItem = Object.assign({}, param); // 浅拷贝，避免直接修改原始定义

                        // 检查 savedMappings 中是否有这个参数的记录
                        if (savedMappings[param.name]) {
                            newItem.mappingKey = savedMappings[param.name];
                        }

                        return newItem;
                    });

                    // 渲染表格
                    if (finalParams.length > 0) {
                        console.log("Rendering params table with", finalParams.length, "items"); // Debug log
                        console.log("显示参数列表:",finalParams);
                        console.log("显示映射键：",finalParams.mappingKey);
                        renderParamTable(finalParams);
                    } else {
                        // 这个分支理论上不应该到达，因为我们已经处理了空数组/对象的情况
                        console.warn("Params array is empty after processing, showing 'no params' message."); // Debug log
                        $paramBody.append('<tr><td colspan="3">该功能无参数</td></tr>');
                    }

                    updateParamsHiddenInput();
                }).fail(function(xhr, status, error) {
                    console.error("Failed to load params:", status, error, xhr.responseText); // Debug log
                    $paramBody.empty().append('<tr><td colspan="3">加载参数失败</td></tr>');
                    updateParamsHiddenInput();
                });

                // 当用户修改映射名时，实时更新隐藏域
                $paramBody.off("change", ".param-mapping-input").on("change", ".param-mapping-input", function() {
                    updateParamsHiddenInput();
                });

            })
                
        

            function updateParamsHiddenInput() {
                var params = [];
                $paramBody.find("tr").each(function() {
                    var $tr = $(this);
                    var cells = $tr.find("td");
                    if (cells.length >= 3) {

                        // 获取原始参数名 (第一列文本)
                        var originalName = $(cells[0]).text().trim();
                        
                        // 【关键】获取映射后的参数名 (第四列 input 的值)
                        // 如果 input 为空，则回退到原始名
                        var $input = $(cells[3]).find("input.param-mapping-input");
                        var mappingName = $(this).find(".param-mapping-input").val().trim();
                        var mappingKey = $(this).val();
                        
                        // 获取类型和描述
                        var type = $(cells[1]).text().trim();
                        var desc = $(cells[2]).text().trim();

                        params.push({
                            // 策略：将用户输入的名称直接存入 name 字段
                            // 这样读取时，param.name 就是 "地点"
                            name: originalName,

                            // 保留原始名称在另一个字段，防止用户清空输入框
                            mappingKey: mappingName || mappingKey || originalName,
                            type: type,
                            desc: desc
                        });
                    }
                });
                $hiddenInput.val(JSON.stringify(params));
            }
        },
        
        oneditsave: function () {
            this.deviceType = $("#node-input-deviceType").val();
            this.deviceTypeName = $("#node-input-deviceType option:selected").text();
            this.deviceCommandCN = $("#node-input-deviceCommand option:selected").text();
            this.deviceService = $("#node-input-deviceService").val();
            this.deviceServiceName = $("#node-input-deviceService option:selected").text();

            try {
                this.nodeParams = $("#node-input-nodeParams").val();
            } catch (e) {
                this.nodeParams = "[]";
            }
        }
    });

    // 辅助函数：将对象转换为参数数组 (保持兼容性，用于处理 { "ip": {...} } 格式)
    function objectToParamsArray(obj) {
        var arr = [];
        for (var key in obj) {
            if (obj.hasOwnProperty(key)) {
                var item = obj[key];
                var param = { name: key };

                if (typeof item === 'string' || typeof item === 'number') {
                    param.type = typeof item;
                    param.desc = item;
                } else if (typeof item === 'object' && item !== null) {
                    param.type = item.type || typeof item;
                    param.desc = item.desc || item.description || '无';
                } else {
                    param.type = typeof item;
                    param.desc = '复杂对象';
                }
                arr.push(param);
            }
        }
        return arr;
    }

    function renderParamTable(params) {
        const $tbody = $("#param-body");
        $tbody.empty(); // 清空现有数据

        params.forEach(function(param, index) {
            // 构建映射键的默认值 (可以是原参数名，也可以为空)
            const defaultMappingKey = param.mappingKey || "";
            var $tr = $("<tr>").attr("data-param-index", index);
            console.log("param.name=",param.name);
            console.log("param.mappingKey=",param.mappingKey);

            // 创建表格行
            var row = `
                <tr data-param-index="${index}">
                    <td>${param.name}</td>
                    <td>${param.type}</td>
                    <td>${param.desc}</td>
                    <td>
                        <input type="text" 
                            class="param-mapping-input" 
                            value="${defaultMappingKey}" 
                            placeholder="输入映射名"
                            data-original-name="${param.mappingKey || param.name}"
                            style="pointer-events: auto; background-color: rgba(255,255,255,0.9); width: 100%; box-sizing: border-box;"
                        >               
                    </td>
                    
                </tr>
            `;
            $tbody.append(row);

            $tr.find('.param-mapping-input').on('change input', function() {
                updateParamsHiddenInput(); // 输入时立即更新隐藏域
            });
        });


        // 映射输入框变化事件 (可选：用于实时保存映射关系)
        $('.param-mapping-input').off('change').on('change', function() {
            var originalName = $(this).data('original-name');
            var newName = $(this).val();
            console.log(`参数映射变更: ${originalName} -> ${newName}`);
            // 这里可以将映射关系保存到节点配置中
        });
    }

</script>
