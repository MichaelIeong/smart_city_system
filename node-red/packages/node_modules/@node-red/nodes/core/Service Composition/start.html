<script type="text/html" data-template-name="start">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Enter node name">
    </div>

    <div class="form-row">
        <label for="node-input-space"><i class="fa fa-cube"></i> Space</label>
        <select id="node-input-space">
            <option value="" disabled selected>Select Space</option>
        </select>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('start', {
        category: 'Service Composition',
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            space: { value: "" }
        },
        inputs: 0,
        outputs: 1,
        icon: "file.svg",
        label: function () {
            return this.name || "Start";
        },
        oneditprepare: function () {
            var node = this;
            var $spaceSelect = $("#node-input-space");

            // 初始化默认项
            $spaceSelect.empty().append('<option value="">请选择空间</option>');

            // 请求空间列表
            $.get("http://127.0.0.1:8080/api/spaces/allspace", function (data) {
                if (Array.isArray(data)) {
                    data.forEach(function (space) {
                        $spaceSelect.append(
                            $('<option>', { value: space.id, text: space.spaceName })
                        );
                    });

                    if (node.space) {
                        $spaceSelect.val(node.space);
                    } else {
                        $spaceSelect.val("");
                    }
                }
            });

            // 当选择空间时，请求设备类型并保存到全局
            $spaceSelect.on("change", function () {
                var spaceId = $(this).val();
                if (spaceId) {
                    $.get("http://127.0.0.1:8080/api/deviceTypes/byspace?spaceId=" + spaceId,
                        function (data) {
                            if (Array.isArray(data)) {
                                // ⚠️ 不能用 RED.settings.set，这里只能临时存到节点配置
                                node.deviceTypes = data;  // 把数据挂在 node 上，保存时写入配置
                            }
                        }
                    );
                } else {
                    node.deviceTypes = [];
                }
            });
        },
        oneditsave: function () {
            this.name = $("#node-input-name").val();
            this.space = $("#node-input-space").val();
        }
    });
</script>
